const CHAT_FALLBACK='うまく読み取れませんでした。次のような質問に答えられます。\n'
  +'・バンカーの3枚目の条件は？／バンカー4でプレイヤーの3枚目が8なら？\n・今バンカーは引く？（3枚目の判定の場面で）\n・誰が絞るの？\n・バンカー350のコミッションは？／タイ200の配当は？\n・ドラゴンボーナスの配当は？\n・回収と配当の順番は？\n・英語のコール一覧／今のルールは？／次は何をすればいい？';

function chatAnswer(G,raw){
  const q=chatNorm(raw);
  if(!q)return{text:'質問を入力してください。'};
  try{
    /* 1. 状況を指定した3枚目の判定（数字が入っているもの） */
    let r=chatDrawCalc(q);if(r)return r;
    /* 2. いま卓に見えているカードでの判定 */
    r=chatDrawContext(G,q);if(r)return r;
    /* 3. 金額つきの配当・コミッション計算（「今の…350」のような聞き方でもルール質問より先に拾う） */
    r=chatCalc(G,q);if(r)return r;
    /* 4. 次の一手・ヒット */
    if(/次(?:は|に|って)?\s*(?:何|なに|どう)|つぎ(?:は)?\s*(?:何|なに)|何をすれば|どうすれば|何すれば|ヒント|わからん|分からない|わからない|詰まった/.test(q))return chatNextStep(G);
    /* 5. 今のルール・今の点数 */
    if(/(今|いま|現在|このテーブル|この台).*(ルール|コミッション|方式)/.test(q)||/^ルール(は|を)?/.test(q)){
      const T=G.table;return{text:`いまのテーブル：${ruleSummary(T)}\n${T.rule.desc}`};
    }
    if(/(今|いま|現在).*(点数|合計|何点)/.test(q)){
      const F=G.flags||{};
      if(!F.openedP&&!F.openedB)return{text:'まだカードが開いていないので、点数は答えられません。'};
      const p=F.openedP?`プレイヤー${handTotal(G.pCards)}（${handText(G.pCards)}）`:'プレイヤー未オープン';
      const b=F.openedB?`バンカー${handTotal(G.bCards)}（${handText(G.bCards)}）`:'バンカー未オープン';
      return{text:`${p}、${b}`};
    }
    /* 6. 知識ベース（キーワードの当たり数が多いものを採用。同点は先頭の項目） */
    let best=null,bestN=0;
    for(const e of CHAT_KB){
      const n=e.k.reduce((a,re)=>a+(re.test(q)?1:0),0);
      if(n>bestN){best=e;bestN=n;}
    }
    if(best){
      const a=typeof best.a==='function'?best.a(G,q):best.a;
      return typeof a==='object'?a:{text:a,hint:false};
    }
    return{text:CHAT_FALLBACK};
  }catch(err){
    return{text:'回答の生成中に問題が起きました。質問の言い方を変えてみてください。'};
  }
}

/* ===== 共通キット（4ゲームで同じ内容。直すときは全ゲームをそろえる） =====
   ・チップ・カウンティングのコツ（金額→額面×枚数への分解、検算、ミスの切り分け）
   ・効果音と振動（正解・ミス・チップを置く音。外部ファイルを使わずその場で合成）
   ・ルールブックのシート（rules.html をゲームの上に重ねて開く）
   各ゲームの CHIPS（使えるチップの額面、高額順）・minChips・chipsText・fmt$ を前提にする。 */

/* ---- チップ・カウンティング ---- */
const CHIP_COLOR={1:'白',5:'赤',10:'青',25:'緑',50:'橙',100:'黒',500:'紫',1000:'金'};
function chipCounts(arr){const m={};arr.forEach(d=>{m[d]=(m[d]||0)+1;});return m;}
/* 最少枚数での内訳 [{d:額面,n:枚数}, …]（高額から） */
function chipPlan(amount){const m=chipCounts(minChips(amount));return CHIPS.filter(d=>m[d]).map(x=>({d:x,n:m[x]}));}
function planText(amount){
  const pl=chipPlan(amount),n=pl.reduce((a,x)=>a+x.n,0);
  return `${fmt$(amount)} ＝ ${pl.map(x=>`$${x.d}×${x.n}`).join(' ＋ ')}（${n}枚）`;
}
/* n枚を5枚単位に区切った数え方。7→「5＋2」、12→「5＋5＋2」、20→「5×4」 */
function groupBy5(n){
  if(n<=5)return String(n);
  const full=Math.floor(n/5),rest=n%5;
  const head=full<=3?Array(full).fill(5).join('＋'):`5×${full}`;
  return rest?`${head}＋${rest}`:head;
}
/* 出した額と正解のズレから、枚数の数え間違いか金額の暗算ミスかを切り分ける */
function chipDiagnosis(sum,amount){
  const diff=Math.round((sum-amount)*100)/100,ad=Math.abs(diff),more=diff>0?'多い':'少ない';
  if(ad===0)return '';
  if(CHIPS.includes(ad))
    return `差は${fmt$(ad)}（${CHIP_COLOR[ad]||''}$${ad}チップ1枚ぶん${more}）。枚数の数え間違いの可能性が高い。5枚ずつ区切って数え直す。`;
  const m=minChips(ad);
  if(m.length<=3&&Number.isInteger(ad))
    return `差は${fmt$(ad)}（${chipsText(m)}）${more}。額面の取り違えか、2〜3枚の数え間違い。色で確かめて数え直す。`;
  return `差は${fmt$(ad)}${more}と大きい。配当額の暗算がずれている可能性。分解からやり直す。`;
}
/* 1つ上の額面に何枚で替わるか（例：赤$5は5枚で緑$25）。このゲームで使う額面の中で探す */
function chipUp(d){const ups=CHIPS.filter(u=>u>d&&u%d===0).sort((a,b)=>a-b);return ups.length?[ups[0]/d,ups[0]]:null;}
function chipEquiv(d){const u=chipUp(d);return u?`${CHIP_COLOR[d]}$${d}は${u[0]}枚で${CHIP_COLOR[u[1]]}$${u[1]}`:null;}
/* 20枚スタックの価値（暗記用） */
function stack20Text(){return '20枚の山の価値：'+CHIPS.slice().sort((a,b)=>a-b).filter(d=>d<1000).map(d=>`${CHIP_COLOR[d]}${fmt$(d*20)}`).join('／');}
/* その場面で使う「出し方のコツ」。withPlan が偽なら内訳そのものは伏せる。
   info.kind：pay（配当）／commission（コミッション）／rake（レーキ）／pot（ポットの払い出し）／
   return（返却）／collect（回収）。info.mult：配当倍率 */
function chipCoach(amount,info,withPlan){
  const lines=[],pl=chipPlan(amount),kind=info&&info.kind,mult=info&&info.mult;
  if(withPlan)lines.push(`内訳：${planText(amount)}。高額の額面から順に取る。`);
  else lines.push(`手を出す前に、金額を「額面×枚数」に分解する。高額の額面（${CHIPS.map(d=>'$'+d).join('→')}）から順に取る。`);
  const eq=pl.filter(x=>x.d!==CHIPS[0]).map(x=>chipEquiv(x.d)).filter(Boolean).slice(0,2);
  lines.push(withPlan&&eq.length?`換算：${eq.join('、')}。同じ額面が並んだら、1つ上の額面に替えて数える。`
    :'換算：'+CHIPS.slice(1).reverse().map(chipEquiv).filter(Boolean).slice(0,3).join('、')+'。同じ額面が並んだら、1つ上の額面に替えて数える。');
  if(kind==='commission')lines.push('コミッションは小額のチップが中心。$1・$5は5枚ずつの組にしてから出すと数え間違いが減る。');
  else if(kind==='rake')lines.push('レーキはポットから取り分け、全員に見える位置で額を示してから入れる。小額チップは5枚1組で。');
  else if(kind==='pot')lines.push('ポットは額面ごとに分け、20枚の山（5枚×4）にしてから数える。押し出す前に「黒何枚、緑何枚」と確認する。');
  else if(kind==='return')lines.push('返す額は「最高額−次点の額」。ベットの山から上の差額だけを切り取って本人の前へ戻す。');
  else if(kind==='collect')lines.push('回収は元金の山を割って取る。半分なら山を2つに切り分け、高さがそろっているかで検算する。');
  else if(mult===1)lines.push('1:1は元金と同額。元金のチップの色と高さを見て、同じ並びを横にそろえる（ミラー）。高さが揃えば検算になる。');
  else if(mult===1.5)lines.push('3:2は「元金＋その半分」。元金と同じ並びを作り、さらに半分の山を足す。半分にしにくい額面は先に崩しておく。');
  else if(mult===0.5)lines.push('半額は元金のスタックを半分に分ける。割り切れない額面は、小さい額面に崩して作る。');
  else if(mult===2)lines.push('2:1は元金の並びを2つ作る（ミラーを2回）。高さが元金と同じ山が2本になれば正解。');
  else lines.push('倍率の大きい配当は、先に暗算で金額を確定してから分解する。チップを出しながら足し算し直さない。');
  lines.push('出し終えたら額面ごとに「黒4、緑3」と声に出して照合し、最後に合計を言う。');
  return lines;
}

/* 出したチップの表示。額面ごとにまとめ、5枚ごとに間をあける（5枚1組で数える練習）。
   withPlan のときは最少枚数の内訳を薄い枠で先に描いておき、出したぶんだけ埋まっていく。 */
function chipStackHTML(chips,amount,withPlan){
  const cnt=chipCounts(chips),plan={};
  if(withPlan&&amount>0)chipPlan(amount).forEach(x=>{plan[x.d]=x.n;});
  const ds=CHIPS.filter(d=>cnt[d]||plan[d]);
  if(!ds.length)return '<span class="stack-empty">まだチップがありません</span>';
  return ds.map(d=>{
    const have=cnt[d]||0,need=plan[d]||0,slots=Math.max(have,need);
    const chipsH=Array.from({length:slots},(_,i)=>{
      const cls=i<have?(need&&i>=need?' over':''):' ghost';
      return `<span class="mini-chip ch-${d}${cls}${i%5===4&&i<slots-1?' g5':''}">${d}</span>`;
    }).join('');
    const state=withPlan&&need?(have===need?' done':have>need?' over':''):'';
    const label=withPlan&&need?`${have}/${need}`:`×${have}${have>5?`（${groupBy5(have)}）`:''}`;
    return `<span class="sg" aria-label="$${d}が${have}枚"><span class="sg-chips">${chipsH}</span><span class="sg-n${state}">${label}</span></span>`;
  }).join('');
}

/* ---- 効果音と振動 ----
   音声ファイルは持たず Web Audio でその場で鳴らす（単一HTMLのまま、通信なしで動かすため）。
   設定の「効果音・振動」で切れる。振動は対応する端末（主にAndroid）だけ。 */
const SFX={
  ctx:null,
  enabled(){try{return !(G&&G.opts&&G.opts.sfx===false);}catch(e){return true;}},
  ac(){
    if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ctx=new A();}
    if(this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;
  },
  tone(f,t,dur,type,vol){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  },
  click(t,f,vol){
    const c=this.ctx,n=Math.floor(c.sampleRate*0.03),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    bp.type='bandpass';bp.frequency.value=f||3200;bp.Q.value=2.2;g.gain.value=vol||0.35;
    s.buffer=b;s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t);
  },
  play(kind){
    if(!this.enabled())return;
    try{
      if(kind==='ng'&&navigator.vibrate)navigator.vibrate(45);
      if(kind==='chip'&&navigator.vibrate)navigator.vibrate(6);
      const c=this.ac();if(!c)return;const t=c.currentTime+0.005;
      if(kind==='ok'){this.tone(988,t,0.10,'sine',0.045);this.tone(1480,t+0.07,0.16,'sine',0.04);}
      else if(kind==='ng'){this.tone(196,t,0.16,'triangle',0.07);this.tone(147,t+0.09,0.22,'triangle',0.06);}
      else if(kind==='chip'){this.click(t,3400,0.32);this.click(t+0.035,2600,0.18);}
      else if(kind==='pay'){[0,0.045,0.09,0.13].forEach((d,i)=>this.click(t+d,3000+i*200,0.26));this.tone(1319,t+0.16,0.14,'sine',0.035);}
      else if(kind==='round'){[784,988,1175,1568].forEach((f,i)=>this.tone(f,t+i*0.08,0.18,'sine',0.04));}
    }catch(e){}
  }
};

/* ---- 実戦のアクシデント ----
   カードが落ちた・めくれた・ボールが落ちた、などの手元の事故に、その場で正しく反応できるかを問う。
   原則：手を止める／独断で直さない（拾う・戻す・入れ替えない）／声に出してフロアを呼ぶ。
   ただしミスディール・ノースピンのように、ディーラーが宣言するのが標準のものは宣言が正解。
   処理の結論はカジノで異なるため「この卓の規定」として示す。
   ゲーム側は ACC[type]={what,why,right,wrongs:[[選択肢,なぜまずいか],…],ruling,call,hand?,resolve(G)} を定義し、
   ラウンド開始時に accPlan、事故が起こりうる場面で accFire、expected() の先頭で accExpected、act() で accAct を呼ぶ。 */
const ACC_RATE={off:0,often:.6};
function accRate(G){const m=(G.opts&&G.opts.accidents)||'normal';if(m in ACC_RATE)return ACC_RATE[m];return [0,.12,.16,.2,.25][currentDifficulty(G).level]||.12;}
/* このラウンドで起こすアクシデント（1ラウンドに最大1回）。G.forceAccident（テスト用）があれば必ずそれ */
function accPlan(G,types){
  if(G.forceAccident)return types.includes(G.forceAccident)?{type:G.forceAccident,forced:true}:null;
  return Math.random()<accRate(G)?{type:types[Math.floor(Math.random()*types.length)]}:null;
}
/* 事故が起こりうる場面で呼ぶ。計画どおりの種類なら発生させて true（計画は消費） */
function accFire(G,type,data){
  const p=G.round&&G.round.accPlan;
  if(!p||p.type!==type||(G.flags&&G.flags.acc))return false;
  G.round.accPlan=null;if(p.forced)G.forceAccident=null;
  const A=ACC[type],n=currentDifficulty(G).level>=3?4:3;
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const opts=shuf([A.right].concat(shuf(A.wrongs.map(w=>w[0])).slice(0,n-1)));
  G.flags.acc=Object.assign({type,opts},data||{});
  addLog(G,{t:'err',el:`アクシデント：${A.what}`});
  return true;
}
function accExpected(G){
  const a=G.flags&&G.flags.acc;if(!a)return null;
  const A=ACC[a.type];
  return E('accident','accident',A.why,A.call,{callSet:{right:A.right,opts:a.opts},acc:a.type,what:A.what});
}
/* 返り値 {cat,ok}。正解なら字幕に宣言、ログにフロアの裁定を出し、規定どおりに状態を直す */
function accAct(G,ex,arg){
  const A=ACC[ex.acc];
  if(arg!==A.right){
    const w=A.wrongs.find(x=>x[0]===arg);
    recordErr(G,'accident',A.why,`その対応はまずい：${w?w[1]:'事故の後は手を止め、独断で直さないのが原則です。'}\n正しくは「${A.right}」。${A.why}`);
    return{cat:'accident',ok:false};
  }
  G.round.ok++;
  const data=G.flags.acc;G.flags.acc=null;
  setCaption(G,A.call);
  addLog(G,{t:'ok',el:`アクシデント対応：${A.right}`,call:A.call});
  addLog(G,{t:'info',el:`フロアの裁定（この卓の規定）：${A.ruling}`});
  G.lastFb={t:'ok',text:`正解：${A.right}\nフロアの裁定（この卓の規定）：${A.ruling}`};
  if(A.resolve)A.resolve(G,data);
  return{cat:'accident',ok:true};
}

/* ===== ディーラー：骨格アニメーション =====
   手先をテーブル上の実座標（シュー・両ハンド・各ベット枠・コミッションボックス・
   ディスカードホルダー）へ運び、肩から肘・手首を逆運動学で描く。
   所作ごとの「どこへ・どの向きに手を出すか」を見て覚えるのが目的なので、
   OS側の「アニメーション削減」設定に関わらず常に再生する。 */
const REDUCED=false;
function elRect(sel){
  const host=$('table'),el=typeof sel==='string'?host&&host.querySelector(sel):sel;
  if(!host||!el)return null;
  const f=host.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-f.left,y:r.top-f.top,w:r.width,h:r.height};
}
function unionRect(sel){
  const host=$('table');if(!host)return null;
  const els=host.querySelectorAll(sel);if(!els.length)return null;
  const f=host.getBoundingClientRect();
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  els.forEach(e=>{const r=e.getBoundingClientRect();
    x1=Math.min(x1,r.left-f.left);y1=Math.min(y1,r.top-f.top);
    x2=Math.max(x2,r.right-f.left);y2=Math.max(y2,r.bottom-f.top);});
  return{x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function ptOf(sel,ax,ay){
  const r=elRect(sel);if(!r)return null;
  return{x:r.x+r.w*(ax===undefined?0.5:ax),y:r.y+r.h*(ay===undefined?0.5:ay)};
}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

      if (e.lash && mood !== 'out') {
        const q = mood === 'happy' ? .25 : 0;
        s += P(`M${pt(xl - r * .8, y - r * (.7 - q))}l${r1(-r * .75)} ${r1(-r * .5)}M${pt(xl - r * .2, y - r * (1 - q))}l${r1(-r * .3)} ${r1(-r * .75)}` +
          `M${pt(xr + r * .8, y - r * (.7 - q))}l${r1(r * .75)} ${r1(-r * .5)}M${pt(xr + r * .2, y - r * (1 - q))}l${r1(r * .3)} ${r1(-r * .75)}`, 'none', k, .9);
      }
    } else if (e.t === 'robot') {
      const rx = e.rx, ry = e.ry;
      if (mood === 'out') {
        s = P(`M${pt(xl - rx, y)}Q${pt(xl, y + ry * .8)} ${pt(xl + rx, y)}M${pt(xr - rx, y)}Q${pt(xr, y + ry * .8)} ${pt(xr + rx, y)}`, 'none', k, 1.5);
      } else {
        const sc = mood === 'surprise' ? 1.15 : 1;
        s = P(E(xl, y, rx * sc, ry * sc) + E(xr, y, rx * sc, ry * sc), '#FFFEFA', ch.pal.k, 1.1);
        if (mood === 'happy') {
          s += P(`M${pt(xl - rx * .6, y + 2)}Q${pt(xl, y - 5)} ${pt(xl + rx * .6, y + 2)}M${pt(xr - rx * .6, y + 2)}Q${pt(xr, y - 5)} ${pt(xr + rx * .6, y + 2)}`, 'none', k, 1.7);
        } else {
          let px = 1.3, py = 1.2, pr = 2.2;
          if (mood === 'think') { px = 0; py = ry * .55; }
          if (mood === 'sad') { px = .6; py = ry * .45; pr = 1.9; }
          if (mood === 'surprise') { px = 0; py = 0; pr = 1.5; }
          s += P(C(xl + px, y + py, pr) + C(xr - px, y + py, pr), k) + P(C(xl + px - .7, y + py - .8, .6) + C(xr - px - .7, y + py - .8, .6), '#fff');
          if (mood === 'sad') s += P(`M${pt(xl - rx, y - ry - 1)}L${pt(xl + rx * .7, y - ry - 4)}M${pt(xr + rx, y - ry - 1)}L${pt(xr - rx * .7, y - ry - 4)}`, 'none', ch.pal.k, 1.4);
        }
      }
    } else if (e.t === 'alien') {
      const rx = e.rx, ry = e.ry, rot = e.rot, oc = e.c, kk = ch.pal.k;
      if (mood === 'happy' || mood === 'out') {
        const d = mood === 'happy'
          ? `M${pt(xl - rx * .8, y + 3)}Q${pt(xl, y - 8)} ${pt(xl + rx * .8, y + 3)}M${pt(xr - rx * .8, y + 3)}Q${pt(xr, y - 8)} ${pt(xr + rx * .8, y + 3)}`
          : `M${pt(xl - rx * .8, y)}Q${pt(xl, y + 6)} ${pt(xl + rx * .8, y)}M${pt(xr - rx * .8, y)}Q${pt(xr, y + 6)} ${pt(xr + rx * .8, y)}`;
        s = P(d, 'none', kk, 5.4) + P(d, 'none', oc, 3.2);
      } else if (mood === 'sad') {
        // しょんぼり：上まぶたが目尻（外側）へ下がる半月目。sg=1 は左目（外側=左）、-1 は右目。
        const half = (x, sg) => `M${pt(x - rx * sg, y + 1)}A${rx} ${ry} 0 0 ${sg > 0 ? 0 : 1} ${pt(x + rx * sg, y - 4.5)}Q${pt(x, y - 2.6)} ${pt(x - rx * sg, y + 1)}Z`;
        s = P(half(xl, 1) + half(xr, -1), oc, kk, 1.4) + P(star(xl - 2, y + 4, 2.4, 1) + star(xr - 2, y + 4, 2.4, 1), '#FFFFFF');
      } else {
        const sc = mood === 'surprise' ? 1.12 : 1;
        s = P(RE(xl, y, rx * sc, ry * sc, rot) + RE(xr, y, rx * sc, ry * sc, -rot), oc, kk, 1.4);
        let sx = -2.6, sy = -3.4;
        if (mood === 'think') { sx = -.5; sy = 4.6; }
        if (mood === 'surprise') { s += P(C(xl, y + 1, 3.4) + C(xr, y + 1, 3.4), kk); sx = -3.6; sy = -4.6; }
        s += P(star(xl + sx, y + sy, 3.4, 1.45) + star(xr + sx, y + sy, 3.4, 1.45), '#FFFFFF');
      }
    } else if (e.t === 'panda') {
      outside = P(RE(xl, y, 6.8, 9.4, 28) + RE(xr, y, 6.8, 9.4, -28), '#262222');
      const W = '#FFFFFF';
      if (mood === 'happy') s = P(`M${pt(xl - 3, y + 1.5)}Q${pt(xl, y - 3.5)} ${pt(xl + 3, y + 1.5)}M${pt(xr - 3, y + 1.5)}Q${pt(xr, y - 3.5)} ${pt(xr + 3, y + 1.5)}`, 'none', W, 1.6);
      else if (mood === 'out') s = P(`M${pt(xl - 3, y)}Q${pt(xl, y + 3)} ${pt(xl + 3, y)}M${pt(xr - 3, y)}Q${pt(xr, y + 3)} ${pt(xr + 3, y)}`, 'none', W, 1.4);
      else {
        let rw = 2.8, pr = 1.6, py = -.6, px = .8;
        if (mood === 'think') { py = 1.4; px = .2; }
        if (mood === 'sad') { py = 1; pr = 1.4; }
        if (mood === 'surprise') { rw = 3.6; pr = 1.3; py = -.4; }
        s = P(C(xl + .8, y - .8, rw) + C(xr - .8, y - .8, rw), W) + P(C(xl + .8 + px, y + py, pr) + C(xr - .8 - px, y + py, pr), INK);
        if (mood === 'sad') s += P(`M${pt(xl - 4, y - 7)}L${pt(xl + 2.5, y - 10)}M${pt(xr + 4, y - 7)}L${pt(xr - 2.5, y - 10)}`, 'none', INK, 1.3);
      }
    }
    return outside + `<g class="cey">${s}</g>`;
  }

  /* ---------- 口 ---------- */
  function openMouth(x, y, w) {
    return P(`M${pt(x - w, y)}Q${pt(x, y + w * 1.55)} ${pt(x + w, y)}Q${pt(x, y + w * .3)} ${pt(x - w, y)}Z`, MOUTH, INK, .8) +
      P(E(x, y + w * .68, w * .45, w * .26), TONGUE);
  }
  function mouth(ch, mood) {
    const m = ch.mouth, { x, y, w } = m;
    if (m.s === 'beak') {
      let s = P(E(x, y, w, w * .58), '#F59A23', '#8A4A00', .9);
      if (mood === 'happy') s += P(E(x, y + .8, w * .62, w * .3), MOUTH) + P(`M${pt(x - w, y - .3)}Q${pt(x, y + 1.2)} ${pt(x + w, y - .3)}`, 'none', '#B25E00', .8);
      else if (mood === 'surprise') s += P(E(x, y + .5, w * .32, w * .3), MOUTH);
      else if (mood === 'sad') s += P(`M${pt(x - w * .9, y + 1.5)}Q${pt(x, y - 1)} ${pt(x + w * .9, y + 1.5)}`, 'none', '#B25E00', .9);
      else s += P(`M${pt(x - w * .95, y - .2)}Q${pt(x, y + 1.8)} ${pt(x + w * .95, y - .2)}`, 'none', '#B25E00', .9);
      return s;
    }
    if (mood === 'happy') return openMouth(x, y, Math.max(w * 1.15, 3.6));
    if (mood === 'sad') return P(`M${pt(x - w * .8, y + w * .6)}Q${pt(x, y - w * .3)} ${pt(x + w * .8, y + w * .6)}`, 'none', INK, 1.2);
    if (mood === 'surprise') return P(E(x, y + 1.2, 2.1, 2.7), MOUTH, INK, .8);
    if (mood === 'think') return P(`M${pt(x - 1.5, y + 1.2)}q1.6 -1.3 3.2 0t3 -.2`, 'none', INK, 1.1);
    if (mood === 'out') return P(`M${pt(x - 2, y + 1)}h4`, 'none', INK, 1);
    switch (m.s) {
      case 'open': return openMouth(x, y, w);
      case 'line': return P(`M${pt(x - 11, y - 1.5)}Q${pt(x - 1, y + 4.5)} ${pt(x + 10, y - 2.5)}`, 'none', INK, 1.3);
      case 'small': return P(`M${pt(x - w, y)}Q${pt(x, y + w)} ${pt(x + w, y)}`, 'none', INK, 1.2);
      case 'smile': return P(`M${pt(x - w, y - .5)}Q${pt(x, y + w * .8)} ${pt(x + w, y - .5)}`, 'none', INK, 1.2);
      case 'w': return P(`M${pt(x - 4, y)}Q${pt(x - 2, y + 2.6)} ${pt(x, y)}Q${pt(x + 2, y + 2.6)} ${pt(x + 4, y)}`, 'none', INK, 1);
    }
    return '';
  }

  /* ---------- 気分の効果（涙・…・！・きらり・Zz） ---------- */
  function fx(ch, mood) {
    const [fx0, fy0] = ch.fx;
    if (mood === 'sad') {
      const e = ch.eyes, x = e.x[0] - 1.5, y = e.y + (e.r || e.ry || 6) + 2;
      return `<path class="cft" d="M${pt(x, y)}C${pt(x + 3.2, y + 4.2)} ${pt(x + 3.8, y + 8)} ${pt(x, y + 9)}C${pt(x - 3.8, y + 8)} ${pt(x - 3.2, y + 4.2)} ${pt(x, y)}Z" fill="#A8E0FF" stroke="#2468A8" stroke-width=".9"/>`;
    }
    if (mood === 'think') {
      return P(E(fx0 - 4, fy0, 13, 8.4) + C(fx0 - 16, fy0 + 10, 2.2), '#FFFDF6', '#3A2A1E', 1, ' opacity=".96"') +
        [1, 2, 3].map(i => `<path class="cfd${i}" d="${C(fx0 - 4 + (i - 2) * 5.6, fy0, 1.9)}" fill="#2A1C12"/>`).join('');
    }
    if (mood === 'surprise') {
      const x = fx0, y = fy0;
      return `<path class="cfp" d="M${pt(x - 2.9, y - 12)}h5.8l-1.6 12h-2.6ZM${pt(x - 2.4, y + 4)}a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0Z" fill="#FFD84A" stroke="#4A2E08" stroke-width="1.1"/>`;
    }
    if (mood === 'happy') {
      return `<path class="cfs" d="${star(fx0, fy0, 7, 2, 4)}" fill="#FFE27A" stroke="#7A5A08" stroke-width=".8"/>` +
        `<path class="cfs cfs2" d="${star(110 - fx0, fy0 + 8, 5.4, 1.6, 4)}" fill="#FFE27A" stroke="#7A5A08" stroke-width=".8"/>`;
    }
    if (mood === 'out') {
      return `<path class="cfz" d="M${pt(fx0 - 6, fy0 + 3)}h6l-6 6.5h6M${pt(fx0 + 2, fy0 - 5)}h4.4l-4.4 4.6h4.4" fill="none" stroke="#E4ECFF" stroke-width="1.6"/>`;
    }
    return '';
  }

  /* ---------- 手・腕・小物 ---------- */
  function armD(x1, y1, x2, y2, bend) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    return `M${pt(x1, y1)}Q${pt(mx - dy / L * bend, my + dx / L * bend)} ${pt(x2, y2)}`;
  }
  function arm(ch, x1, y1, x2, y2, bend) {
    const d = armD(x1, y1, x2, y2, bend || 0), w = ch.pal.armW || 7.5;
    return P(d, 'none', HALO, w + 4.4, HOP) + P(d, 'none', ch.pal.armK || ch.pal.k, w + 2.6) + P(d, 'none', ch.pal.arm, w);
  }
  function hand(ch, x, y, s, fingers, o) {
    o = o || {};
    const d = o.flat ? 'M-9 1C-9 -6.5 9 -6.5 9 1A2.25 2.8 0 0 1 4.5 1A2.25 3.5 0 0 1 0 1A2.25 3.5 0 0 1 -4.5 1A2.25 2.8 0 0 1 -9 1Z'
      : handD(fingers, 5.4, 2.3, o.L);
    const extra = '';
    return `<g transform="translate(${pt(x, y)}) scale(${s})">${P(d, HALO, HALO, 3.4, HOP)}${P(d, ch.pal.paw, ch.pal.k, 1.25)}${extra}</g>`;
  }
  function paws(ch, pts) {
    const pr = ch.pr || [7.2, 5.6];
    const d = pts.map(q => E(q[0], q[1], pr[0], pr[1])).join('');
    let s = '';
    if (ch.restArms) pts.forEach(q => { const sh = q[0] < 55 ? ch.sh[0] : ch.sh[1]; s += arm(ch, sh[0], sh[1], q[0], q[1] - 2, 0); });
    const toes = pts.map(q => `M${pt(q[0] - 2, q[1] + 1.6)}v2.2M${pt(q[0] + 2, q[1] + 1.6)}v2.2`).join('');
    return s + P(d, HALO, HALO, 3.4, HOP) + P(d, ch.pal.paw, ch.pal.k, 1.3) + P(toes, 'none', ch.pal.k, .8, ' opacity=".55"');
  }
  function chip(x, y) {
    // 2枚重ねのチップ（卓の上・遠近で楕円）
    const rx = 9.4, ry = 4.6, h = 4.2;
    return P(`M${pt(x - rx, y - h)}V${r1(y)}A${rx} ${ry} 0 0 0 ${pt(x + rx, y)}V${r1(y - h)}Z`, '#8E1D17', '#3A0A08', .8) +
      P(`M${pt(x - rx, y - h / 2)}A${rx} ${ry} 0 0 0 ${pt(x + rx, y - h / 2)}`, 'none', '#FFFFFF', 1.4, ' stroke-dasharray="2 2.8"') +
      P(E(x, y - h, rx, ry), '#D7362C', '#3A0A08', .8) + P(E(x, y - h, rx - 2, ry - 1.2), 'none', '#FFFFFF', 1.3, ' stroke-dasharray="2.2 2.6"');
  }
  function card(x, y, rot, extra) {
    return `<g transform="translate(${pt(x, y)}) rotate(${rot})">` +
      P('M-6.2 -22h12.4a1.6 1.6 0 0 1 1.6 1.6v18.8a1.6 1.6 0 0 1 -1.6 1.6h-12.4a1.6 1.6 0 0 1 -1.6 -1.6v-18.8a1.6 1.6 0 0 1 1.6 -1.6Z', '#2F58BA', '#FFFFFF', 1.5) +
      P('M-5 -19.6h10v17h-10Z', 'none', '#9DB8F2', .7) + (extra || '') + '</g>';
  }

  /* ---------- ポーズ ---------- */
  // 合図（hit/stand/surrender/reach）は縁の手前＝卓の上（y>100）で行う。はみ出しは最大で箱の高さの約16%。
  function pose(ch, p) {
    const [sL, sR] = ch.sh, [, rR] = ch.rest, S = 1.55;
    const x0 = ch.sig || 24, raise = ch.raise || [13, 38];
    let body = '', table = '';
    switch (p) {
      case 'hit': {
        // 人差し指で卓をトントン（上下）。接地の瞬間に波紋と火花。
        const y = 90, x = x0;
        table = paws(ch, [rR]) +
          `<g class="czx">${P(E(x, 112, 9.5, 3.2), 'none', HALO, 1.7)}${P(`M${pt(x - 13, 109)}l-4.5 -2.4M${pt(x + 13, 109)}l4.5 -2.4M${pt(x - 11.5, 115.5)}l-4.2 2.4M${pt(x + 11.5, 115.5)}l4.2 2.4`, 'none', HALO, 1.7)}</g>` +
          `<g class="cz">${arm(ch, sL[0], sL[1], x + 1, y - 4, 3)}${hand(ch, x, y, S, [180], { L: 6.5 })}</g>`;
        break;
      }
      case 'stand': {
        // 手のひらを下にして水平に振る（左右）。
        const x = x0 + 8, y = 104;
        table = paws(ch, [rR]) +
          P(`M${pt(x - 26, 96.5)}q-4.2 7.5 0 15M${pt(x + 26, 96.5)}q4.2 7.5 0 15M${pt(x - 32, 99)}q-3 5 0 10M${pt(x + 32, 99)}q3 5 0 10`, 'none', HALO, 2.2, ' opacity=".95"') +
          `<g class="cz">${arm(ch, sL[0], sL[1], x + 2, y - 5, 4)}${hand(ch, x, y, 1.65, [], { flat: 1 })}</g>`;
        break;
      }
      case 'surrender': {
        // 人差し指で賭け札の手前に横線を引く（左→右）。指先から線が伸びる。
        const y = 90, xa = x0 - 8;
        table = paws(ch, [rR]) +
          `<path class="czx" d="M${pt(xa, 111.6)}h34" fill="none" stroke="${HALO}" stroke-width="2.6" stroke-dasharray="34 40"/>` +
          `<g class="cz">${arm(ch, sL[0], sL[1], xa + 1, y - 4, 3)}${hand(ch, xa, y, S, [180], { L: 6.5 })}` +
          P(`M${pt(xa - 12, 86)}h-7M${pt(xa - 13, 92)}h-10M${pt(xa - 12, 98)}h-7`, 'none', HALO, 1.6, ' opacity=".9"') + '</g>';
        break;
      }
      case 'double': case 'split': {
        // 横にチップを足して、指1本（ダブル）／2本のV（スプリット）を立てる。
        const f = p === 'double' ? [0] : [-22, 22];
        body = `<g class="cz">${arm(ch, sL[0], sL[1], raise[0] + 1, raise[1] + 7, -3)}${hand(ch, raise[0], raise[1], 1.45, f, { L: 8.5 })}</g>`;
        table = paws(ch, [rR]) + chip(96, 109);
        break;
      }
      case 'squeeze': {
        const top = ch.eyes.y + (ch.eyes.r || ch.eyes.ry || 6) + 2.5, by = top + 22, cx = 55;
        const pw = C(cx - 10.5, by - 3, 5.2) + C(cx + 11.5, by - 5, 5.2);
        body = `<g class="cz" style="transform-origin:${cx}px ${r1(by)}px">` +
          arm(ch, sL[0], sL[1], cx - 10.5, by - 3, 4) + arm(ch, sR[0], sR[1], cx + 11.5, by - 5, -4) +
          card(cx - 3, by, -11, '') + card(cx + 3.5, by, 9, `<path class="czx" d="M-1.6 -22.6L7.6 -13.4L-1.6 -13.4Z" fill="#FFFFFF" stroke="#8A93A8" stroke-width=".6"/>`) +
          P(pw, HALO, HALO, 3.2, HOP) + P(pw, ch.pal.paw, ch.pal.k, 1.2) + '</g>';
        break;
      }
      case 'cheer': {
        body = `<g class="cz" style="transform-origin:${sL[0]}px ${sL[1]}px">${arm(ch, sL[0], sL[1], 13, 35, -4)}${hand(ch, 12, 31, 1.4, [])}</g>` +
          `<g class="cz2" style="transform-origin:${sR[0]}px ${sR[1]}px">${arm(ch, sR[0], sR[1], 97, 35, 4)}${hand(ch, 98, 31, 1.4, [])}</g>`;
        break;
      }
      case 'reach': {
        table = paws(ch, [rR]) +
          `<g class="cz" style="transform-origin:${sL[0]}px ${sL[1]}px">${arm(ch, sL[0], sL[1], 22, 104, 5)}${hand(ch, 21, 108, 1.5, [140, 180, 220], { L: 4.2 })}</g>`;
        break;
      }
      default:
        table = paws(ch, ch.rest);
    }
    return { body, table };
  }

  /* ---------- 公開API ---------- */
  function ensureCss() {
    if (cssDone || typeof document === 'undefined') return;
    cssDone = true;
    if (document.getElementById('cast-css')) return;
    const st = document.createElement('style');
    st.id = 'cast-css'; st.textContent = CAST_CSS;
    (document.head || document.documentElement).appendChild(st);
  }
  function pick(who) {
    if (typeof who === 'number') return CH[((who % CH.length) + CH.length) % CH.length];
    return CH.find(c => c.id === who) || CH[0];
  }
  function html(who, opts) {
    ensureCss();
    const o = opts || {}, ch = pick(who);
    const mood = MOODS.includes(o.mood) ? o.mood : 'idle';
    let ps = POSES.includes(o.pose) ? o.pose : 'rest';
    if (mood === 'out') ps = 'rest';
    const size = +o.size || 72, w = r1(size * RATIO);
    const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : (Date.now() / 1000) % 1e5;
    const cd = -(now + (+o.delay || 0));
    const g = 'castg' + (++uid), u = { g: `url(#${g})`, g2: `url(#${g}b)` }, p = ch.pal;
    let defs = `<radialGradient id="${g}" cx=".36" cy=".27" r=".86"><stop offset="0" stop-color="${p.l}"/><stop offset=".5" stop-color="${p.b}"/><stop offset=".93" stop-color="${p.e}"/></radialGradient>`;
    if (ch.g2) defs += `<radialGradient id="${g}b" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="${ch.g2[0]}"/><stop offset=".55" stop-color="${ch.g2[1]}"/><stop offset="1" stop-color="${ch.g2[2]}"/></radialGradient>`;
    const L = ch.L(u), pz = pose(ch, ps);
    const inner = P(L.sil, HALO, HALO, 5, HOP) + (L.back || '') + P(L.body, u.g, p.k, 1.6) + (L.sheen ? P(L.sheen, 'none', '#FFFFFF', 2.8, ' opacity=".3"') : '') + (L.patch || '') + eyes(ch, mood) +
      (L.top || '') + mouth(ch, mood) + (L.hold || '') + (L.hat || '') + pz.body + fx(ch, mood);
    return `<span class="cast c-${ch.id} m-${mood} p-${ps}" style="width:${w}px;height:${size}px;--cd:${cd.toFixed(3)}s" aria-hidden="true">` +
      `<svg class="cs" viewBox="0 0 110 100" focusable="false"><defs>${defs}</defs>` +
      `<svg class="cc" x="-30" y="-40" width="170" height="140" viewBox="-30 -40 170 140" overflow="hidden"><g class="cbd">${inner}</g></svg>` +
      `<g class="ctb">${pz.table}</g></svg></span>`;
  }
  return {
    CHARS: CH.map(c => ({ id: c.id, name: c.name, color: c.color })),
    MOODS, POSES, RATIO, css: CAST_CSS, html, ensureCss
  };
})();
/*CAST_END*/
/*DEALER_START*/
/* ===== ディーラー（共通・4ゲームで同一。直すときは scratchpad の kit/dealer.js を直して同期する） =====
   画面はディーラー目線（一人称）。画面の下がディーラー側（卓の手前の縁とチップラック）、上がプレイヤー側。
   felt（#table）の padding-bottom がディーラーの手元の帯。ゲーム側は Dealer.cfg（center/speed/rackW）を与え、

const Dealer=(()=>{

    /* チップラック：卓の手前の縁、ディーラーの正面。上から見下ろすので奥ほど細い台形 */
    _drawRack(){

      const yT=this.H-this.band*.8,yB=this.H-this.band*.14;

    /* 手を止めてフロアを呼ぶ：もう片方の手は卓に置いたまま、片手を立てて上げる */

    raisePt(side){const sg=side==='l'?-1:1;return{x:this.cx+sg*Math.min(this.W*.3,110*this.s),y:this.feltB*.72,z:26};},

    /* ---------- 投影 ---------- */

    /* 画面上の点 → 世界座標（高さ z で画面の点にちょうど重なる位置） */

    _restPt(side){const r=this.rest();return side==='l'?{x:r.lx,y:r.ly}:{x:r.rx,y:r.ry};},

    /* 手の配置から、体の横移動・前傾・ひねり・肩の突き出しの目標値を決める */

    /* 肩：体のひねり・前傾・突き出しを反映し、画面の下の外に留める */

    /* ---------- タイムライン ---------- */

    _shapeKey(kf,side,ignoreProp){

    /* ---------- 腕の解決（3D） ---------- */

  const F=(h,t,pt,x)=>Object.assign({t,hold:h,[h]:pt},x||{});
  const home=h=>h==='l'?RL:RR;
  const shoe=ptOf('#shoeBox',0.5,0.4);
  const handPt=sd=>ptOf(sd==='p'?'.hand.h-p .cards':'.hand.h-b .cards',0.5,0.5);
  switch(key){
    case 'noMoreBets':{
      /* 手のひらを下にして、ベットエリアの上を左右それぞれ自分の側で払う */
      const g=elRect('.table-wrap');if(!g)return null;
      const y=g.y+g.h*0.5;
      return[{t:0,rp:'flat',lp:'flat'},
        {t:280,r:P(g.x+g.w*0.58,y,10),l:P(g.x+g.w*0.42,y,10)},
        {t:640,r:P(g.x+g.w*0.84,y-8*s,10),l:P(g.x+g.w*0.16,y-8*s,10)},
        {t:960,r:P(g.x+g.w*0.64,y,8),l:P(g.x+g.w*0.36,y,8)},
        {t:1280,r:RR,l:RL,rp:'',lp:''}];
    }
    case 'dealPlayer':case 'dealBanker':{
      /* シューの口から1枚引き出し、手札の置き場へ滑らせて置く */
      const to=handPt(key==='dealPlayer'?'p':'b');if(!to||!shoe)return null;
      const slot=pre.slot||to,h=side(shoe.x);
      return[{t:0,prop:'',hold:h},F(h,200,P(shoe.x,shoe.y)),F(h,340,P(shoe.x,shoe.y),{prop:'card'}),
        F(h,820,P(slot.x,slot.y),{prop:'card'}),F(h,930,P(slot.x,slot.y),{prop:''}),F(h,1220,home(h))];
    }
    case 'selectSqueezer':{
      /* ディーラーは絞らない。手札を指名した客のポジションまで運んで渡し、
         客が絞っている間はその場で待ち、絞り終えた札を受け取って元の位置へ戻す */
      const sd=pre.side||'p';
      const c=handPt(sd);
      const seat=+arg,kind=sd==='p'?'player':'banker';
      const spot=svgPt(spotPt(kind,seat));
      if(!c||!spot)return null;
      const at=P(spot.x,spot.y+8*s),h=side(at.x);
      return[{t:0,prop:'',hold:h},
        F(h,260,P(c.x,c.y)),F(h,420,P(c.x,c.y),{prop:'cards'}),
        F(h,1100,at,{prop:'cards'}),
        F(h,1240,at,{prop:'',open:.7}),
        F(h,1900,P(at.x,at.y+4*s,10),{prop:'',open:.7}),
        F(h,2080,at,{prop:'cards',open:0}),
        F(h,2700,P(c.x,c.y),{prop:'cards'}),
        F(h,2830,P(c.x,c.y),{prop:''}),
        {t:3200,r:RR,l:RL,open:0}];
    }
    case 'callTotals':case 'callResult':case 'declareNatural':{
      /* 合計・勝ち手をコールしながら、該当する手札を指で示す */
      const cp=handPt('p'),cb=handPt('b');if(!cp||!cb)return null;
      const w=G.winner;
      const pt=c=>P(c.x,c.y+14*s);
      if(key==='callResult'&&(w==='player'||w==='banker')){
        const c=w==='player'?cp:cb,h=side(c.x);
        return[{t:0,hold:h},F(h,300,pt(c),{[h+'p']:'point'}),F(h,700,pt(c),{[h+'p']:'point'}),F(h,1000,home(h),{[h+'p']:''})];
      }
      return[{t:0},{t:280,l:pt(cp),lp:'point'},{t:560,l:pt(cp),lp:'point',r:pt(cb),rp:'point'},
        {t:860,r:pt(cb),rp:'point'},{t:1160,l:RL,r:RR,lp:'',rp:''}];
    }
    case 'playerDraw':case 'bankerDraw':{
      /* 「カードを1枚」を示す、手札の脇を指先で2回叩く所作 */
      const c=handPt(key==='playerDraw'?'p':'b');if(!c)return null;
      const x=c.x+(c.x<Dealer.cx?-1:1)*26*s,h=side(x),T=z=>P(x,c.y,z);
      return[{t:0,hold:h},F(h,260,T(9),{[h+'p']:'point'}),F(h,380,T(0)),F(h,500,T(9)),F(h,620,T(0)),F(h,940,home(h),{[h+'p']:''})];
    }
    case 'playerStand':case 'bankerStand':{
      /* 手のひらを下に向けて手札の上を水平に払う＝スタンドの合図 */
      const c=handPt(key==='playerStand'?'p':'b');if(!c)return null;
      const h=side(c.x);
      return[{t:0,hold:h,[h+'p']:'flat'},F(h,260,P(c.x+24*s,c.y+6*s,10)),F(h,560,P(c.x-24*s,c.y+6*s,10)),
        F(h,820,P(c.x+14*s,c.y+4*s,8)),F(h,1120,home(h),{[h+'p']:''})];
    }
    case 'takeOuter':case 'takeInner':{
      /* 実際の所作どおり、円弧に沿って端から端まで一気に掃き寄せる */
      const fr=key==='takeOuter'?(SPOT.player.fr+SPOT.banker.fr)/2:(SPOT.tie.fr+SPOT.dragon.fr)/2;
      const pts=[1,.84,.67,.5,.33,.16,0].map(u=>svgPt(atU(fr,u))).filter(Boolean);
      if(pts.length<3)return null;
      const seq=[{t:0,prop:'rake'}];
      pts.forEach((q,i)=>seq.push({t:240+i*150,r:pullBack(q,20),prop:'rake'}));
      const last=240+pts.length*150;
      seq.push({t:last+160,r:P(rk.x,rk.y-14*s),prop:'rake'});
      seq.push({t:last+430,r:RR,prop:''});
      return seq;
    }
    case 'select':{
      const c=ptOf(`[data-bet="${arg}"]`);if(!c)return null;
      const h=side(c.x);
      return[{t:0,hold:h},F(h,300,P(c.x,c.y+14*s),{[h+'p']:'point'}),F(h,480,P(c.x,c.y+4),{[h+'p']:'point'}),
        {t:800,r:RR,l:RL,rp:'',lp:''}];
    }
    case 'chipPay':{
      const c=pre.betId?ptOf(`[data-bet="${pre.betId}"]`):null;
      if(!c){
        /* コミッション徴収：バンカーのエリアからコミッションボックスへ運ぶ */
        const cb=ptOf('#commBox');if(!cb)return null;
        const f=svgPt(TP(SPOT.banker.fr,270))||P(rk.x,rk.y);
        return[{t:0,prop:''},{t:280,r:P(f.x,f.y)},{t:420,r:P(f.x,f.y),prop:'chips'},
          {t:1000,r:P(cb.x,cb.y),prop:'chips'},{t:1140,r:P(cb.x,cb.y),prop:''},{t:1440,r:RR}];
      }
      /* 配当を置く席が体の中心より左なら、左手でラックから取って左手で置く */
      const h=side(c.x),rack=h==='l'?rkL:rk,dx=(h==='l'?-1:1)*9*s;
      return[{t:0,prop:'',hold:h},F(h,180,P(rack.x,rack.y)),F(h,280,P(rack.x,rack.y),{prop:'chips'}),
        F(h,640,P(c.x+dx,c.y+24*s,16),{prop:'chips'}),F(h,840,P(c.x+dx,c.y+6*s),{prop:'chips'}),
        F(h,980,P(c.x+dx,c.y+6*s),{prop:''}),{t:1320,r:RR,l:RL}];
    }
    case 'cleanHands':return Dealer.cleanFrames();
    case 'accident':return Dealer.floorFrames(pre.accType==='cardDrop'&&shoe?side(shoe.x):'r');
    case 'clearCards':{
      /* 両手で手札を寄せてまとめ、ディスカードホルダーへ */
      const dp=pre.pHand||handPt('p'),db=pre.bHand||handPt('b'),dc=ptOf('#discardBox',0.5,0.4);
      if(!dp||!db||!dc)return null;
      const mid=P((dp.x+db.x)/2,(dp.y+db.y)/2),h=side(dc.x);
      return[{t:0,prop:'',hold:'both'},
        {t:260,r:P(db.x,db.y),l:P(dp.x,dp.y),rp:'flat',lp:'flat'},
        {t:520,r:P(mid.x+10*s,mid.y),l:P(mid.x-10*s,mid.y),prop:'cards',rp:'',lp:''},
        F(h,1040,P(dc.x,dc.y),{prop:'cards'}),
        F(h,1180,P(dc.x,dc.y),{prop:''}),
        {t:1500,r:RR,l:RL,open:0,hold:'r'}];
    }
  }
  return null;
}

/* ---- テーブル描画 ---- */
function cardHTML(c,faceUp,cls){
  if(!faceUp)return `<div class="card back ${cls||''}"><span class="r">?</span></div>`;
  return `<div class="card ${c.suit.c} ${cls||''}"><span class="r">${c.rank}</span><span class="s">${c.suit.m}</span></div>`;
}
function handHTML(G,side){
  const F=G.flags;
  const cards=side==='p'?G.pCards:G.bCards;
  const opened=side==='p'?F.openedP:F.openedB;
  const dealtCount=Math.min(2,Math.max(0,side==='p'?Math.ceil(F.dealt/2):Math.floor(F.dealt/2)));
  const third=(side==='p'?F.pCard3:F.bCard3)?1:0;
  let html='';
  /* 絞った直後の手札だけ、客が札を絞るアニメーションを付ける */
  const sq=G.squeezeFlash===side?' squeezing':'';
  for(let i=0;i<2;i++){
    const ex=F.exposed&&F.exposed.side===side&&F.exposed.i===i;
    if(i<dealtCount)html+=cardHTML(cards[i],opened||ex,'dealt'+sq+(ex&&F.acc?' acc-hot':'')+(F.torn===side&&i===0?' acc-hot':''));
    else html+='<div class="card-slot"></div>';
  }
  if(third)html+=cardHTML(cards[2],true,'third dealt');
  const total=opened?handTotal(cards.slice(0,dealtCount+third)):null;
  const win=F.calledResult&&G.winner===(side==='p'?'player':'banker');
  const name=side==='p'?'PLAYER':'BANKER';
  const sqSeat=G.squeezer[side];
  return `<div class="hand h-${side}${win?' win':''}${F.cleared?' cleared':''}">
    <div class="hand-cap"><span>${name}${sqSeat?`<small>絞り ${sqSeat}番席</small>`:''}${F.exposed&&F.exposed.side===side?'<small>露出</small>':''}${F.torn===side?'<small>角が破れた</small>':''}</span>${total===null?'<span class="pend">未オープン</span>':`<b>${total}</b>`}</div>
    <div class="cards">${html}</div>
  </div>`;
}

/* ===== テーブル・レイアウト（実物と同じハーフムーン型）=====
   画面はディーラー目線。ディーラーは半円の直線側（下辺）に立ち、客は円弧側（奥）に3ポジション並ぶ。
   1ポジションあたり、外周から PLAYER → BANKER、その内側に TIE と
   P/B ペア、さらに内側にドラゴンボーナスの丸枠。直線側にはシュー・
   ディスカードホルダー・1〜7番のコミッションボックスが並ぶ。
   回収と配当の「外周→内側」「1番席→3番席」はこの配置がそのまま根拠になる。 */
const TBL={W:1060,H:620,cx:530,cy:474,rx:514,ry:458,tA:348,tB:192};
function TP(fr,deg){const t=deg*Math.PI/180;return{x:TBL.cx+TBL.rx*fr*Math.cos(t),y:TBL.cy+TBL.ry*fr*Math.sin(t)};}
function arcPts(fr,d0,d1,n){
  const out=[];
  for(let i=0;i<=n;i++)out.push(TP(fr,d0+(d1-d0)*i/n));
  return out;
}
function poly(pts){return pts.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');}

/* 楕円の円弧は角度を等分しても弧の長さが等分にならず、端のポジションだけ枠が
   潰れて重なる。実物の台はポジションが等間隔に並ぶので、弧長で等分した位置
   （u：左端0〜右端1）を座標の基準にする。 */
const ARCT={};
function arcTable(fr){
  const key=fr.toFixed(3);
  if(ARCT[key])return ARCT[key];
  const N=360,pts=[],cum=[0];
  for(let i=0;i<=N;i++)pts.push(TP(fr,TBL.tA+(TBL.tB-TBL.tA)*i/N));
  for(let i=1;i<=N;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  return ARCT[key]={pts,cum,N,total:cum[N]};
}
/* u（0〜1）の位置の座標と、その点での角度 */
function atU(fr,u){
  const T=arcTable(fr),target=Math.max(0,Math.min(1,u))*T.total;
  let i=1;while(i<T.N&&T.cum[i]<target)i++;
  const a=T.cum[i-1],b=T.cum[i],k=(target-a)/Math.max(1e-6,b-a);
  const p=T.pts[i-1],q=T.pts[i];
  return{x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k,
    deg:TBL.tA+(TBL.tB-TBL.tA)*((i-1+k)/T.N)};
}
const SEAT_W=1/TABLE_SEATS,CELL_GAP=0.085;
function seatU(seat){return (seat-0.5)*SEAT_W;}
/* fr＝外周からの半径比、du＝1ポジション幅に対する左右のずれ。
   ペアの2枠は左右だけでなく半径もずらす。真横に並べると隣のポジションの枠と
   くっついてしまい、実物の台でも斜めにずらして配置されている。 */
const SPOT={
  player:{fr:.860,du:0,band:true,hw:.070,label:'PLAYER'},
  banker:{fr:.715,du:0,band:true,hw:.063,label:'BANKER'},
  tie:{fr:.585,du:0,r:26,label:'TIE'},
  ppair:{fr:.495,du:-0.22,r:22,label:'P'},
  bpair:{fr:.440,du:0.22,r:22,label:'B'},
  dragon:{fr:.325,du:0,r:24,label:'DRG'}
};
const SPOT_ORDER=['player','banker','tie','ppair','bpair','dragon'];
function spotPt(kind,seat){
  const sp=SPOT[kind];
  return atU(sp.fr,seatU(seat)+sp.du*SEAT_W);
}
/* 1ポジションぶんの帯。両端は中心へ向かう放射方向に切る（実物の罫線と同じ） */
function cellPath(sp,seat){
  const u0=(seat-1)*SEAT_W+SEAT_W*CELL_GAP,u1=seat*SEAT_W-SEAT_W*CELL_GAP;
  const d0=atU(sp.fr,u0).deg,d1=atU(sp.fr,u1).deg;
  const inner=arcPts(sp.fr-sp.hw,d0,d1,10),outer=arcPts(sp.fr+sp.hw,d1,d0,10);
  return `M ${poly(inner)} L ${poly(outer)} Z`;
}
function feltPath(){
  return `M 1044 600 Q 1044 612 1032 612 L 28 612 Q 16 612 16 600 L 16 ${TBL.cy} L ${poly(arcPts(1,180,360,60))} Z`;
}

/* 卓が縮む幅（899px以下）では、大きくした卓上の文字に合わせて箱・丸枠・席番号の位置を変える。
   r・x・y・width・height を CSS で変える方法は Safari での対応が不確かなので、描くときに属性として出し分ける
   （文字の大きさだけは CSS の @media で決める）。幅の区切りをまたいだら描き直す。 */
const MQ_NARROW=window.matchMedia('(max-width:899px)'),MQ_PHONE=window.matchMedia('(max-width:600px)');
function tableGeo(){
  const n=MQ_NARROW.matches,ph=MQ_PHONE.matches;
  return n?{box:{y:480,h:124,dx:26,sx:864,w:170},bar:{y:528,h:20,dx:36,sx:874,w:150},capY:515,
      comm:{y:548,h:46,ny:ph?583:580},commCapY:532,seatDy:ph?-3:7,dotR:ph?{tie:29,ppair:26,bpair:26,dragon:31}:{}}
    :{box:{y:502,h:94,dx:34,sx:874,w:152},bar:{y:524,h:40,dx:44,sx:884,w:132},capY:518,
      comm:{y:556,h:34,ny:579},commCapY:606,seatDy:7,dotR:{}};
}
{const rr=()=>{try{render();}catch(e){}};[MQ_NARROW,MQ_PHONE].forEach(m=>{if(m.addEventListener)m.addEventListener('change',rr);else if(m.addListener)m.addListener(rr);});}

function tableSvgHTML(G){
  const F=G.flags,ex=G.pending?null:expected(G),GEO=tableGeo();
  const hlRing=G.opts.showZoneHints&&ex&&ex.ring?ex.ring:null;
  const sqKind=ex&&ex.key==='selectSqueezer'?(ex.side==='p'?'player':'banker'):null;
  const occupied=new Set(G.seatNos);
  let cells='',labels='';
  /* 文字は常に正立（ディーラーから読める向き）。弧に沿って傾け、文字の上側を外周へ向ける */
  const rot=(q,dy)=>`x="${q.x.toFixed(1)}" y="${(q.y+(dy||0)).toFixed(1)}" transform="rotate(${(q.deg-270).toFixed(1)} ${q.x.toFixed(1)} ${q.y.toFixed(1)})"`;
  for(let seat=1;seat<=TABLE_SEATS;seat++){
    const live=occupied.has(seat);
    for(const kind of SPOT_ORDER){
      const sp=SPOT[kind],m=BET_META[kind];
      const lose=live&&G.bets.some(b=>b.seat===seat&&b.kind===kind&&b.win===false&&!b.push&&!b.collected);
      /* 回収の対象リング、または絞る客を選ぶ側のベット枠を強調する */
      const sqHit=sqKind===kind&&G.bets.some(b=>b.seat===seat&&b.kind===kind);
      const hl=(hlRing&&m.ring===hlRing&&lose)||sqHit?' hl':'';
      const dim=live?'':' idle';
      const q=spotPt(kind,seat);
      if(sp.band){
        cells+=`<path class="sp sp-${kind}${hl}${dim}" d="${cellPath(sp,seat)}"/>`;
        labels+=`<text class="sp-lb sp-lb-${kind}" ${rot(q,5)}>${sp.label}</text>`;
      }else{
        cells+=`<circle class="sp sp-dot sp-${kind}${hl}${dim}" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${GEO.dotR[kind]||sp.r}"/>`;
        labels+=`<text class="sp-lb sp-lb-dot sp-lb-${kind}" ${rot(q,4)}>${sp.label}</text>`;
      }
    }
    const n=atU(.962,seatU(seat));
    labels+=`<text class="seat-num${live?' live':''}" ${rot(n,GEO.seatDy)}>${seat}</text>`;
  }
  /* コミッションボックス（1〜3）。バンカー勝ちのコミッションを席ごとに管理する枠 */
  let comm='';
  const cw=92,cg=8,cAll=TABLE_SEATS*cw+(TABLE_SEATS-1)*cg,cx0=TBL.cx-cAll/2;
  for(let i=0;i<TABLE_SEATS;i++){
    const x=cx0+i*(cw+cg);
    /* 回転に合わせて1番のボックスが右端（1番席の側）に来る */
    const xr=TBL.W-x-cw,n=i+1;
    comm+=`<rect class="comm-cell${occupied.has(n)?' live':''}" x="${xr}" y="${GEO.comm.y}" width="${cw}" height="${GEO.comm.h}" rx="3"/>`
      +`<text class="comm-n" x="${xr+cw/2}" y="${GEO.comm.ny}">${n}</text>`;
  }
  const total=DECKS*52,left=G.shoe.length,used=total-left-(G.pCards.length+G.bCards.length);
  const fill=Math.max(0,Math.min(1,left/total));
  return `<svg class="table-svg" viewBox="0 0 ${TBL.W} ${TBL.H}" role="img" aria-label="バカラテーブル">
    <path class="felt-shape" d="${feltPath()}"/>
    <path class="felt-line" d="M 16 ${TBL.cy} L 1044 ${TBL.cy}"/>
    <g id="shoeBox">
      <rect class="tbox" x="${GEO.box.sx}" y="${GEO.box.y}" width="${GEO.box.w}" height="${GEO.box.h}" rx="6"/>
      <rect class="shoe-cards" x="${GEO.bar.sx}" y="${GEO.bar.y}" width="${(GEO.bar.w*fill).toFixed(0)}" height="${GEO.bar.h}" rx="2"/>
      <text class="tbox-cap" x="950" y="${GEO.capY}">SHOE<tspan class="svg-lg"> / ${DECKS} DECKS</tspan></text>
      <text class="tbox-val" x="950" y="586">残 ${left}</text>
    </g>
    <g id="discardBox">
      <rect class="tbox" x="${GEO.box.dx}" y="${GEO.box.y}" width="${GEO.box.w}" height="${GEO.box.h}" rx="6"/>
      <rect class="discard-cards" x="${GEO.bar.dx}" y="${GEO.bar.y}" width="${(GEO.bar.w*(1-fill)).toFixed(0)}" height="${GEO.bar.h}" rx="2"/>
      <text class="tbox-cap" x="110" y="${GEO.capY}">DISCARD</text>
      <text class="tbox-val" x="110" y="586">${used}</text>
    </g>
    <g id="commBox">
      <text class="tbox-cap" x="${TBL.cx}" y="${GEO.commCapY}">COMMISSION  ${fmt$(G.commissionBox)}</text>
      ${comm}
    </g>
    <text class="felt-logo" x="${TBL.cx}" y="532">BACCARAT</text>
    ${cells}

  </svg>`;
}

function chipLayerHTML(G){
  const F=G.flags,ex=G.pending?null:expected(G);
  const picks=ex&&ex.key==='select'?ex.picks:[];
  const reveal=F.calledResult;
  return G.bets.map(b=>{
    const q=spotPt(b.kind,b.seat);
    const st=b.collected?'gone':b.settled?'paid':!reveal?'':b.push?'push':b.win?'won':'lost';
    const pick=picks.includes(b.id)?' pick':'';
    const attrs=pick?` data-act="select" data-arg="${b.id}" tabindex="0" role="button"`:'';
    return `<button type="button" class="chip chip-abs ${seatClass(b.seat)} ${st}${pick}"`
      +` style="left:${(q.x/TBL.W*100).toFixed(2)}%;top:${(q.y/TBL.H*100).toFixed(2)}%"`
      +` data-bet="${b.id}" title="${esc(betTitle(b))}"${attrs}>${b.amount}</button>`;
  }).join('');
}

/* 客の表情：配り〜勝敗コールまでは手札を見守る、絞る客は札を絞る、勝敗コールの後に勝ち負け（コール前に顔に出すと判定の訓練にならない） */
function bcCast(G,seat){
  const F=G.flags||{};
  if(F.acc)return{mood:'surprise',pose:'rest'};
  const mine=G.bets.filter(b=>b.seat===seat);
  if(F.calledResult&&mine.length){
    if(mine.some(b=>b.win))return{mood:'happy',pose:'cheer'};
    if(mine.every(b=>b.push))return{mood:'idle',pose:'rest'};
    if(mine.some(b=>b.push)&&!mine.some(b=>b.win))return{mood:'idle',pose:'rest'};
    return{mood:'sad',pose:'rest'};
  }
  if(G.squeezer.p===seat||G.squeezer.b===seat)return{mood:'think',pose:'squeeze'};
  if(['deal','open','draw'].includes(G.phase))return{mood:'think',pose:'rest'};
  return{mood:'idle',pose:'rest'};
}
function castLayerHTML(G){
  return G.seatNos.map(seat=>{
    const q=atU(1.035,seatU(seat)),c=bcCast(G,seat),side=q.x<TBL.cx-100?' l':q.x>TBL.cx+100?' r':'';
    return `<div class="cast-at${side}" style="left:${(q.x/TBL.W*100).toFixed(2)}%;top:${(q.y/TBL.H*100).toFixed(2)}%">${Cast.html(seat-1,{mood:c.mood,pose:c.pose,size:40,delay:seat*.37})}</div>`;
  }).join('');
}

let VOICE_EN=null,VOICE_JA=null;
function pickVoices(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  VOICE_EN=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Aria|Jenny|Samantha|Zira|Natural/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  VOICE_JA=vs.find(v=>/^ja/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices;}
function speak(list){
  if(!G.opts.voice||!('speechSynthesis' in window)||!list.length)return;
  try{
    speechSynthesis.cancel();
    list.forEach(c=>{
      let u;
      if(VOICE_EN||!VOICE_JA){u=new SpeechSynthesisUtterance(c.en);u.lang='en-US';if(VOICE_EN)u.voice=VOICE_EN;}
      else{u=new SpeechSynthesisUtterance(c.ja);u.lang='ja-JP';u.voice=VOICE_JA;}
      u.rate=0.95;speechSynthesis.speak(u);
    });
  }catch(e){}
}
let capShown=null;
function renderCaption(){
  const el=$('caption'),batch=G.capQueue.splice(0);
  if(batch.length){capShown=batch.slice(-2);speak(batch);}
  const list=capShown||[G.caption];
  const en=list.map(c=>c.en).filter(Boolean).join(' '),ja=list.map(c=>c.ja).filter(Boolean).join('／');
  const on=G.opts.voice,has='speechSynthesis' in window;
  el.innerHTML=`<span class="who">ディーラー</span><div class="en" lang="en">${en?esc(en):'&nbsp;'}</div><div class="ja">${esc(ja)}</div>${has?`<button class="cap-voice${on?' on':''}" data-act="toggleVoice" aria-pressed="${on}">${on?'音声ON':'音声OFF'}</button>`:''}`;
  if(batch.length){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
}

function btn(key,label,cls,arg){
  const a=arg!==undefined?` data-arg="${esc(arg)}"`:'';
  return `<button class="act${cls?' '+cls:''}" data-act="${key}"${a}>${String(label).replace(/（(.+?)）/,'<span class="sub">（$1）</span>')}</button>`;
}
function actionKeys(G,ex){
  if(!ex)return[];
  switch(G.phase){
    case 'bet':return['noMoreBets'];
    case 'deal':return['dealPlayer','dealBanker'];
    case 'open':return[];
    case 'draw':
      if(ex.key==='dealPlayer'||ex.key==='dealBanker')return['dealPlayer','dealBanker'];
      if(ex.key==='bankerDraw'||ex.key==='bankerStand')return['bankerDraw','bankerStand'];
      return['declareNatural','playerDraw','playerStand'];
    case 'take':return['takeOuter','takeInner'];
    case 'comm':return['takeCommission'];
    case 'close':return['cleanHands','clearCards'];
  }
  return[];
}

function drawTableHTML(G,ex){

function renderConsole(){
  const P={idle:'待機中',bet:'ベット受付',deal:'カードを配る',open:'スクイーズ（絞る客の指名）',
    count:'点数のコール',draw:'3枚目の判定',result:'勝敗のコール',take:'ハズレ回収',
    pay:'配当支払い',comm:'コミッション徴収',close:'締め',done:'ラウンド終了'};
  let prompt='',actions='',extra='';
  /* フィードバックは先頭2行（結論と正しい出し方）を常に表示し、3行目以降（暗算の長い解説）は
     スマホでは畳む（1画面に収めるため）。全文は進行ログに残る。 */
  let fb='';
  if(G.lastFb){
    const ls=G.lastFb.text.split('\n');
    /* 2行目（正しい出し方）は、チップを出す画面では内訳の枠（薄いチップ）と同じことを言うので、スマホではそちらに任せる */
    fb=`<div class="fb ${G.lastFb.t}">${esc(ls[0])}${ls.length>1?`<span class="fb-l2">\n${esc(ls[1])}</span>`:''}${ls.length>2?`<span class="fb-more">\n${esc(ls.slice(2).join('\n'))}</span>`:''}</div>`;
  }
  const ex=G.pending?null:expected(G);
  const df=currentDifficulty(G);
  const hintsOn=G.opts.showDrawHints&&df.showDrawTable;

  if(G.pending){
    const p=G.pending,sum=p.chips.reduce((a,b)=>a+b,0);
    /* スマホでは「チップのコツ」ボタンと同じ行に収まるよう、コミッションの指示は「のチップ」を省いた短い形にする */
    prompt=p.ex.key==='takeCommission'?'コミッション分<span class="pr-lg">のチップ</span>を出してください':'配当分のチップを出してください';
    /* 出したチップは額面ごとにまとめ、5枚ごとに間をあけて表示する（5枚1組で数える練習のため）。
       内訳を出すレベルでは、最少枚数の内訳を薄い枠で先に描いておく */
    const stack=chipStackHTML(p.chips,p.ex.amount,!!df.showChipPlan||(p.errs||0)>0);
    /* チップのコツ。内訳そのものはBASIC/STANDARDか、一度間違えたあとだけ出す */
    let coach='';
    if(G.opts.showChipCoach!==false){
      const withPlan=!!df.showChipPlan||(p.errs||0)>0;
      /* スマホでは1画面に収めるため、既定では閉じておく（タップで開く） */
      const narrow=window.matchMedia('(max-width:600px)').matches;
      coach=`<details class="coach"${df.showChipPlan&&!narrow&&!(p.errs>0)?' open':''}><summary>チップのコツ${withPlan?'':'<span class="cc-sub">（内訳は伏せています）</span>'}</summary><ul>${chipCoach(p.ex.amount,p.ex.chipInfo,withPlan).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>`;
    }
    extra=coach;
    actions=`<div class="tray">${CHIPS.slice().reverse().map(d=>`<button class="tray-chip ch-${d}" data-act="chip" data-arg="${d}" aria-label="$${d}チップを1枚出す">$${d}</button>`).join('')}</div>
      <div class="stack"><div class="stack-row">${stack}</div><div class="stack-total">合計 <b>${fmt$(sum)}</b>／${p.chips.length}枚</div></div>
      <div class="actions">${btn('chipUndo','1枚戻す')}${btn('chipClear','すべて戻す')}${btn('chipPay','確定する','primary wide pay')}</div>`;
  }else if(G.phase==='done'){
    const r=G.round;
    const errs=r.errors.length?`<ul>${r.errors.map(e=>`<li>【${CAT_NAME[e.cat]}】${esc(e.why)}</li>`).join('')}</ul>`:'<p>ミスなし。全手順を正しく進行できました。</p>';
    const rows=Object.entries(STATS.cats).map(([k,c])=>{const t=c.ok+c.ng;return `<tr><td>${CAT_NAME[k]}</td><td>${c.ok}</td><td>${c.ng}</td><td>${t?Math.round(c.ok/t*100)+'%':'—'}</td></tr>`;}).join('');
    const notes=r.notes.length?`<div class="phase">チップの出し方（減点なし）</div><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'';
    const hints=r.hints?`<p>質問チャットでヒントを使った回数：${r.hints}回（答えを見た場面は、自力で判断できたか振り返ってください）</p>`:'';
    prompt=`<div class="summary"><div class="next-top">${btn('start','次のラウンドへ','primary')}</div><h3>ラウンド${r.no} 終了：正解${r.ok}／ミス${r.err}</h3>${errs}${hints}${notes}<div class="phase stats-label">通算成績（カテゴリ別）</div><table class="stat-table"><thead><tr><th>カテゴリ</th><th>正解</th><th>ミス</th><th>正答率</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    actions=btn('start','次のラウンドへ','primary');
  }else if(G.phase==='idle'){
    prompt='ラウンドを開始して、プレイヤーにベットを促してください。';
    actions=btn('start','ラウンドを開始（お賭けください）','primary');
  }else if(ex&&ex.key==='accident'){
    const c=accConsole(ex);prompt=c.prompt;actions=c.actions;
  }else if(ex&&ex.key==='callTotals'){
    prompt='両者の点数をコールしてください。<span class="hint">10・J・Q・Kは0点、Aは1点。合計は下1桁だけ。</span>';
    actions=ex.callSet.opts.map(o=>btn('callTotals',o,'wide',o)).join('');
  }else if(ex&&ex.key==='callResult'){
    prompt='勝敗をコールしてください。<span class="hint">「勝った側・高い点・負けた点」の順に言い切る。</span>';
    actions=ex.callSet.opts.map(o=>btn('callResult',o,'wide',o)).join('');
  }else if(ex&&ex.key==='bankerReason'){
    prompt='その判断の根拠を選んでください。<span class="hint">条件表のどの行を使ったか。</span>';
    if(hintsOn)extra=drawTableHTML(G,ex);
    actions=ex.reasonSet.opts.map((o,i)=>btn('bankerReason',o,'wide reason',o)).join('');
  }else if(ex&&ex.key==='selectSqueezer'){
    prompt=`${ex.sideJa}の手札は、どの席のお客様に絞っていただきますか。<span class="hint">${ex.sideJa}側に賭けている席のうち、賭け額が最も大きい席。テーブル上の金額を見比べる。</span>`;
    actions=G.seatNos.map(s=>btn('selectSqueezer',`${s}番席`,'',String(s))).join('');
  }else if(ex&&ex.key==='select'){
    prompt='支払う対象をテーブル上のチップから選んでください。<span class="hint">外周（P/B枠）→内側（タイ・ペア・ドラゴン）の順。各リング内は1番席から順に。</span>';
    actions='';
  }else if(ex){
    const keys=actionKeys(G,ex);
    actions=keys.map(k=>btn(k,LABEL[k])).join('');
    if(G.phase==='draw'){
      if(ex.key==='bankerDraw'||ex.key==='bankerStand'){
        prompt='バンカーは引くか、スタンドか。<span class="hint">プレイヤーの3枚目との組み合わせで決まる。</span>';
        if(hintsOn)extra=drawTableHTML(G,ex);
      }else if(ex.key==='dealPlayer'||ex.key==='dealBanker'){
        prompt='3枚目を配ってください。<span class="hint">3枚目は表向きのまま配る。</span>';
      }else{
        prompt='次の所作を選んでください。<span class="hint">まずナチュラル（2枚で8か9）の有無を確認。なければプレイヤーは0〜5でヒット、6〜7でスタンド。</span>';
        if(hintsOn&&!G.flags.natural)extra=`<div class="drawcard"><div class="dc-h">プレイヤー側のルール</div>合計 <b>0〜5＝ヒット</b>／<b>6〜7＝スタンド</b>。8・9はナチュラルで即終了。</div>`;
      }
    }else{
      const pp=PHASE_PROMPT[G.phase];
      prompt=pp?`${pp[0]}<span class="hint">${pp[1]}</span>`:'次の所作を選んでください。';
    }
  }
  const wrapActs=G.pending?actions:`<div class="actions">${actions}</div>`;
  /* 本文（長くなったらここだけスクロール）と、操作エリア（常に見える位置に固定）に分ける */
  $('console').innerHTML=`<div class="con-body"><div class="phase">${P[G.phase]||''}</div>${G.phase==='done'&&!G.pending?prompt:`<div class="prompt">${prompt}</div>`}${fb}${extra}</div><div class="con-foot">${wrapActs}</div>`;
}

    <div class="row"><label for="optDrawFocus">ドロー判定が起きる手札を多めに配る</label><input type="checkbox" id="optDrawFocus"${o.drawFocus!==false?' checked':''}></div>
    <div class="row"><label for="optChipCoach">チップを出す画面に「チップのコツ」を表示</label><input type="checkbox" id="optChipCoach"${o.showChipCoach!==false?' checked':''}></div>
    <div class="row"><label for="optHints">ドロー条件表のヒントを表示</label><input type="checkbox" id="optHints"${o.showDrawHints!==false?' checked':''}></div>
    <div class="row"><label for="optZone">回収エリアを強調表示</label><input type="checkbox" id="optZone"${o.showZoneHints?' checked':''}></div>
    ${ACC_SET_HTML(o)}
    <div class="row"><label for="optDealer">ディーラーを表示</label><input type="checkbox" id="optDealer"${o.showDealer!==false?' checked':''}></div>
    <div class="row"><label for="optSpeed">所作の再生速度</label><select id="optSpeed">${[[1,'標準'],[0.6,'ゆっくり'],[0.35,'とてもゆっくり']].map(v=>`<option value="${v[0]}"${(o.dealerSpeed||1)===v[0]?' selected':''}>${v[1]}</option>`).join('')}</select></div>
    <div class="row"><label for="optSfx">効果音・振動</label><input type="checkbox" id="optSfx"${o.sfx!==false?' checked':''}></div>
    <div class="row"><label for="optSpeech">発声を読み上げる${hasTTS?'':'（このブラウザは非対応）'}</label><input type="checkbox" id="optSpeech"${o.voice?' checked':''}${hasTTS?'':' disabled'}></div>
    <p class="note">コミッション方式は次のラウンドから反映されます。「ランダム」の場合、方式が切り替わるたびに大きく掲示されます。特定の方式だけを繰り返し練習したいときは、方式を選んで固定してください。</p>
    <p class="note">テーブルは3人掛けです。ドロー条件表のヒントは難易度ADVANCED以降では自動的に消えます（現在：<b>${df.label}</b>）。</p>
    <p class="note">「ドロー判定が起きる手札を多めに配る」をオンにすると、ナチュラルで即終了になる配りを減らして3枚目の判定を練習できます。実際の出現率どおりに回したい場合はオフにしてください。</p>

    <h4>現在のテーブルルール</h4>
    <p class="note"><b>${esc(T.rule.short)}</b>（${esc(T.rule.name)}）<br>${esc(T.rule.desc)}<br>タイ配当 ${T.tiePay}:1 ／ ${T.perfectPair?'パーフェクトペアあり（スート一致のペアは25:1）':'ペアは一律11:1'}</p>
    <p class="note">バカラはカジノごとにバンカー勝ちの扱いが変わります。ラウンドごとにルールが切り替わり、切り替わった瞬間にテーブル上へ大きく掲示されます。</p>

    <h4>バンカーの3枚目 条件表</h4>
    <table class="rule-table">
      <tr><td class="lead">バンカー合計</td>${bankerRow.map(r=>`<th>${r[0]}</th>`).join('')}</tr>
      <tr><td class="lead">ヒットする<br>プレイヤー3枚目</td>${bankerRow.map(r=>`<td>${r[1]}</td>`).join('')}</tr>
    </table>
    <p class="note">プレイヤーが3枚目を引かなかった（6・7でスタンドした）場合は、この表は使いません。バンカーもプレイヤーと同じく<b>0〜5でヒット、6〜7でスタンド</b>になります。</p>
    <p class="note">覚え方：<b>3は8だけ避ける／4は2〜7／5は4〜7／6は6〜7</b>。ヒットする範囲が「両端から1つずつ狭くなっていく」と捉えると、4→5→6の並びが頭に入ります。0〜2は必ず引く、7は必ず引かない。</p>

    <div class="payout-guide">
      <div class="phase">チップ・カウンティングのコツ</div>
      <ul>${CHIP_GUIDE.map(g=>`<li><b>${esc(g[0])}</b>：${esc(g[1])}</li>`).join('')}</ul>
      <p class="note">金額を出す場面では、今回の金額に合わせた内訳・換算・出し方を表示します（BASIC／STANDARDは内訳つき、ADVANCED以降は内訳を伏せ、間違えたときだけ表示）。間違えたときは、差額から「枚数の数え間違い」か「金額の暗算ミス」かを切り分けて示します。集中して練習したいときはホームの「チップカウント道場」へ。</p>
    </div>
    <div class="payout-guide">
      <div class="phase">配当と暗算のコツ</div>
      <ul>
        <li><b>プレイヤー 1:1</b>：元金と同額。</li>
        <li><b>バンカー 1:1</b>：同額。ただしコミッション方式なら後から4%か5%を徴収、ノーコミッション方式なら合計6の勝ちだけ半額（2で割る）。</li>
        <li><b>タイ 8:1 または 9:1</b>：8倍は2倍を3回。9倍は10倍から元金1回分を引く。</li>
        <li><b>ペア 11:1</b>：10倍に元金1回分を足す。</li>
        <li><b>パーフェクトペア 25:1</b>：100倍を出して4で割る。</li>
        <li><b>ドラゴンボーナス</b>：点差9＝30:1／8＝10:1／7＝6:1／6＝4:1／5＝2:1／4＝1:1。点差3以下はハズレ。賭けた側がナチュラルで勝てば1:1、ナチュラル同士のタイはプッシュ。</li>
        <li><b>コミッション5%</b>：10%の半分。<b>4%</b>：1%を4倍。どちらも端数は$1単位に切り上げ。</li>
      </ul>
      <p class="note">どれも「10倍・100倍・倍々」など切りのいい数へ一度寄せてから足し引きする考え方。チップを出す前に、この分解を頭の中で一言つぶやく癖をつけると速くなります。</p>
    </div>
    <p class="note"><button type="button" class="act" data-act="openRules">ルールブック（配当表・手順・イレギュラー）を開く</button></p>
    <button class="danger" data-act="resetStats">通算成績をリセット</button>`;
}

function render(){renderMeta();renderTable();renderCaption();renderConsole();renderLog();}

/* ---- 質問チャット ---- */
const CHAT=[];
function chatPush(who,text,hint){CHAT.push({who,text,hint:!!hint});if(CHAT.length>80)CHAT.shift();}
function renderChat(){
  const box=$('chatBody');if(!box)return;
  box.innerHTML=CHAT.map(m=>`<div class="cm ${m.who}${m.hint?' hint':''}">${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('');
  box.scrollTop=box.scrollHeight;
  $('chatSug').innerHTML=CHAT_SUGGEST.map(s=>`<button type="button" data-act="chatAsk" data-arg="${esc(s)}">${esc(s)}</button>`).join('');
}
function chatSend(text){
  text=String(text||'').trim();if(!text)return;
  chatPush('me',text);
  const r=chatAnswer(G,text);
  chatPush('bot',r.text,r.hint);
  /* 答えに正解が含まれた質問は、そのラウンドの「ヒント使用」として数える */
  if(r.hint&&G.round&&G.phase!=='done'){G.round.hints=(G.round.hints||0)+1;}
  renderChat();
}
function toggleChat(open){
  const p=$('chat'),show=open===undefined?p.hidden:open;
  p.hidden=!show;$('btnChat').setAttribute('aria-expanded',String(show));
  if(show){
    if(!CHAT.length)chatPush('bot',CHAT_INTRO);
    renderChat();
    /* スマホでは開いた途端にキーボードが出て画面を覆うため、自動フォーカスは広い画面だけ */
    if(window.matchMedia('(min-width:601px)').matches)$('chatInput').focus();
  }
}

let signTimer=0;
function scheduleSignClose(){
  clearTimeout(signTimer);
  if(!G.signOpen)return;
  signTimer=setTimeout(()=>{if(G.signOpen){G.signOpen=false;render();}},5200);
}

function doAct(key,arg){
  const prevPending=!!G.pending,prevPhase=G.phase;
  const exNow=G.pending?null:expected(G);
  const pre={
    betId:G.pending&&G.pending.ex?G.pending.ex.betId:null,
    group:exNow&&exNow.group?exNow.group:null,
    side:exNow&&exNow.side?exNow.side:null,
    pHand:ptOf('.hand.h-p .cards'),
    bHand:ptOf('.hand.h-b .cards'),
    accType:G.flags&&G.flags.acc?G.flags.acc.type:null
  };
  /* ルール掲示は felt を覆うため、最初の操作が入った時点で必ず閉じる
     （テーブル上のチップを選ぶ場面でクリックを遮らないように） */
  if(G.signOpen&&key!=='start'){G.signOpen=false;clearTimeout(signTimer);}
  const r=act(G,key,arg);
  if(r){STATS.cats[r.cat][r.ok?'ok':'ng']++;}
  if(G.phase==='done'&&!G._counted){STATS.rounds++;G._counted=true;}
  if(G.phase!=='done')G._counted=false;
  save(STORE_STATS,STATS);render();
  /* 効果音・振動：チップを置く音／正解／ミス／ラウンド終了。結果はコンソールの光り方でも返す */
  if(key==='chip'||key==='chipUndo'||key==='chipClear')SFX.play('chip');
  else if(r){SFX.play(!r.ok?'ng':(G.phase==='done'&&prevPhase!=='done')?'round':key==='chipPay'?'pay':'ok');pulseConsole(r.ok);}
  if(prevPhase==='done'||prevPhase==='idle')scheduleSignClose();
  if(r&&r.ok&&G.opts.showDealer!==false){
    const frames=buildMotion(key,arg,pre);
    if(frames)Dealer.play(frames,MOTION_LABEL[key]||'');
  }
  if((G.phase==='done'&&prevPhase!=='done')||(G.pending&&!prevPending)||(G.pending&&r&&!r.ok)){
    const el=G.pending?document.querySelector('.con-foot'):$('console');
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='toggleSettings'){const p=$('settings');p.hidden=!p.hidden;$('btnSettings').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)renderSettings();return;}
  if(a==='toggleVoice'){
    G.opts.voice=!G.opts.voice;save(STORE_OPTS,G.opts);
    if('speechSynthesis' in window){if(G.opts.voice)speak([G.caption].filter(c=>c.en));else speechSynthesis.cancel();}
    renderCaption();return;
  }
  if(a==='toggleChat'){toggleChat();return;}
  if(a==='chatAsk'){chatSend(el.dataset.arg);return;}
  if(a==='closeSign'){G.signOpen=false;clearTimeout(signTimer);render();return;}
  if(a==='openRules'){$('settings').hidden=true;$('btnSettings').setAttribute('aria-expanded','false');toggleChat(false);openRules('baccarat');return;}
  if(a==='closeRules'){closeRules();return;}
  if(a==='replay'){Dealer.replay();return;}
  if(a==='resetStats'){STATS=emptyStats();save(STORE_STATS,STATS);render();return;}
  doAct(a,el.dataset.arg);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='optAdaptive')G.opts.adaptiveDifficulty=e.target.checked;
  else if(id==='optRuleMode')G.opts.ruleMode=e.target.value;
  else if(id==='optDrawFocus')G.opts.drawFocus=e.target.checked;
  else if(id==='optHints')G.opts.showDrawHints=e.target.checked;
  else if(id==='optChipCoach')G.opts.showChipCoach=e.target.checked;
  else if(id==='optZone')G.opts.showZoneHints=e.target.checked;
  else if(id==='optDealer'){G.opts.showDealer=e.target.checked;Dealer.stop();}
  else if(id==='optSpeed')G.opts.dealerSpeed=+e.target.value;
  else if(id==='optAccidents')G.opts.accidents=e.target.value;
  else if(id==='optSfx')G.opts.sfx=e.target.checked;
  else if(id==='optSpeech'){G.opts.voice=e.target.checked;if(!G.opts.voice&&'speechSynthesis' in window)speechSynthesis.cancel();}
  else return;
  save(STORE_OPTS,G.opts);render();
});
$('chatForm').addEventListener('submit',e=>{
  e.preventDefault();
  const i=$('chatInput');chatSend(i.value);i.value='';
  if(window.matchMedia('(min-width:601px)').matches)i.focus();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('chat').hidden)toggleChat(false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rulesOpen())closeRules();});
render();
</script>
</body>
</html>
