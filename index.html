<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1015">
<meta name="description" content="カジノディーラーの所作・コール・配当計算・チップカウント・イレギュラー対応を訓練するシミュレーター。">
<title>Dealer Simulator — カジノディーラー訓練</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23B83A3A'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%23F6F1E4' stroke-width='8' stroke-dasharray='10 21.4'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%23B83A3A' stroke='%23F4DA94' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B1015;--surface:#17202A;--surface2:#1E2934;--surface3:#263341;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --text:#E9EEF3;--text2:#A7B4C1;--text3:#7D8B99;
  --gold:#D9B25F;--gold2:#F4DA94;--ok:#43C98B;--ng:#FF7062;--warn:#F3BD4E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{min-height:100vh;color:var(--text);font-family:"BIZ UDPGothic","Meiryo","Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.6;
  background:radial-gradient(circle at 1px 1px,rgba(243,234,217,.035) 1px,transparent 0) 0 0/22px 22px,radial-gradient(1100px 560px at 50% -10%,#16503D 0%,#0D2A22 38%,var(--bg) 75%) fixed,var(--bg);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 50px}
.brand{display:flex;align-items:center;gap:14px;justify-content:center;text-align:left}
.brand svg{width:58px;height:58px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.brand h1{margin:0;font-family:Futura,"Trebuchet MS",Georgia,sans-serif;font-weight:700;letter-spacing:.14em;font-size:clamp(24px,5vw,38px);line-height:1.1;
  background:linear-gradient(180deg,#FBE7B0 0%,#D9B25F 60%,#A9812F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:12.5px;letter-spacing:.24em;color:var(--text2);margin-top:4px}
.today{margin-top:26px;border-radius:20px;padding:18px;background:linear-gradient(135deg,rgba(23,32,42,.92),rgba(17,24,31,.92));border:1px solid rgba(217,178,95,.3);box-shadow:0 18px 40px rgba(0,0,0,.45);display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.today .lbl{font-size:11.5px;letter-spacing:.2em;color:var(--gold)}
.today h2{margin:4px 0 6px;font-size:19px;line-height:1.45}
.today p{margin:0;font-size:13px;color:var(--text2)}
.today .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:10px 18px;border-radius:12px;font-weight:bold;color:#1C1405;background:linear-gradient(180deg,#F1D58D 0%,#D9B25F 55%,#B88E3B 100%);border:1px solid #8E6C26;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.today .go:hover{filter:brightness(1.06)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center}
.kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi small{display:block;font-size:11px;color:var(--text3)}
.kpi b{font-family:Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
.kpi b small{display:inline;font-size:12px;color:var(--text2);margin-left:2px;font-family:inherit}
.sec{font-size:12px;letter-spacing:.2em;color:var(--gold);margin:30px 0 10px;font-weight:normal;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--line2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#1A232D,#141B23);border:1px solid var(--line2);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:rgba(217,178,95,.65);transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.card:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.tile{flex:none;width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#17765A,#0D4A39 70%);border:1px solid rgba(217,178,95,.35);box-shadow:inset 0 0 14px rgba(0,0,0,.4)}
.tile svg{width:46px;height:46px}
.tile.drill{background:radial-gradient(ellipse at 50% 20%,#3A4A5C,#1E2834 70%)}
.tile.irr{background:radial-gradient(ellipse at 50% 20%,#6B2A2B,#381618 70%)}
.tile.book{background:radial-gradient(ellipse at 50% 20%,#5A4A22,#2E2611 70%)}
.info{flex:1;min-width:0}
.info .name{font-size:17px;font-weight:bold;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.info .name small{font-family:Georgia,serif;font-size:10.5px;letter-spacing:.18em;color:var(--gold);font-weight:normal}
.info .desc{font-size:12.5px;color:var(--text2);line-height:1.55;margin-top:2px}
.info .stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:11px;border-radius:999px;padding:1px 9px;border:1px solid var(--line2);color:var(--text2);white-space:nowrap}
.pill b{color:#fff;font-weight:bold}
.pill.new{border-color:rgba(217,178,95,.6);color:var(--gold2)}
.ring{flex:none;width:52px;height:52px;position:relative}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:13px;font-weight:bold}
.ring span.none{font-size:11px;color:var(--text3);font-family:inherit;font-weight:normal}
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ref{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line2)}
.ref:hover{border-color:rgba(217,178,95,.6)}
.ref .tile{width:42px;height:42px;border-radius:10px}
.ref .tile svg{width:28px;height:28px}
.ref b{display:block;font-size:14px}
.ref small{font-size:11.5px;color:var(--text2)}
footer{margin-top:40px;text-align:center;font-size:11.5px;color:var(--text3);line-height:1.8}
footer .ver{font-family:Georgia,serif;letter-spacing:.14em}
@media (max-width:760px){
  .wrap{padding:18px 12px 40px}
  .brand svg{width:46px;height:46px}
  .today{grid-template-columns:1fr;padding:14px;gap:12px;margin-top:18px}
  .today h2{font-size:17px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:6px}
  .kpi{padding:6px 7px}.kpi b{font-size:18px}.kpi small{font-size:10px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:12px;gap:12px}
  .tile{width:54px;height:54px}.tile svg{width:40px;height:40px}
  .info .name{font-size:16px}
  .info .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .refs{grid-template-columns:1fr}
  .sec{margin:24px 0 8px}
}
@media (max-width:380px){.kpis{grid-template-columns:repeat(2,1fr)}.ring{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#B83A3A"/><circle cx="32" cy="32" r="30" fill="none" stroke="#F6F1E4" stroke-width="8" stroke-dasharray="10 21.4"/><circle cx="32" cy="32" r="18" fill="#B83A3A" stroke="#F4DA94" stroke-width="2.5"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#FBF4E2" font-family="Georgia,serif">DS</text></svg>
    <div><h1>DEALER SIMULATOR</h1><div class="sub">CASINO DEALER TRAINING</div></div>
  </div>

  <section class="today" aria-label="今日のおすすめ">
    <div id="reco"></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <h2 class="sec">テーブル実習</h2>
  <div class="grid" id="games"></div>

  <h2 class="sec">スキルドリル</h2>
  <div class="grid" id="drills"></div>

  <h2 class="sec">リファレンス</h2>
  <div class="refs">
    <a class="ref" href="rules.html"><span class="tile book"><svg viewBox="0 0 24 24" fill="none" stroke="#F4DA94" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v12H8.5A3.5 3.5 0 0 1 5 16.5z"/><path d="M5 16.5A3.5 3.5 0 0 1 8.5 13H19"/></svg></span><span><b>ルールブック</b><small>配当表・手順・コール</small></span></a>
    <a class="ref" href="rules.html#chips"><span class="tile book"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#23885A"/><circle cx="12" cy="12" r="9" fill="none" stroke="#F6F1E4" stroke-width="3" stroke-dasharray="3 6.4"/><circle cx="12" cy="12" r="5" fill="#23885A" stroke="#F4DA94" stroke-width="1"/></svg></span><span><b>チップの基本</b><small>色・換算・数え方</small></span></a>
    <a class="ref" href="rules.html#glossary"><span class="tile book"><svg viewBox="0 0 24 24" fill="none" stroke="#F4DA94" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg></span><span><b>用語集</b><small>現場の呼び方と英語</small></span></a>
  </div>

  <footer>
    <div class="ver">DEALER SIMULATOR</div>
    練習の記録はこの端末のブラウザにだけ保存されます（通信は行いません）。<br>
    配当・端数・イレギュラーの扱いはカジノやスクールにより異なります。所属先の規定に従ってください。
  </footer>
</div>
<script>
/* ===== ホーム =====
   各ページが localStorage に残す通算成績を読み、ゲームごとの進み具合と
   「いま一番伸ばすべき練習」を出す。通信はせず、この端末の記録だけを使う。 */
const ICON={
  roulette:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#3A2A20" stroke="#C9A24B" stroke-width="1.5"/>'+Array.from({length:18},(_,i)=>{const a0=i*20*Math.PI/180,a1=(i+1)*20*Math.PI/180,r=19,ri=11;const p=(r,a)=>`${(24+r*Math.cos(a)).toFixed(1)} ${(24+r*Math.sin(a)).toFixed(1)}`;return `<path d="M${p(r,a0)} A${r} ${r} 0 0 1 ${p(r,a1)} L${p(ri,a1)} A${ri} ${ri} 0 0 0 ${p(ri,a0)}Z" fill="${i===0?'#127047':i%2?'#B3261E':'#1B1B1B'}"/>`;}).join('')+'<circle cx="24" cy="24" r="10" fill="#3A2A20" stroke="#C9A24B"/><circle cx="24" cy="24" r="3" fill="#C9A24B"/><circle cx="35" cy="12.5" r="2.4" fill="#FAF7EF"/></svg>',
  baccarat:'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="9" width="20" height="28" rx="3" fill="#FAF7EF" transform="rotate(-10 17 23)"/><text x="15" y="27" font-size="12" font-weight="bold" fill="#B3261E" font-family="Georgia,serif" transform="rotate(-10 17 23)">9♦</text><rect x="21" y="11" width="20" height="28" rx="3" fill="#FAF7EF" transform="rotate(8 31 25)"/><text x="25" y="29" font-size="12" font-weight="bold" fill="#1B1B1B" font-family="Georgia,serif" transform="rotate(8 31 25)">8♠</text></svg>',
  blackjack:'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="9" width="20" height="28" rx="3" fill="#FAF7EF" transform="rotate(-10 17 23)"/><text x="12" y="27" font-size="12" font-weight="bold" fill="#1B1B1B" font-family="Georgia,serif" transform="rotate(-10 17 23)">A♠</text><rect x="21" y="11" width="20" height="28" rx="3" fill="#FAF7EF" transform="rotate(8 31 25)"/><text x="25" y="29" font-size="12" font-weight="bold" fill="#B3261E" font-family="Georgia,serif" transform="rotate(8 31 25)">K♥</text></svg>',
  poker:'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="8" width="18" height="25" rx="3" fill="#FAF7EF" transform="rotate(-8 14 20)"/><text x="8" y="24" font-size="11" font-weight="bold" fill="#B3261E" font-family="Georgia,serif" transform="rotate(-8 14 20)">Q♥</text><circle cx="33" cy="31" r="11" fill="#1C1D22"/><circle cx="33" cy="31" r="11" fill="none" stroke="#E9E2CF" stroke-width="3.5" stroke-dasharray="3.6 7.9"/><circle cx="33" cy="31" r="6.5" fill="#1C1D22" stroke="#C9A24B"/><circle cx="31" cy="19" r="6" fill="#F4EFE2" stroke="#C9A24B" stroke-width="1.5"/><text x="31" y="22.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#1D232B" font-family="Georgia,serif">D</text></svg>',
  chips:'<svg viewBox="0 0 48 48" aria-hidden="true">'+[0,1,2,3,4,5].map(i=>`<ellipse cx="17" cy="${38-i*4.2}" rx="11" ry="3.6" fill="#23885A" stroke="rgba(0,0,0,.35)" stroke-width=".6"/><rect x="${9+(i%2)*3}" y="${36.5-i*4.2}" width="2.6" height="3" fill="#F6F1E4"/><rect x="${20+(i%2)*2}" y="${37-i*4.2}" width="2.6" height="3" fill="#F6F1E4"/>`).join('')+[0,1,2,3].map(i=>`<ellipse cx="34" cy="${38-i*4.2}" rx="11" ry="3.6" fill="#1C1D22" stroke="rgba(255,255,255,.2)" stroke-width=".6"/><rect x="${26+(i%2)*3}" y="${36.5-i*4.2}" width="2.6" height="3" fill="#E9E2CF"/><rect x="${37+(i%2)*2}" y="${37-i*4.2}" width="2.6" height="3" fill="#E9E2CF"/>`).join('')+'</svg>',
  irr:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 44 40H4z" fill="#3A1517" stroke="#FF7062" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 18v11" stroke="#FFD9D3" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="34.5" r="2.4" fill="#FFD9D3"/></svg>'
};
const GAMES=[
  {id:'roulette',href:'roulette.html',name:'ルーレット',en:'ROULETTE',desc:'ボール投入・締切・コール・ドリー・回収と配当の順番。ボールの飛び出し・床への落下など実戦のアクシデントも。',key:'dsim_rl_stats',
   cats:{spin:'スピン・投入',close:'締切宣言',call:'コール・ドリー',take:'回収手順',pay:'配当計算',security:'セキュリティ所作',accident:'アクシデント対応'}},
  {id:'baccarat',href:'baccarat.html',name:'バカラ',en:'BACCARAT',desc:'配り順・絞りの指名・3枚目の条件表・4つのハウスルール・コミッション計算。',key:'dsim_bc_stats',
   cats:{deal:'配り手順',squeeze:'スクイーズ',count:'点数計算',draw:'3枚目の判定',call:'コール',take:'回収手順',pay:'配当計算',commission:'コミッション',security:'セキュリティ所作',accident:'アクシデント対応'}},
  {id:'blackjack',href:'blackjack.html',name:'ブラックジャック',en:'BLACKJACK',desc:'配布・ピークとインシュアランス・合図の読み取り・ディーラーのドロー・3:2の配当。難易度は自動で上がる。',key:'dsim_bj_stats',
   cats:{deal:'配布手順',check:'ピーク・インシュアランス',play:'プレイヤー対応',dealer:'ディーラードロー',settle:'精算',pay:'配当計算',accident:'アクシデント対応'}},
  {id:'poker',href:'poker.html',name:'ポーカー',en:'POKER',desc:'ボタンとブラインド・アクション順・最小レイズ・サイドポット・レーキ・チョップ。',key:'dsim_pk_stats',
   cats:{button:'ボタン・ブラインド',deal:'配り順',board:'バーン・ボード',order:'アクション順',ruling:'ベット判定',pot:'ポット計算',showdown:'ショーダウン',rake:'レーキ',pay:'払い出し',security:'セキュリティ所作',accident:'アクシデント対応'}}
];
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gameStat(g){
  const st=load(g.key);let ok=0,ng=0,weak=null;
  if(st&&st.cats)Object.entries(st.cats).forEach(([k,c])=>{ok+=c.ok||0;ng+=c.ng||0;
    const t=(c.ok||0)+(c.ng||0);if(t>=5&&g.cats[k]){const a=(c.ok||0)/t;if(!weak||a<weak.acc)weak={k,name:g.cats[k],acc:a,t,ng:c.ng||0};}});
  return{rounds:st&&st.rounds||0,ok,ng,acc:ok+ng?ok/(ok+ng):null,weak};
}
function ring(acc){
  if(acc===null)return `<div class="ring" aria-hidden="true"><span class="none">未挑戦</span></div>`;
  const r=22,c=2*Math.PI*r,col=acc>=.9?'#43C98B':acc>=.75?'#D9B25F':'#FF7062';
  return `<div class="ring" aria-label="正答率${Math.round(acc*100)}%"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c*acc).toFixed(1)} ${c.toFixed(1)}"/></svg><span>${Math.round(acc*100)}%</span></div>`;
}
function render(){
  const stats=GAMES.map(g=>Object.assign({g},gameStat(g)));
  document.getElementById('games').innerHTML=stats.map(s=>`<a class="card" href="${s.g.href}">
    <span class="tile">${ICON[s.g.id]}</span>
    <span class="info"><span class="name">${s.g.name}<small>${s.g.en}</small></span><span class="desc">${s.g.desc}</span>
      <span class="stat">${s.rounds?`<span class="pill"><b>${s.rounds}</b> ラウンド</span>`:'<span class="pill new">はじめる</span>'}${s.weak&&s.weak.acc<.85?`<span class="pill">苦手：${esc(s.weak.name)}</span>`:''}</span></span>
    ${ring(s.acc)}</a>`).join('');

  const chip=load('dsim_chip_v1'),irr=load('dsim_irr_v1');
  const chipQ=chip&&chip.total?chip.total.q:0,chipAcc=chipQ?chip.total.ok/chipQ:null;
  const order='SABC';let bestRank=null;
  if(chip&&chip.best)Object.values(chip.best).forEach(v=>{if(!bestRank||order.indexOf(v.rank)<order.indexOf(bestRank))bestRank=v.rank;});
  let irrOk=0,irrNg=0,irrSeen=0;if(irr&&irr.seen)Object.values(irr.seen).forEach(v=>{irrOk+=v.ok||0;irrNg+=v.ng||0;irrSeen++;});
  const irrAcc=irrOk+irrNg?irrOk/(irrOk+irrNg):null;
  document.getElementById('drills').innerHTML=`
    <a class="card" href="chips.html"><span class="tile drill">${ICON.chips}</span><span class="info"><span class="name">チップカウント道場<small>CHIP COUNT</small></span>
      <span class="desc">数える（スタック読み）・払う（ピクチャーベット・3:2・コミッション）・出す（最少枚数）を10問／60秒で反復。</span>
      <span class="stat">${chipQ?`<span class="pill"><b>${chipQ}</b> 問</span>`:'<span class="pill new">はじめる</span>'}${bestRank?`<span class="pill">最高ランク <b>${bestRank}</b></span>`:''}</span></span>${ring(chipAcc)}</a>
    <a class="card" href="irregular.html"><span class="tile irr">${ICON.irr}</span><span class="info"><span class="name">イレギュラー対応<small>IRREGULARITY</small></span>
      <span class="desc">カードが落ちた・めくれた・ボールが落ちた…。手元の事故にその場でどう動くか、なぜそうするかを判断する。</span>
      <span class="stat">${irrSeen?`<span class="pill"><b>${irrSeen}</b> 場面に挑戦</span>`:'<span class="pill new">はじめる</span>'}</span></span>${ring(irrAcc)}</a>`;

  /* おすすめ：まだ触っていないもの→正答率が一番低いカテゴリ→チップ道場 の順に提案する */
  const totalRounds=stats.reduce((a,s)=>a+s.rounds,0),okAll=stats.reduce((a,s)=>a+s.ok,0),ngAll=stats.reduce((a,s)=>a+s.ng,0);
  let reco;
  const untouched=stats.find(s=>!s.rounds);
  const weakest=stats.filter(s=>s.weak).sort((a,b)=>a.weak.acc-b.weak.acc)[0];
  if(!totalRounds)reco={h:'まずはルーレットで1ラウンド',p:'ボール投入→締切→コール→回収→配当の流れを、ディーラーの手の動きと一緒に見て覚えます。手順そのものが採点の対象です。',href:'roulette.html',go:'ルーレットを始める'};
  else if(weakest&&weakest.weak.acc<.8){
    const pay=['pay','commission','pot','rake'].includes(weakest.weak.k),acc=weakest.weak.k==='accident';
    if(acc)reco={h:`${weakest.g.name}の「アクシデント対応」が正答率${Math.round(weakest.weak.acc*100)}%`,p:'事故の後は「手を止める・独断で直さない・声に出してフロアを呼ぶ」。イレギュラー対応ドリルで場面ごとの正解と理由を固めてから、卓に戻りましょう。',href:'irregular.html',go:'イレギュラー対応ドリルへ'};
    else reco={h:`${weakest.g.name}の「${esc(weakest.weak.name)}」が正答率${Math.round(weakest.weak.acc*100)}%`,p:pay?'金額のミスは、暗算の分解とチップの出し方を切り離して練習すると早く直ります。チップカウント道場で10問だけ集中してから卓に戻りましょう。':`${weakest.weak.t}回中${weakest.weak.ng}回ミスしています。ルールブックで手順と理由を読み直してから、もう一度実習しましょう。`,
      href:pay?'chips.html':weakest.g.href,go:pay?'チップカウント道場へ':`${weakest.g.name}で練習する`};
  }
  else if(untouched)reco={h:`次は${untouched.g.name}に挑戦`,p:`${untouched.g.desc}`,href:untouched.g.href,go:`${untouched.g.name}を始める`};
  else if(!irrSeen)reco={h:'イレギュラー対応を身につける',p:'手順どおりに進まない場面こそ現場で差が出ます。原則は「手を止める・独断で動かさない・声に出す」。',href:'irregular.html',go:'ドリルを始める'};
  else reco={h:'チップカウントで仕上げる',p:'正確さ→最少枚数→速さの順に。60秒アタックでランクSを目指しましょう。',href:'chips.html',go:'チップカウント道場へ'};
  document.getElementById('reco').innerHTML=`<div class="lbl">TODAY'S TRAINING</div><h2>${reco.h}</h2><p>${reco.p}</p><a class="go" href="${reco.href}">${reco.go} ▶</a>`;
  const acc=okAll+ngAll?Math.round(okAll/(okAll+ngAll)*100):null;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><small>実習ラウンド</small><b>${totalRounds}</b></div>
    <div class="kpi"><small>実習の正答率</small><b>${acc===null?'—':acc+'<small>%</small>'}</b></div>
    <div class="kpi"><small>チップ問題</small><b>${chipQ}</b></div>
    <div class="kpi"><small>イレギュラー</small><b>${irrAcc===null?'—':Math.round(irrAcc*100)+'<small>%</small>'}</b></div>`;
}
render();
/* 他のページから戻ったとき（bfcache）にも最新の記録を出す */
addEventListener('pageshow',render);
</script>
