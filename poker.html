const TBL={W:1060,H:620,cx:530,cy:474,rx:514,ry:458,tA:348,tB:192,mob:false};
function TP(fr,deg){const t=deg*Math.PI/180;return{x:TBL.cx+TBL.rx*fr*Math.cos(t),y:TBL.cy+TBL.ry*fr*Math.sin(t)};}
function arcPts(fr,d0,d1,n){
  const out=[];
  for(let i=0;i<=n;i++)out.push(TP(fr,d0+(d1-d0)*i/n));
  return out;
}
function poly(pts){return pts.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');}

/* 楕円の円弧は角度を等分しても弧の長さが等分にならず、端のポジションだけ枠が
   潰れて重なる。実物の台はポジションが等間隔に並ぶので、弧長で等分した位置
   （u：左端0〜右端1）を座標の基準にする。 */
const ARCT={};
function arcTable(fr){
  const key=fr.toFixed(3);
  if(ARCT[key])return ARCT[key];
  const N=360,pts=[],cum=[0];
  for(let i=0;i<=N;i++)pts.push(TP(fr,TBL.tA+(TBL.tB-TBL.tA)*i/N));
  for(let i=1;i<=N;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  return ARCT[key]={pts,cum,N,total:cum[N]};
}
/* u（0〜1）の位置の座標と、その点での角度 */
function atU(fr,u){
  const T=arcTable(fr),target=Math.max(0,Math.min(1,u))*T.total;
  let i=1;while(i<T.N&&T.cum[i]<target)i++;
  const a=T.cum[i-1],b=T.cum[i],k=(target-a)/Math.max(1e-6,b-a);
  const p=T.pts[i-1],q=T.pts[i];
  return{x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k,
    deg:TBL.tA+(TBL.tB-TBL.tA)*((i-1+k)/T.N)};
}
function feltPath(){
  const B=TBL.H-8;
  return `M 1044 ${B-12} Q 1044 ${B} 1032 ${B} L 28 ${B} Q 16 ${B} 16 ${B-12} L 16 ${TBL.cy} L ${poly(arcPts(1,180,360,60))} Z`;
}


/* ===== テーブル・レイアウト（ハーフムーン型・6人掛け）=====
   画面はディーラー目線。ディーラーは半円の直線側（下辺）に立ち、客は円弧側（奥）に6席並ぶ。席番号はディーラーの左隣
   （画面左端）が1番で、時計回り（画面では左→右）に2〜6番。
   各席は外側から「席番号・持ち点」「ホールカード」「ベット」の順に並び、中央にボード・ポット。
   ボタンの移動・SB/BB・配り・アクションの順番は、すべてこの配置と番号で決まる。 */
const FR={rim:.972,stack:.918,state:.845,cards:.705,bet:.50,tag:.972};
function seatU(s){return 1-(s-0.5)/SEATS;}
function seatPt(s,fr,du){return atU(fr,seatU(s)+(du||0)/SEATS);}
const BOARD={x0:406,dx:62,y:358,w:52,h:72};
const MOB_OVERHEAD=512;   /* スマホで、テーブル以外（ヘッダー・字幕・コンソール最大時・客の帯）が占める縦の高さ */
function slotPt(i){return{x:BOARD.x0+i*BOARD.dx,y:BOARD.y};}
const POT_PT={x:530,y:424};
const PUCK_REST={x:758,y:522};
/* スマホ幅では、画面に余った縦の空きぶんだけテーブルを縦に伸ばす（選択肢は1画面に収めたまま）。
   文字・カード・チップは幅基準なので、伸ばした分は座席の間隔と各要素の拡大に回る。 */
function fitTable(){
  const mob=window.matchMedia('(max-width:600px)').matches;
  const w=Math.max(280,innerWidth-26);
  let H=620;
  if(mob)H=Math.max(620,Math.min(1240,Math.round((innerHeight-MOB_OVERHEAD)*TBL.W/w)));
  if(Math.abs(H-TBL.H)<=24&&mob===TBL.mob)return false;
  TBL.H=H;TBL.mob=mob;TBL.cy=H-146;TBL.ry=TBL.cy-16;
  for(const k in ARCT)delete ARCT[k];
  if(mob){
    /* スマホは文字を大きくしたぶん、縁（席番号・持ち点）→カード→ベット→ボード→ポットの間隔を
       卓の高さから決める。ポットは手前の線のすぐ上、ボードはその上、カードは席の札の下、
       ベットはカードとボードの中間（縦に縮んでも、この順で重ならないように詰める） */
    BOARD.w=68;BOARD.h=96;BOARD.dx=78;BOARD.x0=TBL.cx-2*78;
    POT_PT.y=TBL.cy-80;
    BOARD.y=POT_PT.y-80-BOARD.h/2;
    const top=.974*TBL.ry,cardOff=.947*TBL.ry-165,boardOff=TBL.cy-BOARD.y;
    FR.cards=cardOff/top;FR.bet=(cardOff+boardOff)/2/top;
    PUCK_REST.x=686;PUCK_REST.y=TBL.H-78;
  }else{
    BOARD.w=52;BOARD.h=72;BOARD.dx=62;BOARD.x0=406;
    BOARD.y=TBL.cy-TBL.ry*.253;
    POT_PT.y=TBL.cy-TBL.ry*.11;
    PUCK_REST.x=758;PUCK_REST.y=TBL.H-98;
    FR.cards=.705;FR.bet=.50;
  }
  return true;
}
fitTable();
function pct(q){return `left:${(q.x/TBL.W*100).toFixed(2)}%;top:${(q.y/TBL.H*100).toFixed(2)}%`;}

function cardHTML(c,faceUp,cls,size){
  if(!faceUp)return `<div class="pc ${size||''} back ${cls||''}"><span class="r">?</span></div>`;
  return `<div class="pc ${size||''} ${c.suit.c} ${cls||''}"><span class="r">${c.rank}</span><span class="s">${c.suit.m}</span></div>`;
}
function cardSpan(c){return `<span class="${c.suit.c==='red'?'rd':'bk'}">${cardText(c)}</span>`;}

function tableSvgHTML(G,ex){
  const T=G.stakes,F=G.flags,has=G.players.length>0;
  const declSeat=ex&&(ex.key==='ruling'||ex.key==='confirmCall')?ex.seat:0;
  let seats='';
  for(let s=1;s<=SEATS;s++){
    const p=has?pl(G,s):null,out=p&&p.folded;
    const b=seatPt(s,FR.rim);
    let st=seatPt(s,FR.stack),sm=seatPt(s,FR.state);
    /* スマホ：文字を大きくしたので、持ち点は席番号の札の真下、状態（FOLD）はその下に積む。
       オールインで持ち点が$0の間は、持ち点の位置に ALL-IN を出す（カードと重ならないように1行で済ませる） */
    const mobAllin=TBL.mob&&p&&p.allin&&!out&&p.stack<=0;
    if(TBL.mob&&p){
      const sText=mobAllin?'ALL-IN':fmt$(p.stack);
      st={x:mobLabelX(b.x,b.y+62,sText.length*(mobAllin?13.5:11)+6),y:b.y+62};
      sm={x:mobLabelX(b.x,b.y+102,out?52:82),y:b.y+102};
    }else if(p){
      /* PC：持ち点・状態は札の真下に積む（外周の内側へずらすと、両脇の席で札と横に並んで重なる） */
      st={x:mobLabelX(b.x,b.y+40,fmt$(p.stack).length*6.5+4),y:b.y+40};
      sm={x:mobLabelX(b.x,b.y+62,out?26:40),y:b.y+62};
    }
    seats+=`<circle class="seat-badge${declSeat===s?' act':''}${out?' out':''}" cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="${TBL.mob?27:17}"/>`
      +`<text class="seat-no${out?' out':''}" x="${b.x.toFixed(1)}" y="${(b.y+1).toFixed(1)}">${s}</text>`;
    if(p){
      if(mobAllin)seats+=`<text class="seat-state allin" x="${st.x.toFixed(1)}" y="${st.y.toFixed(1)}">ALL-IN</text>`;
      else seats+=`<text class="seat-stack${out?' out':''}" x="${st.x.toFixed(1)}" y="${st.y.toFixed(1)}">${fmt$(p.stack)}</text>`;
      if(out)seats+=`<text class="seat-state" x="${sm.x.toFixed(1)}" y="${sm.y.toFixed(1)}">FOLD</text>`;
      else if(p.allin&&!mobAllin)seats+=`<text class="seat-state allin" x="${sm.x.toFixed(1)}" y="${sm.y.toFixed(1)}">ALL-IN</text>`;
      const tag=G.sbSeat===s?'SB':G.bbSeat===s?'BB':'';
      /* スマホでは札の横（卓の奥側）に出す。手前側に出すと、端の席で持ち点の文字と重なる */
      if(tag){const tg=seatPt(s,FR.tag,TBL.mob?(s<=3?-.4:.4):.36);seats+=`<text class="seat-tag" x="${tg.x.toFixed(1)}" y="${(tg.y+(TBL.mob?13:5)).toFixed(1)}">${tag}</text>`;}
    }
  }
  let slots='';
  for(let i=0;i<5;i++){
    const q=slotPt(i);
    slots+=`<rect class="slot${G.board.length>i?' full':''}" data-slot="${i}" x="${q.x-BOARD.w/2}" y="${q.y-BOARD.h/2}" width="${BOARD.w}" height="${BOARD.h}" rx="5"/>`;
  }
  const total=52,left=Math.max(0,total-G.deckUsed);
  const fill=Math.max(0,Math.min(1,left/total));
  const gname=G.game==='omaha'?'OMAHA':"HOLD'EM";
  const boxes=TBL.mob?mobBoxesSVG(G,left,fill):`
    <g id="deckBox">
      <rect class="tbox" x="876" y="${TBL.H-118}" width="150" height="94" rx="6"/>
      <rect class="shoe-cards" x="886" y="${TBL.H-96}" width="${(130*fill).toFixed(0)}" height="40" rx="2"/>
      <text class="tbox-cap" x="951" y="${TBL.H-102}">DECK</text>
      <text class="tbox-val" x="951" y="${TBL.H-34}">残 ${left}</text>
    </g>
    <g id="burnBox">
      <rect class="tbox" x="774" y="${TBL.H-106}" width="86" height="64" rx="6"/>
      <text class="tbox-cap" x="817" y="${TBL.H-86}">BURN</text>
      <text class="tbox-val" x="817" y="${TBL.H-54}">${G.burned}</text>
    </g>
    <g id="rakeBox">
      <rect class="tbox" x="392" y="${TBL.H-68}" width="276" height="46" rx="6"/>
      <text class="tbox-cap" x="530" y="${TBL.H-48}">RAKE BOX</text>
      <text class="tbox-val" x="530" y="${TBL.H-28}">${fmt$(G.rakeBox)}</text>
    </g>
    <g id="muckBox">
      <rect class="tbox" x="34" y="${TBL.H-118}" width="150" height="94" rx="6"/>
      <rect class="discard-cards" x="44" y="${TBL.H-96}" width="${(130*(1-fill)).toFixed(0)}" height="40" rx="2"/>
      <text class="tbox-cap" x="109" y="${TBL.H-102}">MUCK</text>
      <text class="tbox-val" x="109" y="${TBL.H-34}">${G.muck}</text>
    </g>
    <text class="felt-logo" x="${TBL.cx}" y="${TBL.H-82}">${gname}  ${fmt$(T.sb)}/${fmt$(T.bb)}</text>`;
  return `<svg class="table-svg" viewBox="0 0 ${TBL.W} ${TBL.H}" role="img" aria-label="ポーカーテーブル">
    <path class="felt-shape" d="${feltPath()}"/>
    <path class="felt-line" d="M 16 ${TBL.cy} L 1044 ${TBL.cy}"/>
    ${boxes}
    ${slots}
    <text class="pot-cap" x="${POT_PT.x}" y="${POT_PT.y+(TBL.mob?13:50)}">POT</text>
    ${seats}
  </svg>`;
}
/* スマホ：文字の中心xを、卓の縁（楕円）の内側に収める。half は文字幅の半分（SVG単位） */
function mobLabelX(x,y,half){
  const d=Math.min(1,Math.abs(TBL.cy-y)/TBL.ry),hw=TBL.rx*Math.sqrt(1-d*d)-16;
  return Math.max(TBL.cx-hw+half,Math.min(TBL.cx+hw-half,x));
}
/* スマホ：手前の帯のボックス（マック・レーキ・バーン・デッキ）。文字を画面上11〜12pxにするため、
   箱を帯の高さいっぱいに広げ、見出しを上・数を下に置く */
function mobBoxesSVG(G,left,fill){
  const y0=TBL.H-136,h=116,cap=y0+31,val=y0+h-11,bar=y0+40;
  const box=(id,x,w,capT,valT,barCls,barW)=>`<g id="${id}">
      <rect class="tbox" x="${x}" y="${y0}" width="${w}" height="${h}" rx="8"/>
      ${barCls?`<rect class="${barCls}" x="${x+10}" y="${bar}" width="${Math.max(0,barW).toFixed(0)}" height="22" rx="2"/>`:''}
      <text class="tbox-cap" x="${x+w/2}" y="${cap}">${capT}</text>
      <text class="tbox-val" x="${x+w/2}" y="${val}">${valT}</text>
    </g>`;
  return box('muckBox',30,176,'MUCK',G.muck,'discard-cards',156*(1-fill))
    +box('rakeBox',412,236,'RAKE BOX',fmt$(G.rakeBox))
    +box('burnBox',724,120,'BURN',G.burned)
    +box('deckBox',854,176,'DECK','残 '+left,'shoe-cards',156*fill);
}

/* 客の表情。行動する席は、ディーラーが順番を指し示した後（宣言の段）だけ考え込む（指す前に顔に出すと順番の答えになる）。
   宣言は吹き出しで出す。勝者は全ポットの勝者が決まってから喜ぶ／それ以外はしょんぼり */
function pkCast(G,s){
  const F=G.flags||{},p=G.players.length?pl(G,s):null,B=G.bet;
  if(!p)return{mood:'idle',pose:'rest'};
  if(F.acc)return{mood:'surprise',pose:'rest'};
  if(p.folded)return{mood:'out',pose:'rest'};
  const ws=G.winners||{},nW=Object.keys(ws).length;
  if(nW&&G.pots&&nW>=G.pots.length){
    if(Object.values(ws).some(a=>a.includes(s)))return{mood:'happy',pose:'cheer'};
    return{mood:'sad',pose:'rest'};
  }
  if(B&&B.cur&&B.cur.stage==='declare'&&B.cur.seat===s)return{mood:'think',pose:'rest',say:evText(G,p,B.cur.ev)};
  if(p.allin)return{mood:'surprise',pose:'rest'};
  return{mood:'idle',pose:'rest'};
}
function castBub(c,s){return c.say?`<span class="cast-bub ${s<=3?'to-r':'to-l'}">${esc(c.say)}</span>`:'';}
function castLayerHTML(G,ex){
  if(!G.players.length)return '';
  let h='';
  for(let s=1;s<=SEATS;s++){
    const q=seatPt(s,1.035),c=pkCast(G,s),side=q.x<TBL.cx-150?' l':q.x>TBL.cx+150?' r':'';
    h+=`<div class="cast-at${side}" style="${pct(q)}">${Cast.html(s-1,{mood:c.mood,pose:c.pose,size:48,delay:s*.37})}${castBub(c,s)}</div>`;
  }
  return h;
}
function castBandHTML(G,ex){
  if(!G.players.length)return '<div class="cast-band"></div>';
  const declSeat=ex&&(ex.key==='ruling'||ex.key==='confirmCall')?ex.seat:0;
  let h='';
  for(let s=1;s<=SEATS;s++){
    const c=pkCast(G,s);
    h+=`<div class="cast-seat">${Cast.html(s-1,{mood:c.mood,pose:c.pose,size:34,delay:s*.37})}<i class="cast-no${declSeat===s?' on':''}">${s}</i>${castBub(c,s)}</div>`;
  }
  return `<div class="cast-band">${h}</div>`;
}
function overlayHTML(G,ex){
  const anim=G.anim||{};G.anim=null;
  let h='';
  const F=G.flags;
  /* ベット */
  G.players.forEach(p=>{
    if(p.bet<=0)return;
    const q=seatPt(p.seat,FR.bet);
    h+=`<div class="chip chip-abs bet-chip ${seatClass(p.seat)}${String(p.bet).length>=4?' d4':''}" style="${pct(q)}" data-bet="${p.seat}">${p.bet}</div>`;
  });
  /* ホールカード */
  G.players.forEach(p=>{
    if(p.folded||!p.cards.length)return;
    const q=seatPt(p.seat,FR.cards),up=G.opened;
    const xe=G.flags.expCard;
    const cs=p.cards.map((c,i)=>{const exp=xe&&xe.seat===p.seat&&xe.k===i;return cardHTML(c,up||exp,(anim.hole===p.seat&&i===p.cards.length-1?'dealt':(anim.open&&up?'flip':''))+(exp?' acc-hot':''));});
    h+=`<div class="pcards n${G.holeN}" data-cards="${p.seat}" style="${pct(q)}">${cs.join('')}</div>`;
    if(xe&&xe.seat===p.seat&&G.flags.acc)h+=`<span class="acc-mark" style="left:${(q.x/TBL.W*100).toFixed(2)}%;top:calc(${(q.y/TBL.H*100).toFixed(2)}% - 30px)"><span class="acc-tag">露出</span></span>`;
  });
  /* ボード */
  G.board.forEach((c,i)=>{
    const q=slotPt(i);
    h+=`<div class="bcard" style="${pct(q)}">${cardHTML(c,true,anim.boardFrom!==undefined&&i>=anim.boardFrom?'dealt':'','bc')}</div>`;
  });
  /* 早出しのフロップ（アクシデント） */
  if(G.earlyFlop)G.earlyFlop.forEach((c,i)=>{h+=`<div class="bcard" style="${pct(slotPt(i))}">${cardHTML(c,true,'acc-hot','bc')}</div>`;});
  if(G.earlyFlop){const q=slotPt(1);h+=`<span class="acc-mark" style="left:${(q.x/TBL.W*100).toFixed(2)}%;top:calc(${(q.y/TBL.H*100).toFixed(2)}% - 52px)"><span class="acc-tag">早出しのフロップ</span></span>`;}
  /* ポット */
  h+=`<span id="potSpot" class="pot-spot" style="${pct(POT_PT)}"></span>`;
  const showPots=G.pots&&['showdown','award','close','done'].includes(G.phase)&&G.pots.length>0;
  if(showPots){
    const n=G.pots.length;
    G.pots.forEach((P,i)=>{
      if(P.amount<=0)return;
      const q={x:POT_PT.x+(i-(n-1)/2)*(TBL.mob?178:88),y:POT_PT.y};
      h+=`<div class="chip chip-abs pot-chip" style="${pct(q)}" title="${esc(P.name)}">${P.amount}<small>${n>1?(i===0?'MAIN':'SIDE'+i):'POT'}</small></div>`;
    });
  }else if(G.pot>0){
    h+=`<div class="chip chip-abs pot-chip" style="${pct(POT_PT)}">${G.pot}<small>POT</small></div>`;
  }
  /* ディーラーボタン */
  const pq=G.button?seatPt(G.button,.63,.4):PUCK_REST;
  h+=`<div id="puck" class="puck" style="${pct(pq)}">D</div>`;
  /* 席を選ぶ場面：席の位置に押せる目印を出す */
  if(ex&&SEAT_KEYS.includes(ex.key)){
    for(let s=1;s<=SEATS;s++){
      const q=seatPt(s,FR.cards);
      h+=`<button type="button" class="seat-pick" style="${pct(q)}" data-act="${ex.key}" data-arg="${s}" aria-label="${s}番席">${s}</button>`;
    }
  }
  return h;
}

function boardInfoHTML(G){
  if(G.phase!=='bet'||!G.bet)return '';
  const B=G.bet,T=G.stakes;
  const bets=G.players.reduce((a,p)=>a+p.bet,0);
  return `<div class="board-info"><span>ポット <b>${fmt$(G.pot)}</b></span><span>場のベット <b>${fmt$(bets)}</b></span>`
    +`<span>最高額 <b>${fmt$(B.current)}</b></span><span>直前の増分 <b>${fmt$(B.minInc)}</b></span><span>最小レイズ先 <b>${fmt$(B.current+B.minInc)}</b></span></div>`;
}
function handsListHTML(G){
  if(!G.opened)return '';
  const rows=G.players.filter(p=>!p.folded&&p.cards.length).map(p=>`<div><b>${p.seat}番席</b> ${p.cards.map(cardSpan).join(' ')}</div>`).join('');
  return `<div class="hands-list${G.holeN<=2?' cols3':''}"><div class="hl-board"><b>ボード</b> ${G.board.map(cardSpan).join(' ')}${G.game==='omaha'?'<em>（ホールから2枚＋ボードから3枚）</em>':''}</div>${rows}</div>`;
}

function renderMeta(){
  const t=Object.values(STATS.cats).reduce((a,c)=>({ok:a.ok+c.ok,ng:a.ng+c.ng}),{ok:0,ng:0});
  const pct=t.ok+t.ng?Math.round(t.ok/(t.ok+t.ng)*100)+'%':'—';
  const df=currentDifficulty(G),T=G.stakes;
  $('meta').innerHTML=`<span><i class="lg">ラウンド</i><i class="sm">R</i><b>${G.roundNo}</b></span>`
    +`<span class="rule-pill"><b class="lg">${G.game==='omaha'?'オマハ':'ホールデム'} ${fmt$(T.sb)}/${fmt$(T.bb)}</b><b class="sm">${G.game==='omaha'?'NLO':'NLH'} ${T.bb}</b></span>`
    +`<span class="difficulty-pill d${df.level}"><i class="lg">難易度 </i><b>${df.label}</b></span>`
    +`<span><i class="lg">今回の</i>ミス<b>${G.round?G.round.err:0}</b></span>`
    +`<span class="only-lg"><i class="lg">通算</i>正答率<b>${pct}</b></span>`;
}

function gameSignHTML(G){
  const T=G.stakes;
  return `<div class="rule-sign" id="ruleSign">
    <div class="rule-sign-box">
      <div class="rs-cap">TODAY'S GAME</div>

let VOICE_EN=null,VOICE_JA=null;
function pickVoices(){

/* 所作 → 手先の移動シナリオ。pre は操作前に控えた座標。
   手先はデッキ・各席のカード／ベット・ボード各枠・ポット・レーキボックス・マックなど、
   テーブル上の実座標へ運ぶ。体の中心より左の席には左手、右の席には右手を出す。 */
function buildMotion(key,arg,pre){
  if(!Dealer.svg)return null;
  const R=Dealer.rest(),s=Dealer.s;
  const P=(x,y,z)=>z?{x,y,z}:{x,y};
  const RR=P(R.rx,R.ry),RL=P(R.lx,R.ly);
  const hand=x=>x<Dealer.cx-6?'l':'r';
  const deck=ptOf('#deckBox',0.5,0.45),potP=ptOf('#potSpot'),burnP=ptOf('#burnBox'),muckP=ptOf('#muckBox',0.5,0.45),rakeP=ptOf('#rakeBox');
  const seatCards=s=>ptOf(`[data-cards="${s}"]`)||svgPt(seatPt(s,FR.cards));
  const seatStack=s=>svgPt(seatPt(s,FR.stackChip||.9));
  /* from から to へ物を運ぶ標準の所作（手にとる→持ち上げて運ぶ→置く→戻る）。運ぶ途中の持ち上げはリグが付ける */
  const carry=(from,to,prop,h,gap)=>{
    const F=(t,pt,x)=>Object.assign({t,hold:h,[h]:pt},x||{});
    return[{t:0,prop:'',hold:h},
      F(200,from,{prop:''}),F(340,from,{prop}),
      F(820,to,{prop}),F(930,to,{prop:''}),
      {t:930+(gap||290),r:RR,l:RL,open:0}];
  };
  /* 指で示す（席・ポット）。手前（下）から指先を向ける */
  const point=c=>{
    const h=hand(c.x),at=P(c.x,c.y+18*s);
    return[{t:0,hold:h},{t:300,hold:h,[h]:at,[h+'p']:'point'},{t:760,hold:h,[h]:at,[h+'p']:'point'},
      {t:1060,r:RR,l:RL,rp:'',lp:''}];
  };
  switch(key){
    case 'moveButton':{
      const a=pre.puck,b=ptOf('#puck');if(!a||!b)return null;
      return carry(a,b,'puck',hand(b.x),320);
    }
    case 'selectSB':case 'selectBB':case 'nextActor':case 'showFirst':{
      const c=seatCards(+arg);if(!c)return null;
      return point(c);
    }
    case 'shuffleCut':{
      /* デッキの前で両手で混ぜ（リフル）、まとめて揃える */
      if(!deck)return null;
      const d=16*s,a=P(deck.x-d,deck.y),b=P(deck.x+d,deck.y),u=P(0,0);u.y=6*s;
      return[{t:0,prop:'cards',hold:'both'},
        {t:240,l:a,r:b,prop:'cards'},{t:420,l:P(a.x+d*.6,a.y+u.y,8),r:P(b.x-d*.6,b.y+u.y,8),prop:'cards'},
        {t:600,l:a,r:b,prop:'cards'},{t:780,l:P(a.x+d*.6,a.y+u.y,8),r:P(b.x-d*.6,b.y+u.y,8),prop:'cards'},
        {t:980,l:P(a.x-d*.4,a.y),r:P(b.x+d*.4,b.y),prop:'cards'},{t:1250,l:a,r:b,prop:'cards'},
        {t:1600,r:RR,l:RL,open:0,prop:''}];
    }
    case 'dealHole':{
      const c=seatCards(+arg);if(!c||!deck)return null;
      return carry(deck,c,'card',hand(c.x),180);
    }
    case 'burn':{
      if(!deck||!burnP)return null;
      return carry(deck,burnP,'card',hand(burnP.x),220);
    }
    case 'dealFlop':case 'dealTurn':case 'dealRiver':{
      if(!deck)return null;
      const from=pre.boardLen;
      const n=key==='dealFlop'?3:1;
      const h=hand(deck.x);
      const seq=[{t:0,prop:'',hold:h},{t:200,hold:h,[h]:P(deck.x,deck.y)}];
      let t=200;
      for(let i=0;i<n;i++){
        const sl=ptOf(`[data-slot="${from+i}"]`);if(!sl)return null;
        seq.push({t:t+140,hold:h,[h]:P(deck.x,deck.y),prop:'card'});
        seq.push({t:t+620,hold:h,[h]:P(sl.x,sl.y),prop:'card'});
        seq.push({t:t+720,hold:h,[h]:P(sl.x,sl.y),prop:''});
        t+=720;
      }
      seq.push({t:t+300,r:RR,l:RL});
      return seq;
    }
    case 'openHands':case 'callPot':case 'callSide':case 'ruling':case 'confirmCall':case 'pickWinner':{
      /* 宣言・コールは、対象（席またはポット）を指しながら行う */
      const sn=+arg;
      const c=(sn>=1&&sn<=SEATS?seatCards(sn):null)||(pre&&pre.seat?seatCards(pre.seat):null)||potP;
      return c?point(c):null;
    }
    case 'gather':{
      if(!potP)return null;
      const bs=(pre.bets||[]).filter(b=>b.pt);
      if(!bs.length)return null;
      const seq=[{t:0,prop:'',hold:'r'}];let t=0;
      bs.forEach(b=>{
        const h=hand(b.pt.x);
        seq.push({t:t+240,hold:h,[h]:P(b.pt.x,b.pt.y),prop:''});
        seq.push({t:t+360,hold:h,[h]:P(b.pt.x,b.pt.y),prop:'chips'});
        seq.push({t:t+640,hold:h,[h]:P(potP.x,potP.y),prop:'chips'});
        seq.push({t:t+740,hold:h,[h]:P(potP.x,potP.y),prop:''});
        t+=540;
      });
      seq.push({t:t+520,r:RR,l:RL});
      return seq;
    }
    case 'chipPay':{
      const k=pre.exKey;
      if(k==='takeRake'){
        if(!potP||!rakeP)return null;
        return carry(potP,rakeP,'chips',hand(rakeP.x),280);
      }
      if(k==='returnUncalled'){
        const b=pre.bets.find(x=>x.seat===pre.seat),to=seatStack(pre.seat);
        if(!b||!b.pt||!to)return null;
        return carry(P(b.pt.x,b.pt.y),to,'chips',hand(to.x),280);
      }
      if(k==='payTo'){
        const to=seatStack(pre.seat);if(!potP||!to)return null;
        return carry(potP,to,'chips',hand(to.x),320);
      }
      return null;
    }
    case 'cleanHands':return Dealer.cleanFrames();
    case 'accident':{
      if(pre.accType==='firstExposed'){
        /* ミスディール：全員のホールカードを集めてデッキへ戻す */
        if(!deck)return null;
        const seq=[{t:0,prop:'',hold:'r'}];let t=0;
        for(let sn=1;sn<=SEATS;sn++){const c=seatCards(sn);if(!c)continue;const h=hand(c.x);
          seq.push({t:t+200,hold:h,[h]:c,prop:''},{t:t+300,hold:h,[h]:c,prop:'cards'});t+=260;}
        seq.push({t:t+420,hold:hand(deck.x),[hand(deck.x)]:deck,prop:'cards'},{t:t+520,prop:''},{t:t+820,r:RR,l:RL});
        return seq;
      }
      return Dealer.floorFrames('r');
    }
    case 'clearCards':{
      /* ボードを両手で寄せてまとめ、マックへ */
      if(!muckP)return null;
      const c=svgPt(slotPt(2))||potP,h=hand(muckP.x);
      return[{t:0,prop:'',hold:'both'},
        {t:260,r:P(c.x+40*s,c.y),l:P(c.x-40*s,c.y),rp:'flat',lp:'flat'},
        {t:560,r:P(c.x+6*s,c.y),l:P(c.x-6*s,c.y),prop:'cards',rp:'',lp:''},
        {t:1240,hold:h,[h]:P(muckP.x,muckP.y),prop:'cards'},
        {t:1380,hold:h,[h]:P(muckP.x,muckP.y),prop:''},
        {t:1700,r:RR,l:RL,open:0,hold:'r'}];
    }
  }
  return null;
}

/* ボタンの文字幅のおおよそ（全角は1em、半角は0.58em） */

function btn(key,label,cls,arg){

function actionKeys(G,ex){
  if(!ex)return[];
  switch(G.phase){
    case 'shuffle':return['shuffleCut'];
    case 'endbet':return uncalledInfo(G)&&!G.flags.retDone?['returnUncalled','gather']:['gather'];
    case 'street':return['burn','dealFlop','dealTurn','dealRiver'];

      if(ex.key==='openHands')return['openHands'];

  }
  return[];
}
const PHASE_NAME={idle:'待機中',button:'ボタンの移動',blinds:'ブラインドの確認',shuffle:'シャッフル＆カット',deal:'ホールカードを配る',

function promptFor(G,ex){

  switch(ex.key){
    case 'moveButton':return['ディーラーボタンを動かす席を選んでください。','前回の席から時計回り（番号が増える向き）に1つ隣。初回は抽選結果の席。'];
    case 'selectSB':return['スモールブラインドの席はどこですか。','ボタンの左隣＝時計回りで1つ先。'];
    case 'selectBB':return['ビッグブラインドの席はどこですか。','SBのさらに左隣。'];
    case 'shuffleCut':return['ブラインドが出そろいました。デッキを準備してください。','シャッフル→ボックス→カット。'];
    case 'dealHole':return[`次にカードを配る席は？（${F.dealt+1}／${G.holeN*SEATS}枚目）`,`SB（${G.sbSeat}番席）から時計回りに1枚ずつ、${G.holeN}周。`];
    case 'nextActor':return[`${streetJa(G.bet.street)}：次にアクションする席を指してください。`,'フォールド・オールイン済みの席は飛ばす。時計回り。'];
    case 'ruling':return['この宣言をどう判定しますか。','最小レイズ先＝現在の最高額＋直前の増分。オールインは例外。'];
    case 'confirmCall':return['コール額はいくらですか。','コール額＝最高額−その席がすでに出した額。'];
    case 'returnUncalled':case 'gather':case 'callPot':
      return[G.flags.gathered||ex.key==='callPot'?'ポット額をコールしてください。':'ベッティングラウンドが終わりました。','コールされなかった分は返す→ベットを集める→ポット額をコール。'];
    case 'callSide':return[`${potName(ex.potIdx)}の額をコールしてください。`,'一番少ないオールイン額までの層がメイン。上の層がサイド。'];
    case 'burn':case 'dealFlop':case 'dealTurn':case 'dealRiver':
      return[`次は${G.board.length===0?'フロップ':G.board.length===3?'ターン':'リバー'}です。正しい所作を選んでください。`,'先にバーン、その後にボード（フロップは3枚同時）。'];
    case 'openHands':return['手札を開かせてください。',G.phase==='runout'?'オールインが完了したら、ボードを出す前に全員が手札を開く。':'最初の席の後、全員が時計回りに開く。'];
    case 'showFirst':return['どの席から手札を見せますか。','最後にベット／レイズした席から。ベットがなければボタンの左から。'];
    case 'pickWinner':return[`${G.pots[ex.potIdx].name}の勝者をコールしてください。`,G.game==='omaha'?'オマハ：ホールから必ず2枚＋ボードから必ず3枚。':'ホールとボードの7枚から最強の5枚。'];
    case 'takeRake':return['レーキを徴収してください。','ポットを払い出す前に、ポット比率で計算。フロップ前に終わったゲームは取らない。'];
    case 'payTo':return['ポットを払い出す席を選んでください。','メイン→サイドの順。チョップは端数の$1をボタンの左から先の席へ。'];
    case 'cleanHands':case 'clearCards':return['締めの所作を選んでください。','クリーンハンド → カードを片付ける。'];
  }
  return['次の所作を選んでください。',''];

    }
  }
  $('console').innerHTML=`<div class="phase">${PHASE_NAME[G.phase]||''}${G.phase==='bet'&&G.bet?`（${streetJa(G.bet.street)}）`:''}</div>${G.phase==='done'&&!G.pending?prompt:`<div class="prompt">${prompt}</div>`}${fb}${extra}${G.pending?actions:(G.phase==='done'?'':actions)}`;
}

function renderLog(){
  const items=G.log.map(e=>`<div class="entry ${e.t}"><span class="el">${esc(e.el)}</span>${e.call?`<span class="call" lang="en">${esc(e.call.en)}</span><span class="callja">${esc(e.call.ja)}</span>`:''}${e.why?`<span class="why">${esc(e.why)}</span>`:''}</div>`).join('');
  $('log').innerHTML=`<h2>進行ログ</h2>${items||'<div class="log-empty">ラウンドを開始すると、操作の結果と発声がここに表示されます。</div>'}`;
}

  const o=G.opts,hasTTS='speechSynthesis' in window,df=currentDifficulty(G),T=G.stakes;
  $('settings').innerHTML=`<h3>設定</h3>
    <div class="row"><label for="optGame">ゲームの種類</label><select id="optGame">${[['holdem','テキサス・ホールデム'],['omaha','オマハ'],['mix','ラウンドごとに切り替える']].map(v=>`<option value="${v[0]}"${o.game===v[0]?' selected':''}>${v[1]}</option>`).join('')}</select></div>
    <div class="row"><label for="optAdaptive">ラウンドごとに難易度を上げる</label><input type="checkbox" id="optAdaptive"${o.adaptiveDifficulty!==false?' checked':''}></div>
    <div class="row"><label for="optChop">引き分け（チョップ）を多めに出す</label><input type="checkbox" id="optChop"${o.chopFocus!==false?' checked':''}></div>
    <div class="row"><label for="optHints">状況ボード（最高額・最小レイズ）を表示</label><input type="checkbox" id="optHints"${o.showHints!==false?' checked':''}></div>
    ${ACC_SET_HTML(o)}
    <div class="row"><label for="optDealer">ディーラーを表示</label><input type="checkbox" id="optDealer"${o.showDealer!==false?' checked':''}></div>
    <div class="row"><label for="optSpeed">所作の再生速度</label><select id="optSpeed">${[[1,'標準'],[0.6,'ゆっくり'],[0.35,'とてもゆっくり']].map(v=>`<option value="${v[0]}"${(o.dealerSpeed||1)===v[0]?' selected':''}>${v[1]}</option>`).join('')}</select></div>
    <div class="row"><label for="optChipCoach">チップを出す画面に「チップのコツ」を表示</label><input type="checkbox" id="optChipCoach"${o.showChipCoach!==false?' checked':''}></div>
    <div class="row"><label for="optSfx">効果音・振動</label><input type="checkbox" id="optSfx"${o.sfx!==false?' checked':''}></div>
    <div class="row"><label for="optSpeech">発声を読み上げる${hasTTS?'':'（このブラウザは非対応）'}</label><input type="checkbox" id="optSpeech"${o.voice?' checked':''}${hasTTS?'':' disabled'}></div>
    <p class="note">ゲームの種類は次のラウンドから反映されます。状況ボードは難易度ADVANCED以降では自動的に消えます（現在：<b>${df.label}</b>）。</p>
    <p class="note">ノーリミット・6人掛け。画面はディーラー目線（手前がディーラー、奥が客席）。席番号はディーラーの左隣（画面左端）が1番で、時計回り（画面では左から右）に2〜6番。ボタン・配り・アクションはすべてこの向きです。</p>

    <h4>現在のテーブル</h4>
    <p class="note"><b>${gameName(G.game)}</b>／ブラインド${fmt$(T.sb)}・${fmt$(T.bb)}<br>${esc(rakeRuleText(T))}</p>

    <div class="payout-guide">
      <div class="phase">ハンドの強さ（強い順）</div>
      <ul>
        <li>ストレートフラッシュ（A-K-Q-J-10のスート揃いがロイヤル）</li><li>フォーカード</li><li>フルハウス</li><li>フラッシュ</li>
        <li>ストレート（A-2-3-4-5は5ハイの最弱ストレート）</li><li>スリーカード</li><li>ツーペア</li><li>ワンペア</li><li>ハイカード</li>
      </ul>
      <p class="note">同じ役ならペアの数字→残りの札（キッカー）の順で比べます。5枚がまったく同じなら引き分けで、ポットを均等に分けます。オマハは「ホールから必ず2枚＋ボードから必ず3枚」。</p>
    </div>
    <div class="payout-guide">
      <div class="phase">金額計算のコツ</div>
      <ul>
        <li><b>コール額</b>：最高額−その席がすでに出した額（ブラインドも出した額に含む）。</li>
        <li><b>最小レイズ先</b>：現在の最高額＋直前の増分。増分が大きければフルレイズで全員に行動権が戻る。フルレイズ未満のオールインは戻さない。</li>
        <li><b>コールされなかった分</b>：最高額−次点の額を、集める前に本人へ返す。</li>
        <li><b>サイドポット</b>：一番少ないオールイン額までを全員から切り取ってメイン。残りをその上の層としてサイドへ。フォールドした分も層の中に含む。</li>
        <li><b>レーキ</b>：5%は10%の半分、10%は桁をひとつ下げる。$1未満は切り捨て、上限を超えたら上限。フロップ前に終わったゲームは取らない。</li>
        <li><b>チョップ</b>：ポット÷人数。余りの$1はボタンの左から時計回りで先の勝者へ1枚ずつ。</li>
      </ul>
    </div>
    <div class="payout-guide">
      <div class="phase">チップ・カウンティングのコツ</div>
      <ul>${CHIP_GUIDE.map(g=>`<li><b>${esc(g[0])}</b>：${esc(g[1])}</li>`).join('')}</ul>
      <p class="note">チップを出す場面（返却・レーキ・払い出し）では、今回の金額に合わせた内訳・換算・出し方を表示します（BASIC／STANDARDは内訳つき、ADVANCED以降は内訳を伏せ、間違えたときだけ表示）。</p>
    </div>
    <p class="note"><button type="button" class="act" data-act="openRules">ルールブック（ハンドの強さ・手順・イレギュラー）を開く</button></p>

}

function render(){
  EXNOW=G.pending?null:expected(G);
  renderMeta();renderTable();renderCaption();renderConsole();renderLog();
}

/* ---- 質問チャット ---- */
const CHAT=[];
function chatPush(who,text,hint){CHAT.push({who,text,hint:!!hint});if(CHAT.length>80)CHAT.shift();}
function renderChat(){
  const box=$('chatBody');if(!box)return;
  box.innerHTML=CHAT.map(m=>`<div class="cm ${m.who}${m.hint?' hint':''}">${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('');
  box.scrollTop=box.scrollHeight;
  $('chatSug').innerHTML=CHAT_SUGGEST.map(s=>`<button type="button" data-act="chatAsk" data-arg="${esc(s)}">${esc(s)}</button>`).join('');
}
function chatSend(text){
  text=String(text||'').trim();if(!text)return;
  chatPush('me',text);
  const r=chatAnswer(G,text);
  chatPush('bot',r.text,r.hint);
  if(r.hint&&G.round&&G.phase!=='done'){G.round.hints=(G.round.hints||0)+1;}
  renderChat();
}
function toggleChat(open){
  const p=$('chat'),show=open===undefined?p.hidden:open;
  p.hidden=!show;$('btnChat').setAttribute('aria-expanded',String(show));
  if(show){
    if(!CHAT.length)chatPush('bot',CHAT_INTRO);
    renderChat();
    if(window.matchMedia('(min-width:601px)').matches)$('chatInput').focus();
  }
}

let signTimer=0;
function scheduleSignClose(){
  clearTimeout(signTimer);
  if(!G.signOpen)return;
  signTimer=setTimeout(()=>{if(G.signOpen){G.signOpen=false;render();}},5200);
}

function doAct(key,arg){
  const prevPending=!!G.pending,prevPhase=G.phase;
  const exNow=G.pending?G.pending.ex:EXNOW;
  const pre={
    exKey:exNow?exNow.key:null,
    seat:exNow&&(exNow.seat||exNow.correct)?(exNow.seat||exNow.correct):null,
    puck:ptOf('#puck'),
    bets:G.players.filter(p=>p.bet>0).map(p=>({seat:p.seat,pt:ptOf(`[data-bet="${p.seat}"]`)})),
    boardLen:G.board.length,
    cur:G.bet&&G.bet.cur?G.bet.cur.seat:null,
    accType:G.flags&&G.flags.acc?G.flags.acc.type:null
  };
  if(G.signOpen&&key!=='start'){G.signOpen=false;clearTimeout(signTimer);}
  const dealtBefore=G.flags.dealt,boardBefore=G.board.length,openedBefore=G.opened;
  const r=act(G,key,arg);
  if(r&&r.ok){
    if(key==='dealHole')G.anim={hole:+arg};
    else if(G.board.length>boardBefore)G.anim={boardFrom:boardBefore};
    else if(G.opened&&!openedBefore)G.anim={open:true};
  }
  if(r){STATS.cats[r.cat][r.ok?'ok':'ng']++;}
  if(G.phase==='done'&&!G._counted){STATS.rounds++;G._counted=true;}
  if(G.phase!=='done')G._counted=false;
  save(STORE_STATS,STATS);render();
  /* 効果音・振動：チップを置く音／正解／ミス／ラウンド終了。結果はコンソールの光り方でも返す */
  if(key==='chip'||key==='chipUndo'||key==='chipClear')SFX.play('chip');
  else if(r){SFX.play(!r.ok?'ng':(G.phase==='done'&&prevPhase!=='done')?'round':key==='chipPay'?'pay':'ok');pulseConsole(r.ok);}
  if(prevPhase==='done'||prevPhase==='idle')scheduleSignClose();
  if(r&&r.ok&&G.opts.showDealer!==false){
    const mk=key==='chipPay'?'chipPay':key;
    const frames=buildMotion(mk,arg,pre);
    if(frames)Dealer.play(frames,MOTION_LABEL[key==='chipPay'?(pre.exKey||key):key]||'');
  }
  if((G.phase==='done'&&prevPhase!=='done')||(G.pending&&!prevPending)){
    const el=G.pending?document.querySelector('.tray'):$('console');
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='toggleSettings'){const p=$('settings');p.hidden=!p.hidden;$('btnSettings').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)renderSettings();return;}
  if(a==='toggleVoice'){
    G.opts.voice=!G.opts.voice;save(STORE_OPTS,G.opts);
    if('speechSynthesis' in window){if(G.opts.voice)speak([G.caption].filter(c=>c.en));else speechSynthesis.cancel();}
    renderCaption();return;
  }
  if(a==='toggleChat'){toggleChat();return;}
  if(a==='chatAsk'){chatSend(el.dataset.arg);return;}
  if(a==='closeSign'){G.signOpen=false;clearTimeout(signTimer);render();return;}
  if(a==='openRules'){$('settings').hidden=true;$('btnSettings').setAttribute('aria-expanded','false');toggleChat(false);openRules('poker');return;}
  if(a==='closeRules'){closeRules();return;}
  if(a==='replay'){Dealer.replay();return;}
  if(a==='resetStats'){STATS=emptyStats();save(STORE_STATS,STATS);render();return;}
  doAct(a,el.dataset.arg);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='optGame')G.opts.game=e.target.value;
  else if(id==='optAdaptive')G.opts.adaptiveDifficulty=e.target.checked;
  else if(id==='optChop')G.opts.chopFocus=e.target.checked;
  else if(id==='optHints')G.opts.showHints=e.target.checked;
  else if(id==='optDealer'){G.opts.showDealer=e.target.checked;Dealer.stop();}
  else if(id==='optSpeed')G.opts.dealerSpeed=+e.target.value;
  else if(id==='optAccidents')G.opts.accidents=e.target.value;
  else if(id==='optChipCoach')G.opts.showChipCoach=e.target.checked;
  else if(id==='optSfx')G.opts.sfx=e.target.checked;
  else if(id==='optSpeech'){G.opts.voice=e.target.checked;if(!G.opts.voice&&'speechSynthesis' in window)speechSynthesis.cancel();}
  else return;
  save(STORE_OPTS,G.opts);render();
});
$('chatForm').addEventListener('submit',e=>{
  e.preventDefault();
  const i=$('chatInput');chatSend(i.value);i.value='';
  if(window.matchMedia('(min-width:601px)').matches)i.focus();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('chat').hidden)toggleChat(false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rulesOpen())closeRules();});
render();

</script>
