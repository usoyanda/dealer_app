/* ===== 金額計算のコツ ===== */
function rakeOf(T,pot){return Math.min(T.cap,Math.floor(pot*T.rate+1e-9));}
function rakeTip(T,pot){
  const raw=pot*T.rate,fl=Math.floor(raw+1e-9);
  let s=T.rate===0.05
    ?`5%は「10%の半分」。${fmt$(pot)}の10%は${fmt$(pot/10)}、その半分で${fmt$(raw)}`
    :`10%は桁をひとつ下げるだけ。${fmt$(pot)}→${fmt$(pot/10)}`;
  s+=`。$1未満は切り捨てて${fmt$(fl)}`;
  s+=fl>T.cap?`。上限${fmt$(T.cap)}を超えるので、レーキは上限の${fmt$(T.cap)}。`:`（上限${fmt$(T.cap)}以内）。`;
  return s;
}
function sumTip(list,label){
  const nz=list.filter(x=>x>0);
  return `${label}${nz.map(fmt$).join('＋')}＝${fmt$(nz.reduce((a,b)=>a+b,0))}。`;
}
function oddTip(net,n){
  const q=Math.floor(net/n),r=net-q*n;
  return `${fmt$(net)}÷${n}人＝${fmt$(q)}、余り${fmt$(r)}。余りの$1チップは、ボタンの左から時計回りで先に来る勝者から1枚ずつ配る。`;
}
function minRaiseTip(cur,inc){
  return `最小レイズ先＝現在のベット${fmt$(cur)}＋直前の増分${fmt$(inc)}＝${fmt$(cur+inc)}。`;
}

/* ===== 数字の選択肢 ===== */
function numOptions(correct,cands,need){
  const out=[correct];
  cands.forEach(v=>{if(v>0&&Number.isFinite(v)&&!out.includes(v))out.push(v);});
  let g=0;
  while(out.length<need&&g++<40){const v=correct+rint(-6,6)*5;if(v>0&&!out.includes(v))out.push(v);}
  return{right:fmt$(correct),opts:shuffleOpts(out.slice(0,need).map(fmt$))};
}

/* ===== 状態 ===== */
function nxt(s){return s%SEATS+1;}
function pl(G,s){return G.players[s-1];}
function alive(G){return G.players.filter(p=>!p.folded);}
function actives(G){return G.players.filter(p=>!p.folded&&!p.allin);}
function cwFrom(start,s){return((s-start-1+SEATS)%SEATS);}   /* startの次の席を0とした時計回りの序数 */

function createGame(opts){
  const o=Object.assign({game:'holdem',showHints:true,showZoneHints:true,showDealer:true,voice:true,dealerSpeed:1,
    adaptiveDifficulty:true,chopFocus:true},opts||{});
  if(!['holdem','omaha','mix'].includes(o.game))o.game='holdem';
  return{opts:o,roundNo:0,phase:'idle',players:[],button:null,game:'holdem',prevGame:null,signOpen:false,
    stakes:{sb:5,bb:10,rate:.05,cap:10},holeN:2,plan:null,deckUsed:0,muck:0,burned:0,
    board:[],pot:0,pots:null,rake:0,rakeBox:0,winners:{},payList:null,payIdx:0,opened:false,
    bet:null,sticky:[],sbSeat:0,bbSeat:0,buttonTarget:1,
    flags:{},pending:null,round:null,log:[],lastFb:null,
    caption:C('','ラウンドを開始すると、ディーラーの発声がここに表示されます'),capQueue:[]};
}
function setCaption(G,cap){if(cap&&cap.en){G.caption=cap;G.capQueue.push(cap);if(G.capQueue.length>20)G.capQueue.shift();}}
function addLog(G,e){G.log.unshift(Object.assign({round:G.roundNo},e));if(G.log.length>120)G.log.length=120;}

function roundTo(x,u){return Math.max(u,Math.round(x/u)*u);}

/* ===== ラウンド開始 ===== */
function startRound(G){
  G.roundNo++;
  const df=currentDifficulty(G),o=G.opts;
  G.prevGame=G.roundNo===1?null:G.game;
  G.game=o.game==='mix'?rnd(['holdem','omaha']):o.game;
  G.holeN=G.game==='omaha'?4:2;
  G.signOpen=(G.roundNo===1||G.prevGame!==G.game);
  const bl=rnd(df.blinds);
  G.stakes={sb:bl[0],bb:bl[1],rate:rnd(df.rates),cap:0};
  G.stakes.cap=rnd(df.caps);
  const T=G.stakes;

  /* ボタン：初回は高いカードを引いた席（ここでは抽選）、以降は必ず1つ時計回り */
  G.buttonTarget=G.button==null?rint(1,SEATS):nxt(G.button);

  /* 席と持ち点。ショートスタックを混ぜて、オールインとサイドポットの場面を作る */
  const nShort=rint(df.shorts[0],df.shorts[1]);
  const seats=shuffle([1,2,3,4,5,6]);
  const shortSeats=seats.slice(0,nShort);
  G.players=[];
  for(let s=1;s<=SEATS;s++){
    const short=shortSeats.includes(s);
    let stack;
    if(short)stack=roundTo(T.bb*rint(3,9)+rint(0,df.shortUnit===1?T.bb-1:0),df.shortUnit);
    else stack=roundTo(T.bb*rint(df.stackBB[0],df.stackBB[1]),df.stackUnit);
    G.players.push({seat:s,stack,start:stack,bet:0,committed:0,folded:false,allin:false,acted:false,short,cards:[]});
  }
  G.board=[];G.pot=0;G.pots=null;G.rake=0;G.winners={};G.payList=null;G.payIdx=0;
  G.opened=false;G.deckUsed=0;G.muck=0;G.burned=0;G.bet=null;G.pending=null;
  G.sbSeat=0;G.bbSeat=0;
  planCards(G,df);
  G.flags={moved:false,sb:false,bb:false,shuffled:false,dealt:0,flopSeen:false,burned:false,
    retDone:false,gathered:false,calledPot:false,sideIdx:0,showFirstDone:false,rakeDone:false,cleaned:false,cleared:false};
  G.phase='button';
  G.round={no:G.roundNo,ok:0,err:0,errors:[],notes:[],hints:0};
  G.round.accPlan=accPlan(G,ACC_TYPES);G.earlyFlop=null;
  if(G.signOpen)addLog(G,{t:'rule',el:`ゲーム：${gameName(G.game)}／${fmt$(T.sb)}・${fmt$(T.bb)}／${rakeRuleText(T)}`,
    why:G.game==='omaha'?'オマハはホールカード4枚。勝負の手は「ホールから必ず2枚＋ボードから必ず3枚」で作ります。':'テキサス・ホールデムはホールカード2枚。ホールとボードを合わせた7枚から最強の5枚で勝負します。'});
  const cap=C(`New hand. ${G.game==='omaha'?'Omaha':"Hold'em"}, ${T.sb} ${T.bb}.`,`新しいゲーム。${gameName(G.game)}、ブラインド${fmt$(T.sb)}／${fmt$(T.bb)}`);
  setCaption(G,cap);
  addLog(G,{t:'info',el:`ラウンド${G.roundNo}開始（${gameName(G.game)}）`,call:cap});
}
function gameName(g){return g==='omaha'?'オマハ':'テキサス・ホールデム';}
function rakeRuleText(T){return `レーキ${Math.round(T.rate*100)}%（上限${fmt$(T.cap)}・$1未満切り捨て・フロップ前は徴収しない）`;}

/* 配るカードを最初から決めておく（実際のデッキから順に出るのと同じこと）。
   引き分けの練習をするため、確率でわざと「同じ数字・違うスート」の2人を作る。 */
function planCards(G,df){
  const n=G.holeN;
  G.sticky=[];
  let deck=newDeck(),fixed=null,board=null;
  const take=(d,c)=>{const i=d.findIndex(x=>sameCard(x,c));if(i>=0)d.splice(i,1);};
  if(G.opts.chopFocus!==false&&Math.random()<df.chop){
    const seats=shuffle([1,2,3,4,5,6]).slice(0,2);
    const ranks=shuffle([14,13,12,11,10,9,8,7,6,5,4,3,2]).slice(0,n);
    const a=ranks.map((v,i)=>mkCard(v,i%4)),b=ranks.map((v,i)=>mkCard(v,(i+1)%4));
    const rest=deck.filter(c=>![...a,...b].some(x=>sameCard(x,c)));
    for(let t=0;t<300&&!board;t++){
      shuffle(rest);
      const bd=rest.slice(0,5);
      const ea=bestHand(G.game,a,bd),eb=bestHand(G.game,b,bd);
      if(cmpScore(ea.score,eb.score)===0)board=bd;
    }
    if(board){fixed={};fixed[seats[0]]=a;fixed[seats[1]]=b;G.sticky=seats;
      deck=deck.filter(c=>![...a,...b,...board].some(x=>sameCard(x,c)));}
  }
  const hole={};
  for(let s=1;s<=SEATS;s++){
    if(fixed&&fixed[s])hole[s]=fixed[s].slice();
    else{hole[s]=[];for(let i=0;i<n;i++)hole[s].push(deck.pop());}
  }
  const burns=[deck.pop(),deck.pop(),deck.pop()];
  G.plan={hole,burns,board:board?board.slice():[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()]};
  G.plan.rest=deck;   /* 残りのデッキ（アクシデントで札を交換するときに使う） */
}

/* ===== ブラインド投入 ===== */
function postBlind(G,seat,amt){
  const p=pl(G,seat),a=Math.min(amt,p.stack);
  p.stack-=a;p.bet+=a;p.committed+=a;
  if(p.stack===0)p.allin=true;
}
function postBlinds(G){
  const T=G.stakes;
  postBlind(G,G.sbSeat,T.sb);postBlind(G,G.bbSeat,T.bb);
  addLog(G,{t:'info',el:`ブラインド：${G.sbSeat}番席SB ${fmt$(T.sb)}、${G.bbSeat}番席BB ${fmt$(T.bb)}`});
}

/* ===== ベッティングラウンド ===== */
function initBet(G,street){
  const T=G.stakes;
  G.players.forEach(p=>{p.acted=false;});
  G.bet={street,current:street==='pre'?T.bb:0,minInc:T.bb,raises:0,count:0,
    lastActor:street==='pre'?G.bbSeat:G.button,cur:null,lastAgg:null,prevRaise:false};
}
/* 行動権のある次の席。フォールド済み・オールイン済みは飛ばす */
function nextActorInfo(G){
  const B=G.bet;let s=B.lastActor;const skipped=[];
  for(let i=0;i<SEATS;i++){
    s=nxt(s);const p=pl(G,s);
    if(p.folded){skipped.push({seat:s,why:'フォールド済み'});continue;}
    if(p.allin){skipped.push({seat:s,why:'オールイン済み'});continue;}
    if(p.bet<B.current||!p.acted)return{seat:s,skipped};
    skipped.push({seat:s,why:'行動済みでベット額も揃っている'});
  }
  return null;
}
function evText(G,p,ev){
  const B=G.bet;
  if(ev.type==='fold')return 'フォールド';
  if(ev.type==='check')return 'チェック';
  if(ev.type==='call')return ev.allin?`コール（オールイン ${fmt$(p.stack)}）`:`コール`;
  const verb=B.current===0?'ベット':'レイズ';
  return ev.allin?`オールイン ${fmt$(ev.to)}`:`${verb} ${fmt$(ev.to)}`;
}
/* 客役の行動。フォールド・チェック・コールは自動で進み、レイズ系だけディーラーが判定する */
function aiDecide(G,p){
  const B=G.bet,df=currentDifficulty(G),T=G.stakes;
  const toCall=Math.max(0,B.current-p.bet),maxTo=p.bet+p.stack;
  const sticky=G.sticky.includes(p.seat);
  const canRaise=!p.acted&&p.stack>toCall&&B.raises<df.maxRaises;
  const minTo=B.current+B.minInc;
  const r=Math.random();
  const mkRaise=forceAll=>{
    let to;
    if(forceAll||Math.random()<df.allin)to=maxTo;
    else{const k=rnd([0,0,1,1,2,3,4]);to=minTo+k*df.step;}
    if(to>=maxTo)return{type:'raise',to:maxTo,allin:true};
    if(Math.random()<df.illegal){
      const at=B.current+Math.max(df.step,B.minInc-df.step);
      if(at>B.current&&at<minTo)return{type:'raise',to:at,illegal:true};
    }
    return{type:'raise',to};
  };
  if(toCall>=p.stack)return(sticky||r<.75)?{type:'call',allin:true}:{type:'fold'};
  if(p.short&&canRaise&&!sticky&&Math.random()<.7)return mkRaise(true);
  if(toCall===0){
    if(canRaise&&!sticky&&r<.4)return mkRaise(false);
    return{type:'check'};
  }
  if(!sticky&&r<df.foldP)return{type:'fold'};
  if(canRaise&&!sticky&&r<df.foldP+.22)return mkRaise(false);
  return{type:'call'};
}
function askNext(G,info){
  const df=currentDifficulty(G),B=G.bet;
  if(df.askNext==='all')return true;
  if(B.count===0)return true;
  if(df.askNext==='raise')return B.prevRaise||info.skipped.some(x=>x.why!=='行動済みでベット額も揃っている');
  return false;
}

/* 宣言の判定（有効なレイズ／フルレイズ未満のオールイン／最小額に満たない不正な宣言） */
function rulingSet(G,p,ev){
  const B=G.bet,cur=B.current,minTo=cur+B.minInc,df=currentDifficulty(G);
  const verb=cur===0?'ベット':'レイズ',need=df.opts;
  const nextMin=x=>x+(x-cur);
  let right,kind,cands=[];
  if(ev.illegal){
    kind='illegal';
    right=`無効：最低${fmt$(minTo)}までのレイズが必要`;
    cands=[`有効：次の最小レイズ先は${fmt$(nextMin(ev.to))}`,`無効：最低${fmt$(cur+B.minInc*2)}までのレイズが必要`,
      `有効（オールイン扱い）：アクションは再開しない`,`無効：最低${fmt$(ev.to+B.minInc)}までのレイズが必要`];
  }else if(ev.to<minTo){
    kind='short';
    right=`有効（オールイン）：フルレイズ未満なのでアクション再開なし。最小レイズ先は${fmt$(ev.to+B.minInc)}のまま`;
    cands=[`有効（オールイン）：フルレイズ扱いでアクション再開。最小レイズ先は${fmt$(nextMin(ev.to))}`,
      `無効：最低${fmt$(minTo)}までのレイズが必要`,
      `有効（オールイン）：フルレイズ未満なのでアクション再開なし。最小レイズ先は${fmt$(minTo)}のまま`,
      `有効（オールイン）：フルレイズ扱いでアクション再開。最小レイズ先は${fmt$(ev.to+B.minInc)}`];
  }else{
    kind='full';
    right=`有効：次の最小レイズ先は${fmt$(nextMin(ev.to))}`;
    cands=[`有効：次の最小レイズ先は${fmt$(ev.to+B.minInc)}`,`有効：次の最小レイズ先は${fmt$(ev.to*2)}`,
      `無効：最低${fmt$(minTo)}までのレイズが必要`,`有効：次の最小レイズ先は${fmt$(nextMin(ev.to)+df.step)}`,
      `有効：次の最小レイズ先は${fmt$(nextMin(ev.to)-df.step)}`];
    if(ev.allin)right=right.replace('有効：','有効（オールイン）：');
    if(ev.allin)cands=cands.map(c=>c.replace('有効：','有効（オールイン）：'));
  }
  const opts=[right];
  cands.forEach(c=>{if(c!==right&&!opts.includes(c))opts.push(c);});
  return{right,kind,opts:shuffleOpts(opts.slice(0,need)),verb,minTo,nextMin:nextMin(ev.to)};
}
function rulingWhy(G,p,ev,rs){
  const B=G.bet,cur=B.current;
  const base=`現在のベットは${fmt$(cur)}、直前のレイズ幅（増分）は${fmt$(B.minInc)}。最小のレイズ先は${fmt$(cur)}＋${fmt$(B.minInc)}＝${fmt$(rs.minTo)}です。`;
  if(rs.kind==='illegal')
    return `${p.seat}番席は${fmt$(ev.to)}への${rs.verb}を宣言しましたが、増分が${fmt$(ev.to-cur)}しかなく、直前の増分${fmt$(B.minInc)}に届きません。${base}`
      +`オールインでない限り、最小額に満たないレイズは認められません。「ミニマムは${fmt$(rs.minTo)}です」と告げて、上げ直してもらいます（口頭のあいまいな宣言でも、最小額に満たなければ同じ扱い）。`;
  if(rs.kind==='short')
    return `${p.seat}番席の${fmt$(ev.to)}はオールインで、必要なフルレイズ（${fmt$(rs.minTo)}）に届いていません。${base}`
      +`持ち点が足りない場合のオールインは有効ですが、フルレイズ未満なのでアクションは再開しません。すでに行動を終えた席はコールかフォールドだけで、再レイズはできません。次にレイズする最小額は、新しい最高額${fmt$(ev.to)}にこれまでの増分${fmt$(B.minInc)}を足した${fmt$(ev.to+B.minInc)}です。`;
  const inc=ev.to-cur;
  return `${p.seat}番席の${fmt$(ev.to)}への${rs.verb}は有効です（${base}${fmt$(ev.to)}はそれ以上）。`
    +`この増分は${fmt$(ev.to)}−${fmt$(cur)}＝${fmt$(inc)}で、これが新しい「直前の増分」になります。次の最小レイズ先は${fmt$(ev.to)}＋${fmt$(inc)}＝${fmt$(ev.to+inc)}。`
    +`増分が前回より大きければフルレイズなので、全員に再びアクションの権利が戻ります。`;
}
function callAmount(G,p){return Math.min(G.bet.current-p.bet,p.stack);}
function callSet(G,p){
  const B=G.bet,df=currentDifficulty(G),amt=callAmount(G,p);
  return numOptions(amt,[B.current,B.current-p.bet+G.stakes.bb,Math.max(0,B.current-p.bet-G.stakes.sb),B.current+p.bet,p.bet],df.opts);
}
function callWhy(G,p,ev){
  const B=G.bet,amt=callAmount(G,p);
  if(ev.allin)return `${p.seat}番席の持ち点は${fmt$(p.stack)}で、コールに必要な${fmt$(B.current-p.bet)}に足りません。持ち点全部を出すコール（オールイン）になり、出す額は${fmt$(p.stack)}です。超過分の勝負権はなく、勝てるのも自分が出した額の範囲までです。`;
  return `コール額は「最高額−すでに出した額」です。今の最高額は${fmt$(B.current)}、${p.seat}番席はすでに${fmt$(p.bet)}出している${p.bet?'（ブラインドも含む）':''}ので、追加は${fmt$(B.current)}−${fmt$(p.bet)}＝${fmt$(amt)}。最高額そのものを出させると二重に取ってしまいます。`;
}

function applyEvent(G,p,ev){
  const B=G.bet;
  B.count++;
  if(ev.type==='fold'){p.folded=true;p.acted=true;B.prevRaise=false;G.muck+=p.cards.length;return;}
  if(ev.type==='check'){p.acted=true;B.prevRaise=false;return;}
  if(ev.type==='call'){
    const a=callAmount(G,p);
    p.stack-=a;p.bet+=a;p.committed+=a;p.acted=true;B.prevRaise=false;
    if(p.stack===0)p.allin=true;
    return;
  }
  /* レイズ／ベット：フルレイズなら全員の行動権が戻る。フルレイズ未満のオールインは戻さない */
  const to=ev.to,a=to-p.bet,inc=to-B.current;
  p.stack-=a;p.bet=to;p.committed+=a;p.acted=true;
  if(p.stack===0)p.allin=true;
  if(inc>=B.minInc){
    B.minInc=inc;
    G.players.forEach(q=>{if(q!==p)q.acted=false;});
  }
  B.current=to;B.raises++;B.lastAgg=p.seat;B.prevRaise=true;
}
function evLog(G,p,ev){return `${p.seat}番席：${evText(G,p,ev)}`;}

function betStep(G){
  const B=G.bet,df=currentDifficulty(G);
  if(alive(G).length===1){endBetting(G);return expected(G);}
  if(!B.cur){
    const info=nextActorInfo(G);
    if(!info){endBetting(G);return expected(G);}
    const p=pl(G,info.seat);
    B.cur={seat:info.seat,info,ev:aiDecide(G,p),stage:'next',ask:false};
    B.cur.ask=askNext(G,info);
  }
  const c=B.cur,p=pl(G,c.seat);
  if(c.stage==='next'){
    if(c.ask){
      const info=c.info,last=B.lastActor;
      let why;
      if(B.count===0&&B.street==='pre')why=`プリフロップの最初のアクションはビッグブラインドの左隣（UTG）です。BBは${G.bbSeat}番席なので、${c.seat}番席から。ブラインドの2人は「すでに賭けている」だけで、最後にもう一度アクションが回ってきます（BBのオプション）。`;
      else if(B.count===0)why=`フロップ以降の最初のアクションは、ボタンの左隣（SB）から時計回りで、まだ勝負に残っている最初の席です。ボタンは${G.button}番席。`
        +(info.skipped.length?`${info.skipped.map(x=>x.seat+'番席').join('・')}は${info.skipped[0].why}なので飛ばして`:'')+`${c.seat}番席の番です。`;
      else why=`直前にアクションしたのは${last}番席。そこから時計回りで、次に行動権があるのは${c.seat}番席です。`
        +(info.skipped.length?`${info.skipped.map(x=>x.seat+'番席（'+x.why+'）').join('、')}は飛ばします。`:'')
        +'フォールド済み・オールイン済みの席は行動しません。順番を飛ばしたり戻したりすると、先に見た人の情報で有利になる人が出るため、必ず指差しで席を確認してから促します。';
      return E('nextActor','order',why,C(`Action on seat ${c.seat}.`,`${c.seat}番席、アクションです`),{correct:c.seat});
    }
    c.stage='declare';
  }
  const ev=c.ev;
  if(ev.type==='fold'||ev.type==='check'){
    B.lastActor=c.seat;
    addLog(G,{t:'info',el:evLog(G,p,ev)});
    applyEvent(G,p,ev);B.cur=null;
    return expected(G);
  }
  const talk=`${p.seat}番席が「${evText(G,p,ev)}」と宣言しました。`;
  if(ev.type==='call'){
    const cs=callSet(G,p);
    return E('confirmCall','pot',callWhy(G,p,ev),C(`Call, ${fmt$(callAmount(G,p))}.`,`${p.seat}番席、${fmt$(callAmount(G,p))}のコール`),{callSet:cs,talk,seat:c.seat});
  }
  const rs=rulingSet(G,p,ev);
  return E('ruling','ruling',rulingWhy(G,p,ev,rs),
    C(ev.illegal?`The minimum is ${G.bet.current+G.bet.minInc}.`:(ev.allin?`Seat ${p.seat} all in, ${ev.to}.`:`${rs.verb==='ベット'?'Bet':'Raise to'} ${ev.to}.`),
      ev.illegal?`ミニマムは${fmt$(G.bet.current+G.bet.minInc)}です`:`${p.seat}番席、${fmt$(ev.to)}${ev.allin?'でオールイン':'への'+rs.verb}`),
    {callSet:rs,talk,seat:c.seat,ev});
}

/* ===== ベッティング終了後：返却・集金・ポット額 ===== */
function endBetting(G){
  G.phase='endbet';
  const F=G.flags;F.retDone=false;F.gathered=false;F.calledPot=false;
}
function uncalledInfo(G){
  const bs=G.players.map(p=>({s:p.seat,b:p.bet})).sort((a,b)=>b.b-a.b);
  if(bs[0].b>0&&bs[0].b>bs[1].b)return{seat:bs[0].s,amount:bs[0].b-bs[1].b,second:bs[1].b};
  return null;
}
function betsTotal(G){return G.players.reduce((a,p)=>a+p.bet,0);}
function potSet(G){
  const df=currentDifficulty(G),T=G.stakes;
  const last=Math.max(...G.players.map(p=>p.bet).concat([0]));
  return numOptions(G.pot,[G.pot-T.bb,G.pot+T.bb,G.pot-T.sb,G.pot+last,G.pot-last],df.opts);
}
function potWhy(G,gathered){
  const T=G.stakes;
  return `ポット額は、これまでに集めた分＋いま集めたベットの合計です（フォールドした人のチップも含みます）。`
    +(gathered&&gathered.parts.length?`今回集めたのは ${gathered.parts.map(x=>`${x.seat}番席${fmt$(x.bet)}`).join('、')}（計${fmt$(gathered.sum)}）。前ストリートまでのポットが${fmt$(gathered.before)}なので、${fmt$(gathered.before)}＋${fmt$(gathered.sum)}＝${fmt$(G.pot)}。`:`ポット合計は${fmt$(G.pot)}。`)
    +`ブラインド${fmt$(T.sb)}・${fmt$(T.bb)}も忘れずに含めます。コールを求められたらポット額をはっきり告げるのがディーラーの役目です。`;
}

/* ===== サイドポット ===== */
function buildPots(G){
  const ps=G.players;
  const levels=[...new Set(ps.filter(p=>!p.folded&&p.committed>0).map(p=>p.committed))].sort((a,b)=>a-b);
  let prev=0;const pots=[];
  levels.forEach(lv=>{
    const parts=ps.map(p=>({seat:p.seat,c:Math.max(0,Math.min(p.committed,lv)-Math.min(p.committed,prev))})).filter(x=>x.c>0);
    const amount=parts.reduce((a,b)=>a+b.c,0);
    const eligible=ps.filter(p=>!p.folded&&p.committed>=lv).map(p=>p.seat);
    pots.push({amount,eligible,level:lv,prev,parts});prev=lv;
  });
  /* 最上段の資格者が1人だけの段は、隣の段へまとめる（同じ人にしか払えないため） */
  while(pots.length>1&&pots[pots.length-1].eligible.length===1&&pots[pots.length-2].eligible.length===1&&pots[pots.length-2].eligible[0]===pots[pots.length-1].eligible[0]){
    const t=pots.pop();pots[pots.length-1].amount+=t.amount;pots[pots.length-1].parts=pots[pots.length-1].parts.concat(t.parts);
  }
  pots.forEach((p,i)=>{p.name=i===0?'メインポット':`サイドポット${i}`;p.orig=p.amount;});
  return pots;
}
function potName(i){return i===0?'メインポット':`サイドポット${i}`;}
function sidePotWhy(G,i){
  const P=G.pots[i];
  const head=i===0
    ?`メインポットは、全員が出した額のうち「一番少ないオールイン額」までを全員から切り取った層です。`
    :`${potName(i)}は、その上の層（${fmt$(P.prev)}超〜${fmt$(P.level)}まで）を、まだ出している人だけから切り取ったものです。`;
  return head+`内訳は${P.parts.map(x=>`${x.seat}番席${fmt$(x.c)}`).join('＋')}＝${fmt$(P.orig)}。資格があるのは${P.eligible.map(x=>x+'番席').join('・')}で、オールインした人は自分の層より上のポットには参加できません。`
    +'フォールドした人のチップもその層の中に含まれます（デッドマネー）。';
}
function sideSet(G,i){
  const df=currentDifficulty(G),P=G.pots[i];
  const other=G.pots.filter((_,j)=>j!==i).map(x=>x.orig);
  return numOptions(P.orig,[G.pot,P.orig+G.stakes.bb,P.orig-G.stakes.bb].concat(other.map(o=>P.orig+o)),df.opts);
}

/* ===== ショーダウン ===== */
function bestOf(G,seat){const p=pl(G,seat);return bestHand(G.game,p.cards,G.board);}
function potWinners(G,i){
  const P=G.pots[i];
  let best=null,ws=[];
  P.eligible.forEach(s=>{
    const h=bestOf(G,s);
    if(!best||cmpScore(h.score,best.score)>0){best=h;ws=[s];}
    else if(cmpScore(h.score,best.score)===0)ws.push(s);
  });
  return ws;
}
function seatSetText(ws){return ws.length===1?`${ws[0]}番席の勝ち`:`チョップ：${ws.join('・')}番席`;}
function winnerSet(G,i){
  const P=G.pots[i],ws=potWinners(G,i).slice().sort((a,b)=>a-b);
  const right=seatSetText(ws),opts=[right];
  const push=v=>{if(!opts.includes(v))opts.push(v);};
  P.eligible.forEach(s=>push(seatSetText([s])));
  if(P.eligible.length>=2){
    const two=P.eligible.slice(0,2);push(seatSetText(two));
    if(ws.length>1)push(seatSetText(ws.slice(0,1)));
  }
  return{right,ws,opts:shuffleOpts(opts.slice(0,currentDifficulty(G).opts))};
}
function winnerWhy(G,i){
  const P=G.pots[i],ws=potWinners(G,i);
  const rows=P.eligible.map(s=>{const h=bestOf(G,s);return{s,h};}).sort((a,b)=>cmpScore(b.h.score,a.h.score));
  const lines=rows.map(r=>`${r.s}番席＝${handName(r.h.score)}［${cardsText(r.h.cards)}］`).join('／');
  let reason='';
  if(rows.length>=2){
    const second=rows.find(r=>cmpScore(r.h.score,rows[0].h.score)!==0);
    reason=ws.length>1?whyBeats(rows[0].h.score,rows[1].h.score):(second?whyBeats(rows[0].h.score,second.h.score):'');
  }
  const omaha=G.game==='omaha'?'オマハなので、ホールカードから必ず2枚・ボードから必ず3枚を使った最強の5枚で比べています（ボードだけで作った役や、ホール3枚以上の役は認められません）。':'';
  return `${potName(i)}${G.pots.length>1?`（${fmt$(P.amount)}）`:''}の資格者：${P.eligible.map(x=>x+'番席').join('・')}。${lines}。${reason}${ws.length>1?'同着なのでポットを均等に分けます（チョップ）。':''}${omaha}`;
}
function firstToShow(G){
  const B=G.bet;
  if(B&&B.lastAgg&&!pl(G,B.lastAgg).folded)return{seat:B.lastAgg,agg:true};
  for(let i=1;i<=SEATS;i++){const s=((G.button+i-1)%SEATS)+1;if(!pl(G,s).folded)return{seat:s,agg:false};}
  return null;
}

/* ===== 精算の準備（レーキ・払い出し順） ===== */
function setupPayout(G){
  const F=G.flags,T=G.stakes;
  G.rake=F.flopSeen?rakeOf(T,G.pot):0;
  if(G.rake>0){let r=G.rake;G.pots.forEach(P=>{const d=Math.min(P.amount,r);P.net=P.amount-d;r-=d;});}
  else G.pots.forEach(P=>{P.net=P.amount;});
}
function buildPayList(G){
  const list=[];
  G.pots.forEach((P,i)=>{
    const ws=G.winners[i].slice().sort((a,b)=>cwFrom(G.button,a)-cwFrom(G.button,b));
    const q=Math.floor(P.net/ws.length),r=P.net-q*ws.length;
    ws.forEach((s,k)=>{list.push({potIdx:i,seat:s,amount:q+(k<r?1:0),share:q,extra:k<r?1:0,n:ws.length,net:P.net});});
  });
  return list;
}

function E(key,cat,why,call,extra){return Object.assign({key,cat,why,call:call||C('','')},extra||{});}

function afterBet(G){
  const F=G.flags,al=alive(G);
  if(al.length===1){
    G.phase='award';
    const w=al[0];
    G.pots=[{amount:G.pot,orig:G.pot,eligible:[w.seat],name:'ポット',parts:[]}];
    G.winners={0:[w.seat]};
    setupPayout(G);
    return;
  }
  const allinLive=al.some(p=>p.allin);
  const street=G.bet.street;
  if(allinLive&&!G.opened){G.phase='runout';return;}
  if(street==='river'){G.phase='showdown';startShowdown(G);return;}
  toStreet(G);
}
/* 次のボードを出す場面へ。早出しのフロップを戻したときは、フロップ前のバーンは済んでいる */
function toStreet(G){
  const F=G.flags;G.phase='street';F.burned=false;
  if(F.preBurned&&G.board.length===0){F.burned=true;F.preBurned=false;addLog(G,{t:'info',el:'フロップ前のバーンは済んでいます（早出しのときに焼いた札を卓に残している）。バーンせずにフロップを出します'});}
}
function startShowdown(G){
  G.pots=buildPots(G);G.flags.sideIdx=0;G.flags.showFirstDone=G.opened;
  setupPayout(G);
}
function nextStreetKey(G){return G.board.length===0?'dealFlop':G.board.length===3?'dealTurn':'dealRiver';}

function expected(G){
  const F=G.flags,T=G.stakes,df=currentDifficulty(G);
  if(G.phase!=='idle'&&G.phase!=='done'&&F.acc)return accExpected(G);
  switch(G.phase){
    case 'idle':case 'done':return{key:'start',unscored:true};

    case 'button':{
      if(!F.moved){
        const first=G.button==null;
        const why=first
          ?`最初のゲームでは、各席に1枚ずつ配って最も高いカードを引いた席にボタンを置きます（今回の抽選結果は${G.buttonTarget}番席）。ボタンは「今回の最後に配られる席＝ディーラー役」の目印で、以降は毎ゲーム1つずつ時計回りに動かします。`
          :`ボタンは毎ゲーム、時計回りに1つ隣の席へ動かします。前回は${G.button}番席だったので、今回は${G.buttonTarget}番席です。ボタンが動くことで、SB・BB・アクション順という不利な位置が全員に公平に回ります。動かし忘れるとブラインドを払う人が狂い、後から必ず揉めます。`;
        return E('moveButton','button',why,C(`Button to seat ${G.buttonTarget}.`,`ボタンは${G.buttonTarget}番席へ`),{correct:G.buttonTarget});
      }
      G.phase='blinds';return expected(G);
    }

    case 'blinds':{
      const sb=nxt(G.button),bb=nxt(sb);
      if(!F.sb)return E('selectSB','button',
        `スモールブラインド（SB）はボタンの左隣、つまり時計回りで1つ先の席です。ボタンは${G.button}番席なので、SBは${sb}番席（${fmt$(T.sb)}）。SBは最初に配られる席でもあり、フロップ以降は最初にアクションする席になります。`,
        C(`Small blind, seat ${sb}.`,`スモールブラインドは${sb}番席`),{correct:sb});
      if(!F.bb)return E('selectBB','button',
        `ビッグブラインド（BB）はSBのさらに左隣です。SBが${sb}番席なので、BBは${bb}番席（${fmt$(T.bb)}）。BBが最初のベット額を決めるため、プリフロップのコール額・最小レイズの基準になります。`,
        C(`Big blind, seat ${bb}.`,`ビッグブラインドは${bb}番席`),{correct:bb});
      G.sbSeat=sb;G.bbSeat=bb;postBlinds(G);G.phase='shuffle';return expected(G);
    }

    case 'shuffle':
      if(!F.shuffled)return E('shuffleCut','security',
        `ブラインドが出そろったらデッキをシャッフルします（リフルを2回以上→ボックス→リフル→カット）。ホールデムは52枚全部を使うため、毎回きちんと混ぜます。`
        +`カットカードで最後の1枚を確実に隠し、配る前にデッキが固定されないようにするのが目的で、テーブルの真上から見えるようカメラの前で行います。`,
        C('Shuffle and cut.','シャッフルしてカットします'));
      G.phase='deal';return expected(G);

    case 'deal':{
      const total=G.holeN*SEATS;
      if(F.dealt<total){
        const seat=((G.sbSeat-1+F.dealt)%SEATS)+1,lap=Math.floor(F.dealt/SEATS)+1;
        const why=`ホールカードは、SB（${G.sbSeat}番席）から時計回りに1枚ずつ、全員に行き渡るまで配ります。これを${G.holeN}周（${G.game==='omaha'?'オマハは4枚':'ホールデムは2枚'}）繰り返します。`
          +`${lap}周目の${(F.dealt%SEATS)+1}枚目は${seat}番席。ボタンが最後に受け取る形になり、1枚ずつ配るのは、デッキの偏りや「配りすぎ」の抜き取りを防ぐためです。カードは裏向きのまま、各席の前へ滑らせます。`;
        return E('dealHole','deal',why,C(F.dealt===0?'Cards.':'',F.dealt===0?'配ります':''),{correct:seat});
      }
      if(F.expSwap){
        /* 途中で露出した札：配り終えたので、全員に見せて脇へ置き、一番上の札と交換する */
        const x=F.expSwap,p=pl(G,x.seat),old=p.cards[x.k];
        p.cards[x.k]=G.plan.rest.pop();G.deckUsed++;F.expSwap=null;F.expCard=null;
        addLog(G,{t:'info',el:`配り終えたので、表になった${x.seat}番席の${cardText(old)}を脇へ置き（次のバーンに使う）、一番上の札と交換しました`});
      }
      G.phase='bet';initBet(G,'pre');return expected(G);
    }

    case 'bet':return betStep(G);

    case 'endbet':{
      const un=uncalledInfo(G);
      if(un&&!F.retDone)
        return E('returnUncalled','pay',
          `${un.seat}番席のベット${fmt$(pl(G,un.seat).bet)}は、他の誰にもコールされていません。最高額と次点の差（${fmt$(pl(G,un.seat).bet)}−${fmt$(un.second)}＝${fmt$(un.amount)}）を、集金の前にその席へ返します。`
          +'コールされていない分はポットに入れてはいけません。返さないまま集めると、後で「私のチップがポットに入った」と揉める原因になります。',
          C('Uncalled bet returned.','コールされなかった分をお返しします'),
          {amount:un.amount,amountLabel:'返すチップ',chipInfo:{kind:'return'},seat:un.seat,hint:`${un.seat}番席が出している${fmt$(pl(G,un.seat).bet)}から、次点の${fmt$(un.second)}を引いた${fmt$(un.amount)}を返す。`});
      if(!F.gathered&&betsTotal(G)===0){F.gathered=true;F.calledPot=true;G._gathered={parts:[],sum:0,before:G.pot};}
      if(!F.gathered)
        return E('gather','pot',
          `ベッティングラウンドが終わったら、各席の前のベットをポットへ集めます。1席ずつ、額を目で確認しながら、まとめて中央へ寄せます。`
          +'集めるのは全員の行動が終わってから。途中で集めると、誰がいくら出していたか分からなくなり、コール額の説明もできなくなります。集めたチップは、必ず1つのポットとしてボード付近にまとめます。',
          C('Pulling the bets in.','ベットを集めます'));
      if(!F.calledPot)
        return E('callPot','pot',potWhy(G,G._gathered),C(`The pot is ${fmt$(G.pot)}.`,`ポットは${fmt$(G.pot)}です`),{callSet:potSet(G)});
      afterBet(G);return expected(G);
    }

    case 'runout':
      return E('openHands','showdown',
        `残っている誰かがオールインして、それ以上ベットが起きないとき（オールインとコールが完了したとき）は、全員が手札を表向きに開きます。`
        +'ボードが残りのカードで完成するのを見せる前に手札を確定させるためで、片方だけが見て有利になる、あるいは後から手を組み替えるのを防ぎます。手札を開かせてから、バーンとボードを出します。',
        C('Hands up, please.','手札を表にしてください'));

    case 'street':{
      const key=nextStreetKey(G),name=key==='dealFlop'?'フロップ':key==='dealTurn'?'ターン':'リバー';
      if(!F.burned)return E('burn','board',
        `ボードを出す前には、必ず先にカードを1枚バーン（裏向きで捨てる）します。フロップ・ターン・リバーのすべての前に1枚ずつ。`
        +`次に出るカードを、デッキの裏面の傷や折れ目から誰かに読まれないようにするための不正防止で、これを忘れると発覚した時点でそのハンドを無効にすることもあります。今は${name}の前のバーンです。`,
        C('Burn.','バーン'));
      return E(key,'board',
        key==='dealFlop'?'バーンの後、フロップは3枚を同時に出して横一列に並べます（1枚ずつめくらない）。3枚を裏向きで置き、そろえてからまとめて表向きにするのが基本で、途中で一部だけ見えないようにします。フロップを出した時点で「フロップが出た」ことになり、以降はレーキの対象になります。'
        :key==='dealTurn'?'バーンの後、ターン（4枚目）を1枚、フロップの右に出します。バーンを先にする、1枚だけ出す、という順序が崩れていないか毎回確認します。'
        :'バーンの後、リバー（5枚目）を1枚、ターンの右に出します。これでボードが5枚そろい、最後のベッティングラウンドに入ります。',
        C(key==='dealFlop'?'Flop.':key==='dealTurn'?'Turn.':'River.',name));
    }

    case 'showdown':{
      const P=G.pots;
      if(P.length>1&&F.sideIdx<P.length){
        const i=F.sideIdx;
        return E('callSide','pot',sidePotWhy(G,i),C(`${i===0?'Main pot':'Side pot '+i}, ${fmt$(P[i].orig)}.`,`${potName(i)}は${fmt$(P[i].orig)}`),
          {callSet:sideSet(G,i),potIdx:i});
      }
      if(!F.showFirstDone){
        const f=firstToShow(G);
        return E('showFirst','showdown',
          f.agg?`最後のベッティングラウンドで最後にベットまたはレイズした席（${f.seat}番席）が、最初に手札を見せます。コールした側は、その手札を見てから判断できるのが公平だからです。`
            :`最後のラウンドでベットがなく全員チェックだった場合は、ボタンの左から時計回りで最初に残っている席（${f.seat}番席）から見せます。`,
          C(`Seat ${f.seat}, show.`,`${f.seat}番席、手札をどうぞ`),{correct:f.seat});
      }
      if(!G.opened)return E('openHands','showdown',
        `最初に見せる席の後、残りの全員が時計回りに手札を開きます。開かれたカードは、必ず「表向きで、他の全員とカメラから見える位置」に置かせます。`
        +'手札を見せるのはお客様の権利ですが、勝敗の判定はディーラーが行うので、カードを伏せたまま捨てる（マック）と判定が成立しません。',
        C('Show your hands.','手札を開いてください'));
      for(let i=0;i<P.length;i++){
        if(G.winners[i])continue;
        if(P[i].eligible.length===1){G.winners[i]=[P[i].eligible[0]];continue;}
        const ws=winnerSet(G,i);
        return E('pickWinner','showdown',winnerWhy(G,i),C(`${seatSetText(ws.ws).replace('の勝ち',' wins').replace('チョップ：','Chop. Seats ').replace('番席','')}.`,`${potName(i)}：${seatSetText(ws.ws)}`),
          {callSet:ws,potIdx:i});
      }
      return payoutStep(G);
    }

    case 'award':return payoutStep(G);

    case 'close':{
      if(!F.cleaned)return E('cleanHands','security',
        '払い出しを終えてチップから手を離した瞬間に、両手のひらをカメラとお客様へ大きく開いて見せます。手の中にチップを隠していないことの証明で、1ゲームにつき必ず1回入れます。',
        C('Clean hands.','クリーンハンドです'));
      return E('clearCards','security',
        'ボード・バーンしたカード・使用済みの手札を、すべてマック（捨て札）へ集めます。バーンしたカードも一緒にまとめ、次のシャッフルでは必ず52枚全部を混ぜ直します。枚数が52枚あるかは、ここで数えて確かめる習慣にします。',
        C('Next hand.','次のゲームです'));
    }
  }
  return null;
}

function payoutStep(G){
  const F=G.flags,T=G.stakes;
  if(G.rake>0&&!F.rakeDone){
    return E('takeRake','rake',
      `フロップが出たゲームは、ポットからレーキを徴収します（${rakeRuleText(T)}）。ポット総額${fmt$(G.pot)}に対して：${rakeTip(T,G.pot)}`
      +'レーキはポットを払い出す前に、メインポットから取ります。勝者に払ってから取り返すことはできないためです。徴収したチップはテーブル手前のレーキボックス（ドロップ）へ入れます。',
      C('Rake.','レーキを頂戴します'),
      {amount:G.rake,amountLabel:'徴収するレーキ',chipInfo:{kind:'rake'},hint:`${rakeTip(T,G.pot)}`});
  }
  if(!G.payList){G.payList=buildPayList(G);G.payIdx=0;}
  if(G.payIdx<G.payList.length){
    const it=G.payList[G.payIdx],P=G.pots[it.potIdx];
    let why=`${P.name}${G.pots.length>1?`（${fmt$(P.net)}）`:''}を払い出します。`;
    if(it.n>1)why+=`勝者は${it.n}人のチョップで、${oddTip(it.net,it.n)}今払うのは${it.seat}番席で、${fmt$(it.amount)}${it.extra?`（均等分${fmt$(it.share)}＋端数の$1）`:''}。`;
    else why+=`勝者は${it.seat}番席で、${fmt$(it.amount)}${G.rake>0&&it.potIdx===0?`（レーキ${fmt$(G.rake)}を引いた後の額）`:''}。`;
    why+=`払い出しは、メインポット→サイドポットの順。勝者のスタックの前へ、チップを整えて置きます（最少枚数で、大きい額面から）。`;
    return E('payTo','pay',why,C(`Pot to seat ${it.seat}.`,`${it.seat}番席へポットをお渡しします`),
      {correct:it.seat,amount:it.amount,amountLabel:'払い出す金額',chipInfo:{kind:'pot'},hint:it.n>1?oddTip(it.net,it.n):`${it.seat}番席が${P.name}を全額受け取る（${fmt$(it.amount)}）。`});
  }
  G.phase='close';return expected(G);
}

function apply(G,ex,amount){
  const F=G.flags,B=G.bet;let extra='',cap=ex.call;
  const done=()=>{setCaption(G,cap);addLog(G,{t:'ok',
    el:LABEL[ex.key]+(amount!==undefined?`：${fmt$(amount)}`:'')+(extra?` ${extra}`:''),
    call:cap&&cap.en?cap:null});};
  switch(ex.key){
    case 'start':startRound(G);return;
    case 'moveButton':G.button=ex.correct;F.moved=true;extra=`（${ex.correct}番席）`;break;
    case 'selectSB':F.sb=true;extra=`（${ex.correct}番席）`;break;
    case 'selectBB':F.bb=true;extra=`（${ex.correct}番席）`;break;
    case 'shuffleCut':F.shuffled=true;break;
    case 'dealHole':{
      const p=pl(G,ex.correct),k=p.cards.length;
      p.cards.push(G.plan.hole[ex.correct][k]);F.dealt++;G.deckUsed++;
      if(F.dealt<=2&&accFire(G,'firstExposed'))F.expCard={seat:ex.correct,k};
      else if(F.dealt>=3&&F.dealt<G.holeN*SEATS&&accFire(G,'midExposed'))F.expCard={seat:ex.correct,k};
      extra=`（${F.dealt}枚目→${ex.correct}番席）`;
      if(F.dealt>1)cap=null;
      break;
    }
    case 'nextActor':{
      const c=B.cur;c.stage='declare';
      if(B.street==='pre'&&B.count>=1&&!G.board.length&&accFire(G,'boardEarly')){G.earlyFlop=G.plan.board.slice(0,3);G.burned++;G.deckUsed+=4;}
      addLog(G,{t:'info',el:`${c.seat}番席の宣言：「${evText(G,pl(G,c.seat),c.ev)}」`});
      break;
    }
    case 'confirmCall':{
      const c=B.cur,p=pl(G,c.seat);
      const a=callAmount(G,p);
      B.lastActor=c.seat;applyEvent(G,p,c.ev);B.cur=null;
      extra=`（${c.seat}番席 ${fmt$(a)}）`;break;
    }
    case 'ruling':{
      const c=B.cur,p=pl(G,c.seat);let ev=c.ev;
      if(ev.illegal){
        /* 不正な宣言は無効にして、最小額で上げ直してもらう */
        const minTo=B.current+B.minInc;
        addLog(G,{t:'info',el:`${c.seat}番席：${fmt$(ev.to)}は最小額に届かないため無効。${fmt$(minTo)}で上げ直し`});
        ev={type:'raise',to:minTo,allin:false};
        cap=C(`The minimum is ${minTo}. Raise to ${minTo}.`,`ミニマムは${fmt$(minTo)}。${c.seat}番席、${fmt$(minTo)}へのレイズ`);
      }
      B.lastActor=c.seat;applyEvent(G,p,ev);B.cur=null;
      extra=`（${c.seat}番席 ${evText(G,p,ev)}）`;break;
    }
    case 'returnUncalled':{
      const p=pl(G,ex.seat);
      p.bet-=amount;p.committed-=amount;p.stack+=amount;F.retDone=true;
      extra=`（${ex.seat}番席へ）`;break;
    }
    case 'gather':{
      const parts=G.players.filter(p=>p.bet>0).map(p=>({seat:p.seat,bet:p.bet}));
      const sum=parts.reduce((a,b)=>a+b.bet,0);
      G._gathered={parts,sum,before:G.pot};
      G.pot+=sum;G.players.forEach(p=>{p.bet=0;});F.gathered=true;
      extra=`（${fmt$(sum)}）`;break;
    }
    case 'callPot':F.calledPot=true;break;
    case 'callSide':F.sideIdx++;break;
    case 'burn':F.burned=true;G.burned++;G.deckUsed++;break;
    case 'dealFlop':case 'dealTurn':case 'dealRiver':{
      const n=ex.key==='dealFlop'?3:1;
      for(let i=0;i<n;i++){G.board.push(G.plan.board[G.board.length]);G.deckUsed++;}
      if(ex.key==='dealFlop')F.flopSeen=true;
      const street=ex.key==='dealFlop'?'flop':ex.key==='dealTurn'?'turn':'river';
      extra=`（${cardsText(G.board)}）`;
      cap=C(`${street==='flop'?'Flop':street==='turn'?'Turn':'River'}: ${cardsText(G.board.slice(street==='flop'?0:-1))}.`,
        `${street==='flop'?'フロップ':street==='turn'?'ターン':'リバー'}：${cardsText(G.board.slice(street==='flop'?0:-1))}`);
      if(alive(G).length>=2&&actives(G).length>=2){G.phase='bet';initBet(G,street);}
      else if(street==='river')afterBetRiverRunout(G);
      else toStreet(G);
      break;
    }
    case 'openHands':G.opened=true;
      if(G.phase==='runout'){
        if(G.bet.street==='river'){G.phase='showdown';startShowdown(G);}
        else toStreet(G);
      }
      break;
    case 'showFirst':F.showFirstDone=true;extra=`（${ex.correct}番席）`;break;
    case 'pickWinner':G.winners[ex.potIdx]=ex.callSet.ws.slice();
      extra=`（${G.pots[ex.potIdx].name}：${ex.callSet.ws.join('・')}番席）`;break;
    case 'takeRake':F.rakeDone=true;G.rakeBox+=amount;G.pot-=amount;
      {let r=amount;G.pots.forEach(P=>{const d=Math.min(P.amount,r);P.amount-=d;r-=d;});}
      break;
    case 'payTo':{
      const it=G.payList[G.payIdx];
      pl(G,it.seat).stack+=amount;G.pot-=amount;
      G.pots[it.potIdx].amount=Math.max(0,G.pots[it.potIdx].amount-amount);
      G.payIdx++;extra=`（${it.seat}番席へ ${G.pots[it.potIdx].name}）`;
      if(G.payIdx>=G.payList.length)G.phase='close';
      break;
    }
    case 'cleanHands':F.cleaned=true;break;
    case 'clearCards':F.cleared=true;done();finishRound(G);return;
  }
  done();
}
/* リバーが出た時点で誰も行動できない（全員オールイン済み）場合はショーダウンへ */
function afterBetRiverRunout(G){
  G.bet.street='river';
  const al=alive(G);
  if(al.some(p=>p.allin)&&!G.opened){G.phase='runout';return;}
  G.phase='showdown';startShowdown(G);
}

function finishRound(G){
  G.phase='done';G.lastFb=null;
  G.muck+=G.board.length+G.burned;
  addLog(G,{t:'info',el:`ラウンド${G.roundNo}終了（正解${G.round.ok}／ミス${G.round.err}）`});
}
function recordErr(G,cat,why,fbText){
  G.round.err++;G.round.errors.push({cat,why});
  G.lastFb={t:'err',text:fbText||('ミス：'+why)};
  addLog(G,{t:'err',el:`ミス（${CAT_NAME[cat]}）`,why:fbText||why});
}

/* 戻り値：{cat, ok}／採点対象外は null */
function act(G,key,arg){
  if(G.pending){
    const p=G.pending;
    if(key==='chip'){const d=+arg;if(CHIPS.includes(d)&&p.chips.length<300)p.chips.push(d);return null;}
    if(key==='chipUndo'){p.chips.pop();return null;}
    if(key==='chipClear'){p.chips=[];return null;}
    if(key!=='chipPay')return null;
    const sum=p.chips.reduce((a,b)=>a+b,0);
    const cat=p.ex.key==='takeRake'?'rake':'pay';
    if(sum===p.ex.amount){
      const min=minChips(p.ex.amount),used=p.chips.slice();
      G.pending=null;G.round.ok++;
      G._lastPending=p.ex;
      apply(G,p.ex,sum);
      if(used.length>min.length){
        const note=`${LABEL[p.ex.key]} ${fmt$(sum)}：金額は正解。ただし最少枚数は${min.length}枚（${chipsText(min)}）。今回は${used.length}枚（${chipsText(used)}）。`;
        G.round.notes.push(note);G.lastFb={t:'warn',text:note};
      }else{
        G.lastFb=G.phase==='done'?null:{t:'ok',text:`正解：${fmt$(sum)}（${chipsText(used)}）`};
      }
      return{cat,ok:true};
    }
    p.errs=(p.errs||0)+1;
    recordErr(G,cat,p.ex.why,`金額が違います（出したチップ ${fmt$(sum)}）。${chipDiagnosis(sum,p.ex.amount)}\n正しい出し方：${planText(p.ex.amount)}\n${p.ex.hint}`);
    return{cat,ok:false};
  }
  const ex=expected(G);if(!ex)return null;
  if(ex.unscored){if(key==='start'){apply(G,ex);G.lastFb=null;}return null;}

  if(ex.key==='accident'&&key==='accident')return accAct(G,ex,arg);

  if(key!==ex.key){
    /* バーン忘れは最重要のミスなので、理由を先頭に出す */
    if(G.phase==='street'&&!G.flags.burned&&/^deal(Flop|Turn|River)$/.test(key)){
      recordErr(G,'board',ex.why,`バーンしていません。ボードを出す前に、必ず先にバーンです。${ex.why}`);
      return{cat:'board',ok:false};
    }
    if(G.phase==='street'&&G.flags.burned&&/^deal(Flop|Turn|River)$/.test(key)){
      recordErr(G,'board',ex.why,`出すストリートが違います。今出すのは「${LABEL[ex.key]}」です。${ex.why}`);
      return{cat:'board',ok:false};
    }
    recordErr(G,ex.cat,ex.why,`この場面で正しい操作は「${LABEL[ex.key]}」です。${ex.why}`);
    return{cat:ex.cat,ok:false};
  }
  if(MC_KEYS.includes(ex.key)&&arg!==ex.callSet.right){
    const cat=ex.cat;
    const head=ex.key==='ruling'?'判定が違います':ex.key==='pickWinner'?'勝者のコールが違います':'金額が違います';
    recordErr(G,cat,ex.why,`${head}。正しくは「${ex.callSet.right}」。${ex.why}`);
    return{cat,ok:false};
  }
  if(SEAT_KEYS.includes(ex.key)&&String(arg)!==String(ex.correct)){
    const a=+arg;
    recordErr(G,ex.cat,ex.why,`${a}番席ではありません。正しくは${ex.correct}番席です。${ex.why}`);
    return{cat:ex.cat,ok:false};
  }
  G.round.ok++;
  if(ex.amount!==undefined){
    G.pending={ex,chips:[]};
    G.lastFb={t:'info',text:`${LABEL[ex.key]}：チップトレイから${ex.amountLabel}を出して確定してください。`};
    if(ex.key==='payTo'||ex.key==='takeRake'||ex.key==='returnUncalled')setCaption(G,ex.call);
    return{cat:ex.cat,ok:true};
  }
  G.lastFb={t:'ok',text:`正解：${LABEL[ex.key]}`};
  apply(G,ex);
  return{cat:ex.cat,ok:true};
}

/* 金額つきのレーキ計算 */
function chatRake(G,q){
  if(!/レーキ|rake|ドロップ/.test(q))return null;
  const nums=chatNums(q);
  const T=G.stakes;
  const rm=q.match(/(\d+(?:\.\d+)?)\s*%/);
  const rate=rm?+rm[1]/100:T.rate;
  const capm=q.match(/(?:上限|キャップ|cap)\s*\$?(\d+)/);
  const cap=capm?+capm[1]:T.cap;
  if(!nums.length){
    return{text:`今のテーブルのレーキ：${rakeRuleText(T)}\n・ポットに対する比率で計算し、$1未満は切り捨て、上限を超えたら上限。\n・5%は「10%の半分」、10%は「桁をひとつ下げる」で暗算します。\n・フロップが出なかったゲームは徴収しません（No flop, no drop）。\n・徴収はポットを払い出す前に、メインポットから。\n金額を書いてもらえれば計算します（例：「ポット480のレーキは？」）。`};
  }
  const pot=nums.find(v=>!(capm&&v===cap))||nums[0];
  const tt={rate,cap};
  return{text:`ポット${fmt$(pot)}、レーキ${Math.round(rate*100)}%（上限${fmt$(cap)}）\n→ レーキ ${fmt$(rakeOf(tt,pot))}\n${rakeTip(tt,pot)}\n→ 勝者への払い出しは${fmt$(pot-rakeOf(tt,pot))}`};
}

/* 「100と250と600のオールイン」のような並びからサイドポットを組み立てる */
function chatSidePot(G,q){
  if(!/サイドポット|side ?pot|サイド/.test(q))return null;
  const nums=chatNums(q).slice(0,6);
  if(nums.length<2)return null;
  const uniq=[...new Set(nums)].sort((a,b)=>a-b);
  let prev=0;const lines=[];const total=nums.reduce((a,b)=>a+b,0);
  uniq.forEach((lv,i)=>{
    const n=nums.filter(x=>x>=lv).length;
    const amt=(lv-prev)*nums.filter(x=>x>prev).length;
    const who=nums.filter(x=>x>=lv).length;
    lines.push(`・${i===0?'メインポット':'サイドポット'+i}：（${fmt$(lv)}−${fmt$(prev)}）×${nums.filter(x=>x>prev).length}人＝${fmt$(amt)}（資格：${who}人）`);
    prev=lv;
  });
  return{text:`各自が出した額：${nums.map(fmt$).join('、')}（全員がショーダウンまで残った場合）\n${lines.join('\n')}\n合計 ${fmt$(total)}\n※最大額の人の超過分が他の誰にもコールされなければ、サイドポットではなく本人へ返します。\n※フォールドした人のチップは、その額まで該当する層に含まれます。`};
}

/* 最小レイズの計算：数字が2つなら「現在の最高額」と「直前の増分」 */

function chatNextStep(G){
  if(G.pending){
    const ex=G.pending.ex;

/* ===== 共通キット（4ゲームで同じ内容。直すときは全ゲームをそろえる） =====
   ・チップ・カウンティングのコツ（金額→額面×枚数への分解、検算、ミスの切り分け）
   ・効果音と振動（正解・ミス・チップを置く音。外部ファイルを使わずその場で合成）
   ・ルールブックのシート（rules.html をゲームの上に重ねて開く）
   各ゲームの CHIPS（使えるチップの額面、高額順）・minChips・chipsText・fmt$ を前提にする。 */

/* ---- チップ・カウンティング ---- */
const CHIP_COLOR={1:'白',5:'赤',10:'青',25:'緑',50:'橙',100:'黒',500:'紫',1000:'金'};
function chipCounts(arr){const m={};arr.forEach(d=>{m[d]=(m[d]||0)+1;});return m;}
/* 最少枚数での内訳 [{d:額面,n:枚数}, …]（高額から） */
function chipPlan(amount){const m=chipCounts(minChips(amount));return CHIPS.filter(d=>m[d]).map(x=>({d:x,n:m[x]}));}
function planText(amount){
  const pl=chipPlan(amount),n=pl.reduce((a,x)=>a+x.n,0);
  return `${fmt$(amount)} ＝ ${pl.map(x=>`$${x.d}×${x.n}`).join(' ＋ ')}（${n}枚）`;
}
/* n枚を5枚単位に区切った数え方。7→「5＋2」、12→「5＋5＋2」、20→「5×4」 */
function groupBy5(n){
  if(n<=5)return String(n);
  const full=Math.floor(n/5),rest=n%5;
  const head=full<=3?Array(full).fill(5).join('＋'):`5×${full}`;
  return rest?`${head}＋${rest}`:head;
}
/* 出した額と正解のズレから、枚数の数え間違いか金額の暗算ミスかを切り分ける */
function chipDiagnosis(sum,amount){
  const diff=Math.round((sum-amount)*100)/100,ad=Math.abs(diff),more=diff>0?'多い':'少ない';
  if(ad===0)return '';
  if(CHIPS.includes(ad))
    return `差は${fmt$(ad)}（${CHIP_COLOR[ad]||''}$${ad}チップ1枚ぶん${more}）。枚数の数え間違いの可能性が高い。5枚ずつ区切って数え直す。`;
  const m=minChips(ad);
  if(m.length<=3&&Number.isInteger(ad))
    return `差は${fmt$(ad)}（${chipsText(m)}）${more}。額面の取り違えか、2〜3枚の数え間違い。色で確かめて数え直す。`;
  return `差は${fmt$(ad)}${more}と大きい。配当額の暗算がずれている可能性。分解からやり直す。`;
}
/* 1つ上の額面に何枚で替わるか（例：赤$5は5枚で緑$25）。このゲームで使う額面の中で探す */
function chipUp(d){const ups=CHIPS.filter(u=>u>d&&u%d===0).sort((a,b)=>a-b);return ups.length?[ups[0]/d,ups[0]]:null;}
function chipEquiv(d){const u=chipUp(d);return u?`${CHIP_COLOR[d]}$${d}は${u[0]}枚で${CHIP_COLOR[u[1]]}$${u[1]}`:null;}
/* 20枚スタックの価値（暗記用） */
function stack20Text(){return '20枚の山の価値：'+CHIPS.slice().sort((a,b)=>a-b).filter(d=>d<1000).map(d=>`${CHIP_COLOR[d]}${fmt$(d*20)}`).join('／');}
/* その場面で使う「出し方のコツ」。withPlan が偽なら内訳そのものは伏せる。
   info.kind：pay（配当）／commission（コミッション）／rake（レーキ）／pot（ポットの払い出し）／
   return（返却）／collect（回収）。info.mult：配当倍率 */
function chipCoach(amount,info,withPlan){
  const lines=[],pl=chipPlan(amount),kind=info&&info.kind,mult=info&&info.mult;
  if(withPlan)lines.push(`内訳：${planText(amount)}。高額の額面から順に取る。`);
  else lines.push(`手を出す前に、金額を「額面×枚数」に分解する。高額の額面（${CHIPS.map(d=>'$'+d).join('→')}）から順に取る。`);
  const eq=pl.filter(x=>x.d!==CHIPS[0]).map(x=>chipEquiv(x.d)).filter(Boolean).slice(0,2);
  lines.push(withPlan&&eq.length?`換算：${eq.join('、')}。同じ額面が並んだら、1つ上の額面に替えて数える。`
    :'換算：'+CHIPS.slice(1).reverse().map(chipEquiv).filter(Boolean).slice(0,3).join('、')+'。同じ額面が並んだら、1つ上の額面に替えて数える。');
  if(kind==='commission')lines.push('コミッションは小額のチップが中心。$1・$5は5枚ずつの組にしてから出すと数え間違いが減る。');
  else if(kind==='rake')lines.push('レーキはポットから取り分け、全員に見える位置で額を示してから入れる。小額チップは5枚1組で。');
  else if(kind==='pot')lines.push('ポットは額面ごとに分け、20枚の山（5枚×4）にしてから数える。押し出す前に「黒何枚、緑何枚」と確認する。');
  else if(kind==='return')lines.push('返す額は「最高額−次点の額」。ベットの山から上の差額だけを切り取って本人の前へ戻す。');
  else if(kind==='collect')lines.push('回収は元金の山を割って取る。半分なら山を2つに切り分け、高さがそろっているかで検算する。');
  else if(mult===1)lines.push('1:1は元金と同額。元金のチップの色と高さを見て、同じ並びを横にそろえる（ミラー）。高さが揃えば検算になる。');
  else if(mult===1.5)lines.push('3:2は「元金＋その半分」。元金と同じ並びを作り、さらに半分の山を足す。半分にしにくい額面は先に崩しておく。');
  else if(mult===0.5)lines.push('半額は元金のスタックを半分に分ける。割り切れない額面は、小さい額面に崩して作る。');
  else if(mult===2)lines.push('2:1は元金の並びを2つ作る（ミラーを2回）。高さが元金と同じ山が2本になれば正解。');
  else lines.push('倍率の大きい配当は、先に暗算で金額を確定してから分解する。チップを出しながら足し算し直さない。');
  lines.push('出し終えたら額面ごとに「黒4、緑3」と声に出して照合し、最後に合計を言う。');
  return lines;
}

/* 出したチップの表示。額面ごとにまとめ、5枚ごとに間をあける（5枚1組で数える練習）。
   withPlan のときは最少枚数の内訳を薄い枠で先に描いておき、出したぶんだけ埋まっていく。 */
function chipStackHTML(chips,amount,withPlan){
  const cnt=chipCounts(chips),plan={};
  if(withPlan&&amount>0)chipPlan(amount).forEach(x=>{plan[x.d]=x.n;});
  const ds=CHIPS.filter(d=>cnt[d]||plan[d]);
  if(!ds.length)return '<span class="stack-empty">まだチップがありません</span>';
  return ds.map(d=>{
    const have=cnt[d]||0,need=plan[d]||0,slots=Math.max(have,need);
    const chipsH=Array.from({length:slots},(_,i)=>{
      const cls=i<have?(need&&i>=need?' over':''):' ghost';
      return `<span class="mini-chip ch-${d}${cls}${i%5===4&&i<slots-1?' g5':''}">${d}</span>`;
    }).join('');
    const state=withPlan&&need?(have===need?' done':have>need?' over':''):'';
    const label=withPlan&&need?`${have}/${need}`:`×${have}${have>5?`（${groupBy5(have)}）`:''}`;
    return `<span class="sg" aria-label="$${d}が${have}枚"><span class="sg-chips">${chipsH}</span><span class="sg-n${state}">${label}</span></span>`;
  }).join('');
}

/* ---- 効果音と振動 ----
   音声ファイルは持たず Web Audio でその場で鳴らす（単一HTMLのまま、通信なしで動かすため）。
   設定の「効果音・振動」で切れる。振動は対応する端末（主にAndroid）だけ。 */
const SFX={
  ctx:null,
  enabled(){try{return !(G&&G.opts&&G.opts.sfx===false);}catch(e){return true;}},
  ac(){
    if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ctx=new A();}
    if(this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;
  },
  tone(f,t,dur,type,vol){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  },
  click(t,f,vol){
    const c=this.ctx,n=Math.floor(c.sampleRate*0.03),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    bp.type='bandpass';bp.frequency.value=f||3200;bp.Q.value=2.2;g.gain.value=vol||0.35;
    s.buffer=b;s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t);
  },
  play(kind){
    if(!this.enabled())return;
    try{
      if(kind==='ng'&&navigator.vibrate)navigator.vibrate(45);
      if(kind==='chip'&&navigator.vibrate)navigator.vibrate(6);
      const c=this.ac();if(!c)return;const t=c.currentTime+0.005;
      if(kind==='ok'){this.tone(988,t,0.10,'sine',0.045);this.tone(1480,t+0.07,0.16,'sine',0.04);}
      else if(kind==='ng'){this.tone(196,t,0.16,'triangle',0.07);this.tone(147,t+0.09,0.22,'triangle',0.06);}
      else if(kind==='chip'){this.click(t,3400,0.32);this.click(t+0.035,2600,0.18);}
      else if(kind==='pay'){[0,0.045,0.09,0.13].forEach((d,i)=>this.click(t+d,3000+i*200,0.26));this.tone(1319,t+0.16,0.14,'sine',0.035);}
      else if(kind==='round'){[784,988,1175,1568].forEach((f,i)=>this.tone(f,t+i*0.08,0.18,'sine',0.04));}
    }catch(e){}
  }
};

/* ---- 実戦のアクシデント ----
   カードが落ちた・めくれた・ボールが落ちた、などの手元の事故に、その場で正しく反応できるかを問う。
   原則：手を止める／独断で直さない（拾う・戻す・入れ替えない）／声に出してフロアを呼ぶ。
   ただしミスディール・ノースピンのように、ディーラーが宣言するのが標準のものは宣言が正解。
   処理の結論はカジノで異なるため「この卓の規定」として示す。
   ゲーム側は ACC[type]={what,why,right,wrongs:[[選択肢,なぜまずいか],…],ruling,call,hand?,resolve(G)} を定義し、
   ラウンド開始時に accPlan、事故が起こりうる場面で accFire、expected() の先頭で accExpected、act() で accAct を呼ぶ。 */
const ACC_RATE={off:0,often:.6};
function accRate(G){const m=(G.opts&&G.opts.accidents)||'normal';if(m in ACC_RATE)return ACC_RATE[m];return [0,.12,.16,.2,.25][currentDifficulty(G).level]||.12;}
/* このラウンドで起こすアクシデント（1ラウンドに最大1回）。G.forceAccident（テスト用）があれば必ずそれ */
function accPlan(G,types){
  if(G.forceAccident)return types.includes(G.forceAccident)?{type:G.forceAccident,forced:true}:null;
  return Math.random()<accRate(G)?{type:types[Math.floor(Math.random()*types.length)]}:null;
}
/* 事故が起こりうる場面で呼ぶ。計画どおりの種類なら発生させて true（計画は消費） */
function accFire(G,type,data){
  const p=G.round&&G.round.accPlan;
  if(!p||p.type!==type||(G.flags&&G.flags.acc))return false;
  G.round.accPlan=null;if(p.forced)G.forceAccident=null;
  const A=ACC[type],n=currentDifficulty(G).level>=3?4:3;
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const opts=shuf([A.right].concat(shuf(A.wrongs.map(w=>w[0])).slice(0,n-1)));
  G.flags.acc=Object.assign({type,opts},data||{});
  addLog(G,{t:'err',el:`アクシデント：${A.what}`});
  return true;
}
function accExpected(G){
  const a=G.flags&&G.flags.acc;if(!a)return null;
  const A=ACC[a.type];
  return E('accident','accident',A.why,A.call,{callSet:{right:A.right,opts:a.opts},acc:a.type,what:A.what});
}
/* 返り値 {cat,ok}。正解なら字幕に宣言、ログにフロアの裁定を出し、規定どおりに状態を直す */
function accAct(G,ex,arg){
  const A=ACC[ex.acc];
  if(arg!==A.right){
    const w=A.wrongs.find(x=>x[0]===arg);
    recordErr(G,'accident',A.why,`その対応はまずい：${w?w[1]:'事故の後は手を止め、独断で直さないのが原則です。'}\n正しくは「${A.right}」。${A.why}`);
    return{cat:'accident',ok:false};
  }
  G.round.ok++;
  const data=G.flags.acc;G.flags.acc=null;
  setCaption(G,A.call);
  addLog(G,{t:'ok',el:`アクシデント対応：${A.right}`,call:A.call});
  addLog(G,{t:'info',el:`フロアの裁定（この卓の規定）：${A.ruling}`});
  G.lastFb={t:'ok',text:`正解：${A.right}\nフロアの裁定（この卓の規定）：${A.ruling}`};
  if(A.resolve)A.resolve(G,data);
  return{cat:'accident',ok:true};
}

/* ===== ディーラー：骨格アニメーション =====
   手先をテーブル上の実座標（シュー・両ハンド・各ベット枠・コミッションボックス・

   OS側の「アニメーション削減」設定に関わらず常に再生する。 */
const REDUCED=false;
function elRect(sel){
  const host=$('table'),el=typeof sel==='string'?host&&host.querySelector(sel):sel;
  if(!host||!el)return null;
  const f=host.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-f.left,y:r.top-f.top,w:r.width,h:r.height};
}
function unionRect(sel){
  const host=$('table');if(!host)return null;
  const els=host.querySelectorAll(sel);if(!els.length)return null;
  const f=host.getBoundingClientRect();
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  els.forEach(e=>{const r=e.getBoundingClientRect();
    x1=Math.min(x1,r.left-f.left);y1=Math.min(y1,r.top-f.top);
    x2=Math.max(x2,r.right-f.left);y2=Math.max(y2,r.bottom-f.top);});
  return{x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function ptOf(sel,ax,ay){
  const r=elRect(sel);if(!r)return null;
  return{x:r.x+r.w*(ax===undefined?0.5:ax),y:r.y+r.h*(ay===undefined?0.5:ay)};
}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

        if (mood === 'surprise') { rr = r * .8; s += P(C(xl, y, r * 1.7) + C(xr, y, r * 1.7), '#FFFDF8', k, .9); }
        s += P(C(xl + dx, y + dy, rr) + C(xr + dx, y + dy, rr), k);
        s += P(C(xl + dx - rr * .36, y + dy - rr * .38, rr * .36) + C(xr + dx - rr * .36, y + dy - rr * .38, rr * .36), '#FFFFFF');
        if (mood === 'sad') s += P(`M${pt(xl - r * 1.4, y - r * 1.5)}L${pt(xl + r * 1.1, y - r * 2.3)}M${pt(xr + r * 1.4, y - r * 1.5)}L${pt(xr - r * 1.1, y - r * 2.3)}`, 'none', k, r1(r * .42));
      }
      if (e.lash && mood !== 'out') {
        const q = mood === 'happy' ? .25 : 0;
        s += P(`M${pt(xl - r * .8, y - r * (.7 - q))}l${r1(-r * .75)} ${r1(-r * .5)}M${pt(xl - r * .2, y - r * (1 - q))}l${r1(-r * .3)} ${r1(-r * .75)}` +
          `M${pt(xr + r * .8, y - r * (.7 - q))}l${r1(r * .75)} ${r1(-r * .5)}M${pt(xr + r * .2, y - r * (1 - q))}l${r1(r * .3)} ${r1(-r * .75)}`, 'none', k, .9);
      }
    } else if (e.t === 'robot') {
      const rx = e.rx, ry = e.ry;
      if (mood === 'out') {
        s = P(`M${pt(xl - rx, y)}Q${pt(xl, y + ry * .8)} ${pt(xl + rx, y)}M${pt(xr - rx, y)}Q${pt(xr, y + ry * .8)} ${pt(xr + rx, y)}`, 'none', k, 1.5);
      } else {
        const sc = mood === 'surprise' ? 1.15 : 1;
        s = P(E(xl, y, rx * sc, ry * sc) + E(xr, y, rx * sc, ry * sc), '#FFFEFA', ch.pal.k, 1.1);
        if (mood === 'happy') {
          s += P(`M${pt(xl - rx * .6, y + 2)}Q${pt(xl, y - 5)} ${pt(xl + rx * .6, y + 2)}M${pt(xr - rx * .6, y + 2)}Q${pt(xr, y - 5)} ${pt(xr + rx * .6, y + 2)}`, 'none', k, 1.7);
        } else {
          let px = 1.3, py = 1.2, pr = 2.2;
          if (mood === 'think') { px = 0; py = ry * .55; }
          if (mood === 'sad') { px = .6; py = ry * .45; pr = 1.9; }
          if (mood === 'surprise') { px = 0; py = 0; pr = 1.5; }
          s += P(C(xl + px, y + py, pr) + C(xr - px, y + py, pr), k) + P(C(xl + px - .7, y + py - .8, .6) + C(xr - px - .7, y + py - .8, .6), '#fff');
          if (mood === 'sad') s += P(`M${pt(xl - rx, y - ry - 1)}L${pt(xl + rx * .7, y - ry - 4)}M${pt(xr + rx, y - ry - 1)}L${pt(xr - rx * .7, y - ry - 4)}`, 'none', ch.pal.k, 1.4);
        }
      }
    } else if (e.t === 'alien') {
      const rx = e.rx, ry = e.ry, rot = e.rot, oc = e.c, kk = ch.pal.k;
      if (mood === 'happy' || mood === 'out') {
        const d = mood === 'happy'
          ? `M${pt(xl - rx * .8, y + 3)}Q${pt(xl, y - 8)} ${pt(xl + rx * .8, y + 3)}M${pt(xr - rx * .8, y + 3)}Q${pt(xr, y - 8)} ${pt(xr + rx * .8, y + 3)}`
          : `M${pt(xl - rx * .8, y)}Q${pt(xl, y + 6)} ${pt(xl + rx * .8, y)}M${pt(xr - rx * .8, y)}Q${pt(xr, y + 6)} ${pt(xr + rx * .8, y)}`;
        s = P(d, 'none', kk, 5.4) + P(d, 'none', oc, 3.2);
      } else if (mood === 'sad') {
        // しょんぼり：上まぶたが目尻（外側）へ下がる半月目。sg=1 は左目（外側=左）、-1 は右目。
        const half = (x, sg) => `M${pt(x - rx * sg, y + 1)}A${rx} ${ry} 0 0 ${sg > 0 ? 0 : 1} ${pt(x + rx * sg, y - 4.5)}Q${pt(x, y - 2.6)} ${pt(x - rx * sg, y + 1)}Z`;
        s = P(half(xl, 1) + half(xr, -1), oc, kk, 1.4) + P(star(xl - 2, y + 4, 2.4, 1) + star(xr - 2, y + 4, 2.4, 1), '#FFFFFF');
      } else {
        const sc = mood === 'surprise' ? 1.12 : 1;
        s = P(RE(xl, y, rx * sc, ry * sc, rot) + RE(xr, y, rx * sc, ry * sc, -rot), oc, kk, 1.4);
        let sx = -2.6, sy = -3.4;
        if (mood === 'think') { sx = -.5; sy = 4.6; }
        if (mood === 'surprise') { s += P(C(xl, y + 1, 3.4) + C(xr, y + 1, 3.4), kk); sx = -3.6; sy = -4.6; }
        s += P(star(xl + sx, y + sy, 3.4, 1.45) + star(xr + sx, y + sy, 3.4, 1.45), '#FFFFFF');
      }
    } else if (e.t === 'panda') {
      outside = P(RE(xl, y, 6.8, 9.4, 28) + RE(xr, y, 6.8, 9.4, -28), '#262222');
      const W = '#FFFFFF';
      if (mood === 'happy') s = P(`M${pt(xl - 3, y + 1.5)}Q${pt(xl, y - 3.5)} ${pt(xl + 3, y + 1.5)}M${pt(xr - 3, y + 1.5)}Q${pt(xr, y - 3.5)} ${pt(xr + 3, y + 1.5)}`, 'none', W, 1.6);
      else if (mood === 'out') s = P(`M${pt(xl - 3, y)}Q${pt(xl, y + 3)} ${pt(xl + 3, y)}M${pt(xr - 3, y)}Q${pt(xr, y + 3)} ${pt(xr + 3, y)}`, 'none', W, 1.4);
      else {
        let rw = 2.8, pr = 1.6, py = -.6, px = .8;
        if (mood === 'think') { py = 1.4; px = .2; }
        if (mood === 'sad') { py = 1; pr = 1.4; }
        if (mood === 'surprise') { rw = 3.6; pr = 1.3; py = -.4; }
        s = P(C(xl + .8, y - .8, rw) + C(xr - .8, y - .8, rw), W) + P(C(xl + .8 + px, y + py, pr) + C(xr - .8 - px, y + py, pr), INK);
        if (mood === 'sad') s += P(`M${pt(xl - 4, y - 7)}L${pt(xl + 2.5, y - 10)}M${pt(xr + 4, y - 7)}L${pt(xr - 2.5, y - 10)}`, 'none', INK, 1.3);
      }
    }
    return outside + `<g class="cey">${s}</g>`;
  }

  /* ---------- 口 ---------- */
  function openMouth(x, y, w) {
    return P(`M${pt(x - w, y)}Q${pt(x, y + w * 1.55)} ${pt(x + w, y)}Q${pt(x, y + w * .3)} ${pt(x - w, y)}Z`, MOUTH, INK, .8) +
      P(E(x, y + w * .68, w * .45, w * .26), TONGUE);
  }
  function mouth(ch, mood) {
    const m = ch.mouth, { x, y, w } = m;
    if (m.s === 'beak') {
      let s = P(E(x, y, w, w * .58), '#F59A23', '#8A4A00', .9);
      if (mood === 'happy') s += P(E(x, y + .8, w * .62, w * .3), MOUTH) + P(`M${pt(x - w, y - .3)}Q${pt(x, y + 1.2)} ${pt(x + w, y - .3)}`, 'none', '#B25E00', .8);
      else if (mood === 'surprise') s += P(E(x, y + .5, w * .32, w * .3), MOUTH);
      else if (mood === 'sad') s += P(`M${pt(x - w * .9, y + 1.5)}Q${pt(x, y - 1)} ${pt(x + w * .9, y + 1.5)}`, 'none', '#B25E00', .9);
      else s += P(`M${pt(x - w * .95, y - .2)}Q${pt(x, y + 1.8)} ${pt(x + w * .95, y - .2)}`, 'none', '#B25E00', .9);
      return s;
    }
    if (mood === 'happy') return openMouth(x, y, Math.max(w * 1.15, 3.6));
    if (mood === 'sad') return P(`M${pt(x - w * .8, y + w * .6)}Q${pt(x, y - w * .3)} ${pt(x + w * .8, y + w * .6)}`, 'none', INK, 1.2);
    if (mood === 'surprise') return P(E(x, y + 1.2, 2.1, 2.7), MOUTH, INK, .8);
    if (mood === 'think') return P(`M${pt(x - 1.5, y + 1.2)}q1.6 -1.3 3.2 0t3 -.2`, 'none', INK, 1.1);
    if (mood === 'out') return P(`M${pt(x - 2, y + 1)}h4`, 'none', INK, 1);
    switch (m.s) {
      case 'open': return openMouth(x, y, w);
      case 'line': return P(`M${pt(x - 11, y - 1.5)}Q${pt(x - 1, y + 4.5)} ${pt(x + 10, y - 2.5)}`, 'none', INK, 1.3);
      case 'small': return P(`M${pt(x - w, y)}Q${pt(x, y + w)} ${pt(x + w, y)}`, 'none', INK, 1.2);
      case 'smile': return P(`M${pt(x - w, y - .5)}Q${pt(x, y + w * .8)} ${pt(x + w, y - .5)}`, 'none', INK, 1.2);
      case 'w': return P(`M${pt(x - 4, y)}Q${pt(x - 2, y + 2.6)} ${pt(x, y)}Q${pt(x + 2, y + 2.6)} ${pt(x + 4, y)}`, 'none', INK, 1);
    }
    return '';
  }

  /* ---------- 気分の効果（涙・…・！・きらり・Zz） ---------- */
  function fx(ch, mood) {
    const [fx0, fy0] = ch.fx;
    if (mood === 'sad') {
      const e = ch.eyes, x = e.x[0] - 1.5, y = e.y + (e.r || e.ry || 6) + 2;
      return `<path class="cft" d="M${pt(x, y)}C${pt(x + 3.2, y + 4.2)} ${pt(x + 3.8, y + 8)} ${pt(x, y + 9)}C${pt(x - 3.8, y + 8)} ${pt(x - 3.2, y + 4.2)} ${pt(x, y)}Z" fill="#A8E0FF" stroke="#2468A8" stroke-width=".9"/>`;
    }
    if (mood === 'think') {
      return P(E(fx0 - 4, fy0, 13, 8.4) + C(fx0 - 16, fy0 + 10, 2.2), '#FFFDF6', '#3A2A1E', 1, ' opacity=".96"') +
        [1, 2, 3].map(i => `<path class="cfd${i}" d="${C(fx0 - 4 + (i - 2) * 5.6, fy0, 1.9)}" fill="#2A1C12"/>`).join('');
    }
    if (mood === 'surprise') {
      const x = fx0, y = fy0;
      return `<path class="cfp" d="M${pt(x - 2.9, y - 12)}h5.8l-1.6 12h-2.6ZM${pt(x - 2.4, y + 4)}a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0Z" fill="#FFD84A" stroke="#4A2E08" stroke-width="1.1"/>`;
    }
    if (mood === 'happy') {
      return `<path class="cfs" d="${star(fx0, fy0, 7, 2, 4)}" fill="#FFE27A" stroke="#7A5A08" stroke-width=".8"/>` +
        `<path class="cfs cfs2" d="${star(110 - fx0, fy0 + 8, 5.4, 1.6, 4)}" fill="#FFE27A" stroke="#7A5A08" stroke-width=".8"/>`;
    }
    if (mood === 'out') {
      return `<path class="cfz" d="M${pt(fx0 - 6, fy0 + 3)}h6l-6 6.5h6M${pt(fx0 + 2, fy0 - 5)}h4.4l-4.4 4.6h4.4" fill="none" stroke="#E4ECFF" stroke-width="1.6"/>`;
    }
    return '';
  }

  /* ---------- 手・腕・小物 ---------- */
  function armD(x1, y1, x2, y2, bend) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    return `M${pt(x1, y1)}Q${pt(mx - dy / L * bend, my + dx / L * bend)} ${pt(x2, y2)}`;
  }
  function arm(ch, x1, y1, x2, y2, bend) {
    const d = armD(x1, y1, x2, y2, bend || 0), w = ch.pal.armW || 7.5;
    return P(d, 'none', HALO, w + 4.4, HOP) + P(d, 'none', ch.pal.armK || ch.pal.k, w + 2.6) + P(d, 'none', ch.pal.arm, w);
  }
  function hand(ch, x, y, s, fingers, o) {
    o = o || {};
    const d = o.flat ? 'M-9 1C-9 -6.5 9 -6.5 9 1A2.25 2.8 0 0 1 4.5 1A2.25 3.5 0 0 1 0 1A2.25 3.5 0 0 1 -4.5 1A2.25 2.8 0 0 1 -9 1Z'
      : handD(fingers, 5.4, 2.3, o.L);
    const extra = '';
    return `<g transform="translate(${pt(x, y)}) scale(${s})">${P(d, HALO, HALO, 3.4, HOP)}${P(d, ch.pal.paw, ch.pal.k, 1.25)}${extra}</g>`;
  }
  function paws(ch, pts) {
    const pr = ch.pr || [7.2, 5.6];
    const d = pts.map(q => E(q[0], q[1], pr[0], pr[1])).join('');
    let s = '';
    if (ch.restArms) pts.forEach(q => { const sh = q[0] < 55 ? ch.sh[0] : ch.sh[1]; s += arm(ch, sh[0], sh[1], q[0], q[1] - 2, 0); });
    const toes = pts.map(q => `M${pt(q[0] - 2, q[1] + 1.6)}v2.2M${pt(q[0] + 2, q[1] + 1.6)}v2.2`).join('');
    return s + P(d, HALO, HALO, 3.4, HOP) + P(d, ch.pal.paw, ch.pal.k, 1.3) + P(toes, 'none', ch.pal.k, .8, ' opacity=".55"');
  }
  function chip(x, y) {
    // 2枚重ねのチップ（卓の上・遠近で楕円）
    const rx = 9.4, ry = 4.6, h = 4.2;
    return P(`M${pt(x - rx, y - h)}V${r1(y)}A${rx} ${ry} 0 0 0 ${pt(x + rx, y)}V${r1(y - h)}Z`, '#8E1D17', '#3A0A08', .8) +
      P(`M${pt(x - rx, y - h / 2)}A${rx} ${ry} 0 0 0 ${pt(x + rx, y - h / 2)}`, 'none', '#FFFFFF', 1.4, ' stroke-dasharray="2 2.8"') +
      P(E(x, y - h, rx, ry), '#D7362C', '#3A0A08', .8) + P(E(x, y - h, rx - 2, ry - 1.2), 'none', '#FFFFFF', 1.3, ' stroke-dasharray="2.2 2.6"');
  }
  function card(x, y, rot, extra) {
    return `<g transform="translate(${pt(x, y)}) rotate(${rot})">` +
      P('M-6.2 -22h12.4a1.6 1.6 0 0 1 1.6 1.6v18.8a1.6 1.6 0 0 1 -1.6 1.6h-12.4a1.6 1.6 0 0 1 -1.6 -1.6v-18.8a1.6 1.6 0 0 1 1.6 -1.6Z', '#2F58BA', '#FFFFFF', 1.5) +
      P('M-5 -19.6h10v17h-10Z', 'none', '#9DB8F2', .7) + (extra || '') + '</g>';
  }

  /* ---------- ポーズ ---------- */
  // 合図（hit/stand/surrender/reach）は縁の手前＝卓の上（y>100）で行う。はみ出しは最大で箱の高さの約16%。
  function pose(ch, p) {
    const [sL, sR] = ch.sh, [, rR] = ch.rest, S = 1.55;
    const x0 = ch.sig || 24, raise = ch.raise || [13, 38];
    let body = '', table = '';
    switch (p) {
      case 'hit': {
        // 人差し指で卓をトントン（上下）。接地の瞬間に波紋と火花。
        const y = 90, x = x0;
        table = paws(ch, [rR]) +
          `<g class="czx">${P(E(x, 112, 9.5, 3.2), 'none', HALO, 1.7)}${P(`M${pt(x - 13, 109)}l-4.5 -2.4M${pt(x + 13, 109)}l4.5 -2.4M${pt(x - 11.5, 115.5)}l-4.2 2.4M${pt(x + 11.5, 115.5)}l4.2 2.4`, 'none', HALO, 1.7)}</g>` +
          `<g class="cz">${arm(ch, sL[0], sL[1], x + 1, y - 4, 3)}${hand(ch, x, y, S, [180], { L: 6.5 })}</g>`;
        break;
      }
      case 'stand': {
        // 手のひらを下にして水平に振る（左右）。
        const x = x0 + 8, y = 104;
        table = paws(ch, [rR]) +
          P(`M${pt(x - 26, 96.5)}q-4.2 7.5 0 15M${pt(x + 26, 96.5)}q4.2 7.5 0 15M${pt(x - 32, 99)}q-3 5 0 10M${pt(x + 32, 99)}q3 5 0 10`, 'none', HALO, 2.2, ' opacity=".95"') +
          `<g class="cz">${arm(ch, sL[0], sL[1], x + 2, y - 5, 4)}${hand(ch, x, y, 1.65, [], { flat: 1 })}</g>`;
        break;
      }
      case 'surrender': {
        // 人差し指で賭け札の手前に横線を引く（左→右）。指先から線が伸びる。
        const y = 90, xa = x0 - 8;
        table = paws(ch, [rR]) +
          `<path class="czx" d="M${pt(xa, 111.6)}h34" fill="none" stroke="${HALO}" stroke-width="2.6" stroke-dasharray="34 40"/>` +
          `<g class="cz">${arm(ch, sL[0], sL[1], xa + 1, y - 4, 3)}${hand(ch, xa, y, S, [180], { L: 6.5 })}` +
          P(`M${pt(xa - 12, 86)}h-7M${pt(xa - 13, 92)}h-10M${pt(xa - 12, 98)}h-7`, 'none', HALO, 1.6, ' opacity=".9"') + '</g>';
        break;
      }
      case 'double': case 'split': {
        // 横にチップを足して、指1本（ダブル）／2本のV（スプリット）を立てる。
        const f = p === 'double' ? [0] : [-22, 22];
        body = `<g class="cz">${arm(ch, sL[0], sL[1], raise[0] + 1, raise[1] + 7, -3)}${hand(ch, raise[0], raise[1], 1.45, f, { L: 8.5 })}</g>`;
        table = paws(ch, [rR]) + chip(96, 109);
        break;
      }
      case 'squeeze': {
        const top = ch.eyes.y + (ch.eyes.r || ch.eyes.ry || 6) + 2.5, by = top + 22, cx = 55;
        const pw = C(cx - 10.5, by - 3, 5.2) + C(cx + 11.5, by - 5, 5.2);
        body = `<g class="cz" style="transform-origin:${cx}px ${r1(by)}px">` +
          arm(ch, sL[0], sL[1], cx - 10.5, by - 3, 4) + arm(ch, sR[0], sR[1], cx + 11.5, by - 5, -4) +
          card(cx - 3, by, -11, '') + card(cx + 3.5, by, 9, `<path class="czx" d="M-1.6 -22.6L7.6 -13.4L-1.6 -13.4Z" fill="#FFFFFF" stroke="#8A93A8" stroke-width=".6"/>`) +
          P(pw, HALO, HALO, 3.2, HOP) + P(pw, ch.pal.paw, ch.pal.k, 1.2) + '</g>';
        break;
      }
      case 'cheer': {
        body = `<g class="cz" style="transform-origin:${sL[0]}px ${sL[1]}px">${arm(ch, sL[0], sL[1], 13, 35, -4)}${hand(ch, 12, 31, 1.4, [])}</g>` +
          `<g class="cz2" style="transform-origin:${sR[0]}px ${sR[1]}px">${arm(ch, sR[0], sR[1], 97, 35, 4)}${hand(ch, 98, 31, 1.4, [])}</g>`;
        break;
      }
      case 'reach': {
        table = paws(ch, [rR]) +
          `<g class="cz" style="transform-origin:${sL[0]}px ${sL[1]}px">${arm(ch, sL[0], sL[1], 22, 104, 5)}${hand(ch, 21, 108, 1.5, [140, 180, 220], { L: 4.2 })}</g>`;
        break;
      }
      default:
        table = paws(ch, ch.rest);
    }
    return { body, table };
  }

  /* ---------- 公開API ---------- */
  function ensureCss() {
    if (cssDone || typeof document === 'undefined') return;
    cssDone = true;
    if (document.getElementById('cast-css')) return;
    const st = document.createElement('style');
    st.id = 'cast-css'; st.textContent = CAST_CSS;
    (document.head || document.documentElement).appendChild(st);
  }
  function pick(who) {
    if (typeof who === 'number') return CH[((who % CH.length) + CH.length) % CH.length];
    return CH.find(c => c.id === who) || CH[0];
  }
  function html(who, opts) {
    ensureCss();
    const o = opts || {}, ch = pick(who);
    const mood = MOODS.includes(o.mood) ? o.mood : 'idle';
    let ps = POSES.includes(o.pose) ? o.pose : 'rest';
    if (mood === 'out') ps = 'rest';
    const size = +o.size || 72, w = r1(size * RATIO);
    const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : (Date.now() / 1000) % 1e5;
    const cd = -(now + (+o.delay || 0));
    const g = 'castg' + (++uid), u = { g: `url(#${g})`, g2: `url(#${g}b)` }, p = ch.pal;
    let defs = `<radialGradient id="${g}" cx=".36" cy=".27" r=".86"><stop offset="0" stop-color="${p.l}"/><stop offset=".5" stop-color="${p.b}"/><stop offset=".93" stop-color="${p.e}"/></radialGradient>`;
    if (ch.g2) defs += `<radialGradient id="${g}b" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="${ch.g2[0]}"/><stop offset=".55" stop-color="${ch.g2[1]}"/><stop offset="1" stop-color="${ch.g2[2]}"/></radialGradient>`;
    const L = ch.L(u), pz = pose(ch, ps);
    const inner = P(L.sil, HALO, HALO, 5, HOP) + (L.back || '') + P(L.body, u.g, p.k, 1.6) + (L.sheen ? P(L.sheen, 'none', '#FFFFFF', 2.8, ' opacity=".3"') : '') + (L.patch || '') + eyes(ch, mood) +
      (L.top || '') + mouth(ch, mood) + (L.hold || '') + (L.hat || '') + pz.body + fx(ch, mood);
    return `<span class="cast c-${ch.id} m-${mood} p-${ps}" style="width:${w}px;height:${size}px;--cd:${cd.toFixed(3)}s" aria-hidden="true">` +
      `<svg class="cs" viewBox="0 0 110 100" focusable="false"><defs>${defs}</defs>` +
      `<svg class="cc" x="-30" y="-40" width="170" height="140" viewBox="-30 -40 170 140" overflow="hidden"><g class="cbd">${inner}</g></svg>` +
