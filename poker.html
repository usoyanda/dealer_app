/* 所作 → 手先の移動シナリオ。pre は操作前に控えた座標。
   手先はデッキ・各席のカード／ベット・ボード各枠・ポット・レーキボックス・マックなど、
   テーブル上の実座標へ運ぶ。体の中心より左の席には左手、右の席には右手を出す。 */
function buildMotion(key,arg,pre){
  if(!Dealer.svg)return null;
  const R=Dealer.rest(),rk=Dealer.rackR,rkL=Dealer.rackL;
  const P=(x,y)=>({x,y});
  const hand=x=>x<Dealer.cx-6?'l':'r';
  const home=()=>({t:0,r:P(R.rx,R.ry),l:P(R.lx,R.ly),open:0,prop:'',hold:'r'});
  const deck=ptOf('#deckBox',0.5,0.5),potP=ptOf('#potSpot'),burnP=ptOf('#burnBox'),muckP=ptOf('#muckBox'),rakeP=ptOf('#rakeBox');
  const seatCards=s=>ptOf(`[data-cards="${s}"]`)||svgPt(seatPt(s,FR.cards));
  const seatStack=s=>svgPt(seatPt(s,FR.stackChip||.9));
  /* from から to へ物を運ぶ標準の所作（手にとる→持ち上げて運ぶ→置く→戻る） */
  const carry=(from,to,prop,h,gap)=>{
    const F=(t,pt,x)=>Object.assign({t,hold:h,[h]:pt},x||{});
    return[{t:0,prop:'',hold:h},
      F(200,from,{prop:''}),F(340,from,{prop}),
      F(620,P((from.x+to.x)/2,Math.min(from.y,to.y)-18),{prop}),
      F(820,to,{prop}),F(930,to,{prop:''}),
      Object.assign({t:930+(gap||290)},{r:P(R.rx,R.ry),l:P(R.lx,R.ly),open:0})];
  };
  const point=(c)=>{
    const h=hand(c.x);
    return[{t:0,hold:h,open:0},{t:300,hold:h,[h]:P(c.x,c.y-26),open:.8},{t:760,hold:h,[h]:P(c.x,c.y-26),open:.8},
      {t:1060,r:P(R.rx,R.ry),l:P(R.lx,R.ly),open:0}];
  };
  switch(key){
    case 'moveButton':{
      const a=pre.puck,b=ptOf('#puck');if(!a||!b)return null;
      return carry(a,b,'puck',hand(b.x),320);
    }
    case 'selectSB':case 'selectBB':case 'nextActor':case 'showFirst':{
      const c=seatCards(+arg);if(!c)return null;
      return point(c);
    }
    case 'shuffleCut':{
      if(!deck)return null;
      const a=P(deck.x-14,deck.y),b=P(deck.x+14,deck.y);
      return[{t:0,prop:'cards',hold:'both'},
        {t:240,l:a,r:b,open:.4,prop:'cards'},{t:420,l:P(a.x+10,a.y+8),r:P(b.x-10,b.y+8),prop:'cards'},
        {t:600,l:a,r:b,prop:'cards'},{t:780,l:P(a.x+10,a.y+8),r:P(b.x-10,b.y+8),prop:'cards'},
        {t:980,l:P(a.x-8,a.y),r:P(b.x+8,b.y),prop:'cards'},{t:1250,l:a,r:b,prop:'cards'},
        {t:1600,r:P(R.rx,R.ry),l:P(R.lx,R.ly),open:0,prop:''}];
    }
    case 'dealHole':{
      const c=seatCards(+arg);if(!c||!deck)return null;
      return carry(deck,c,'card',hand(c.x),180);
    }
    case 'burn':{
      if(!deck||!burnP)return null;
      return carry(deck,burnP,'card','l',220);
    }
    case 'dealFlop':case 'dealTurn':case 'dealRiver':{
      if(!deck)return null;
      const from=pre.boardLen;
      const n=key==='dealFlop'?3:1;
      const seq=[{t:0,prop:'',hold:'r'},{t:200,r:P(deck.x,deck.y)}];
      let t=200;
      for(let i=0;i<n;i++){
        const s=ptOf(`[data-slot="${from+i}"]`);if(!s)return null;
        seq.push({t:t+140,r:P(deck.x,deck.y),prop:'card'});
        seq.push({t:t+400,r:P((deck.x+s.x)/2,Math.min(deck.y,s.y)-16),prop:'card'});
        seq.push({t:t+620,r:P(s.x,s.y),prop:'card'});
        seq.push({t:t+720,r:P(s.x,s.y),prop:''});
        t+=720;
      }
      seq.push({t:t+300,r:P(R.rx,R.ry),l:P(R.lx,R.ly)});
      return seq;
    }
    case 'openHands':case 'callPot':case 'callSide':case 'ruling':case 'confirmCall':case 'pickWinner':
      return[{t:0,nod:0},{t:240,nod:1},{t:560,nod:0},{t:780,nod:0}];
    case 'gather':{
      if(!potP)return null;
      const bs=(pre.bets||[]).filter(b=>b.pt);
      if(!bs.length)return null;
      const seq=[{t:0,prop:'',hold:'r'}];let t=0;
      bs.forEach(b=>{
        const h=hand(b.pt.x);
        seq.push({t:t+240,hold:h,[h]:P(b.pt.x,b.pt.y),prop:''});
        seq.push({t:t+360,hold:h,[h]:P(b.pt.x,b.pt.y),prop:'chips'});
        seq.push({t:t+640,hold:h,[h]:P(potP.x,potP.y),prop:'chips'});
        seq.push({t:t+740,hold:h,[h]:P(potP.x,potP.y),prop:''});
        t+=540;
      });
      seq.push({t:t+520,r:P(R.rx,R.ry),l:P(R.lx,R.ly)});
      return seq;
    }
    case 'chipPay':{
      const k=pre.exKey;
      if(k==='takeRake'){
        if(!potP||!rakeP)return null;
        return carry(potP,rakeP,'chips','r',280);
      }
      if(k==='returnUncalled'){
        const b=pre.bets.find(x=>x.seat===pre.seat),to=seatStack(pre.seat);
        if(!b||!b.pt||!to)return null;
        return carry(P(b.pt.x,b.pt.y),to,'chips',hand(to.x),280);
      }
      if(k==='payTo'){
        const to=seatStack(pre.seat);if(!potP||!to)return null;
        return carry(potP,to,'chips',hand(to.x),320);
      }
      return null;
    }
    case 'cleanHands':{
      const y=Math.max(Dealer.band*0.42,Dealer.band-56),w=64*Dealer.s;
      return[{t:0,open:0},
        {t:340,r:P(Dealer.cx+w,y),l:P(Dealer.cx-w,y),open:1},
        {t:980,r:P(Dealer.cx+w+8,y-8),l:P(Dealer.cx-w-8,y-8),open:1},
        {t:1400,r:P(R.rx,R.ry),l:P(R.lx,R.ly),open:0}];
    }
    case 'clearCards':{
      if(!muckP)return null;
      const c=svgPt(slotPt(2))||potP;
      return[{t:0,prop:'',hold:'both'},
        {t:260,r:P(c.x+40,c.y),l:P(c.x-40,c.y),open:.6},
        {t:560,r:P(c.x+6,c.y),l:P(c.x-6,c.y),open:.3,prop:'cards'},
        {t:900,r:P(c.x+(muckP.x-c.x)*0.5,c.y-24),prop:'cards'},
        {t:1240,r:P(muckP.x,muckP.y),prop:'cards'},
        {t:1380,r:P(muckP.x,muckP.y),prop:''},
        {t:1700,r:P(R.rx,R.ry),l:P(R.lx,R.ly),open:0}];
    }
  }
  return null;
}

/* ---- コンソール ---- */
function btn(key,label,cls,arg){
  const a=arg!==undefined?` data-arg="${esc(arg)}"`:'';
  return `<button class="act${cls?' '+cls:''}" data-act="${key}"${a}>${String(label).replace(/（(.+?)）/,'<span class="sub">（$1）</span>')}</button>`;
}
function actionKeys(G,ex){
  if(!ex)return[];
  switch(G.phase){
    case 'shuffle':return['shuffleCut'];
    case 'endbet':return uncalledInfo(G)&&!G.flags.retDone?['returnUncalled','gather']:['gather'];
    case 'street':return['burn','dealFlop','dealTurn','dealRiver'];
    case 'runout':return['openHands'];
    case 'showdown':case 'award':
      if(ex.key==='openHands')return['openHands'];
      if(ex.key==='takeRake')return['takeRake'];
      return[];
    case 'close':return['cleanHands','clearCards'];
  }
  return[];
}
const PHASE_NAME={idle:'待機中',button:'ボタンの移動',blinds:'ブラインドの確認',shuffle:'シャッフル＆カット',deal:'ホールカードを配る',
  bet:'ベッティングラウンド',endbet:'ベットの集計',runout:'オールイン：手札を開く',street:'ボードを出す',showdown:'ショーダウン',award:'ポットの払い出し',close:'締め',done:'ラウンド終了'};
function streetJa(s){return s==='pre'?'プリフロップ':s==='flop'?'フロップ':s==='turn'?'ターン':'リバー';}

function promptFor(G,ex){
  const F=G.flags;
  switch(ex.key){
    case 'moveButton':return['ディーラーボタンを動かす席を選んでください。','前回の席から時計回り（番号が増える向き）に1つ隣。初回は抽選結果の席。'];
    case 'selectSB':return['スモールブラインドの席はどこですか。','ボタンの左隣＝時計回りで1つ先。'];
    case 'selectBB':return['ビッグブラインドの席はどこですか。','SBのさらに左隣。'];
    case 'shuffleCut':return['ブラインドが出そろいました。デッキを準備してください。','シャッフル→ボックス→カット。'];
    case 'dealHole':return[`次にカードを配る席は？（${F.dealt+1}／${G.holeN*SEATS}枚目）`,`SB（${G.sbSeat}番席）から時計回りに1枚ずつ、${G.holeN}周。`];
    case 'nextActor':return[`${streetJa(G.bet.street)}：次にアクションする席を指してください。`,'フォールド・オールイン済みの席は飛ばす。時計回り。'];
    case 'ruling':return['この宣言をどう判定しますか。','最小レイズ先＝現在の最高額＋直前の増分。オールインは例外。'];
    case 'confirmCall':return['コール額はいくらですか。','コール額＝最高額−その席がすでに出した額。'];
    case 'returnUncalled':case 'gather':case 'callPot':
      return[G.flags.gathered||ex.key==='callPot'?'ポット額をコールしてください。':'ベッティングラウンドが終わりました。','コールされなかった分は返す→ベットを集める→ポット額をコール。'];
    case 'callSide':return[`${potName(ex.potIdx)}の額をコールしてください。`,'一番少ないオールイン額までの層がメイン。上の層がサイド。'];
    case 'burn':case 'dealFlop':case 'dealTurn':case 'dealRiver':
      return[`次は${G.board.length===0?'フロップ':G.board.length===3?'ターン':'リバー'}です。正しい所作を選んでください。`,'先にバーン、その後にボード（フロップは3枚同時）。'];
    case 'openHands':return['手札を開かせてください。',G.phase==='runout'?'オールインが完了したら、ボードを出す前に全員が手札を開く。':'最初の席の後、全員が時計回りに開く。'];
    case 'showFirst':return['どの席から手札を見せますか。','最後にベット／レイズした席から。ベットがなければボタンの左から。'];
    case 'pickWinner':return[`${G.pots[ex.potIdx].name}の勝者をコールしてください。`,G.game==='omaha'?'オマハ：ホールから必ず2枚＋ボードから必ず3枚。':'ホールとボードの7枚から最強の5枚。'];
    case 'takeRake':return['レーキを徴収してください。','ポットを払い出す前に、ポット比率で計算。フロップ前に終わったゲームは取らない。'];
    case 'payTo':return['ポットを払い出す席を選んでください。','メイン→サイドの順。チョップは端数の$1をボタンの左から先の席へ。'];
    case 'cleanHands':case 'clearCards':return['締めの所作を選んでください。','クリーンハンド → カードを片付ける。'];
  }
  return['次の所作を選んでください。',''];
}

function renderConsole(){
  let prompt='',actions='',extra='';
  const fb=G.lastFb?`<div class="fb ${G.lastFb.t}">${esc(G.lastFb.text)}</div>`:'';
  const ex=EXNOW;
  const df=currentDifficulty(G);
  if(G.pending){
    const p=G.pending,sum=p.chips.reduce((a,b)=>a+b,0);
    prompt=p.ex.key==='takeRake'?'徴収するレーキ分のチップを出してください':p.ex.key==='returnUncalled'?'返すチップを出してください':'払い出すチップを出してください';
    const stack=p.chips.length?p.chips.map(d=>`<span class="mini-chip ch-${d}">${d}</span>`).join(''):'<span class="stack-empty">まだチップがありません</span>';
    actions=`<div class="tray">${CHIPS.slice().reverse().map(d=>`<button class="tray-chip ch-${d}" data-act="chip" data-arg="${d}" aria-label="$${d}チップを1枚出す">$${d}</button>`).join('')}</div>
      <div class="stack"><div class="stack-row">${stack}</div><div class="stack-total">合計 <b>${fmt$(sum)}</b>／${p.chips.length}枚</div></div>
      <div class="actions">${btn('chipUndo','1枚戻す')}${btn('chipClear','すべて戻す')}${btn('chipPay','確定する','primary wide')}</div>`;
    if(G.opened&&G.phase!=='bet')extra=handsListHTML(G);
  }else if(G.phase==='done'){
    const r=G.round;
    const errs=r.errors.length?`<ul>${r.errors.map(e=>`<li>【${CAT_NAME[e.cat]}】${esc(e.why)}</li>`).join('')}</ul>`:'<p>ミスなし。全手順を正しく進行できました。</p>';
    const rows=Object.entries(STATS.cats).map(([k,c])=>{const t=c.ok+c.ng;return `<tr><td>${CAT_NAME[k]}</td><td>${c.ok}</td><td>${c.ng}</td><td>${t?Math.round(c.ok/t*100)+'%':'—'}</td></tr>`;}).join('');
    const notes=r.notes.length?`<div class="phase">チップの出し方（減点なし）</div><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'';
    const hints=r.hints?`<p>質問チャットでヒントを使った回数：${r.hints}回（答えを見た場面は、自力で判断できたか振り返ってください）</p>`:'';
    prompt=`<div class="summary"><div class="next-top">${btn('start','次のラウンドへ','primary')}</div><h3>ラウンド${r.no} 終了：正解${r.ok}／ミス${r.err}</h3>${errs}${hints}${notes}<div class="phase stats-label">通算成績（カテゴリ別）</div><table class="stat-table"><thead><tr><th>カテゴリ</th><th>正解</th><th>ミス</th><th>正答率</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    actions=btn('start','次のラウンドへ','primary');
  }else if(G.phase==='idle'){
    prompt='ラウンドを開始してください。ボタンの移動から順に進行します。';
    actions=btn('start','ラウンドを開始','primary');
  }else if(ex){
    const pp=promptFor(G,ex);
    prompt=`${pp[0]}${pp[1]?`<span class="hint">${pp[1]}</span>`:''}`;
    if(ex.talk)extra+=`<div class="talk">${esc(ex.talk)}</div>`;
    if(G.phase==='bet'&&G.opts.showHints&&df.board)extra+=boardInfoHTML(G);
    if(MC_KEYS.includes(ex.key)){
      actions=`<div class="actions">${ex.callSet.opts.map(o=>btn(ex.key,o,'wide',o)).join('')}</div>`;
      if(ex.key==='pickWinner')extra=handsListHTML(G)+extra;
    }else if(SEAT_KEYS.includes(ex.key)){
      actions=`<div class="actions seatgrid">${[1,2,3,4,5,6].map(s=>btn(ex.key,`${s}番席`,'',String(s))).join('')}</div>`;
      if(ex.key==='showFirst'||ex.key==='payTo')extra=handsListHTML(G)+extra;
    }else{
      const keys=actionKeys(G,ex);
      actions=`<div class="actions">${keys.map(k=>btn(k,LABEL[k])).join('')}</div>`;
      if(G.opened)extra=handsListHTML(G)+extra;
    }
  }
  $('console').innerHTML=`<div class="phase">${PHASE_NAME[G.phase]||''}${G.phase==='bet'&&G.bet?`（${streetJa(G.bet.street)}）`:''}</div>${G.phase==='done'&&!G.pending?prompt:`<div class="prompt">${prompt}</div>`}${fb}${extra}${G.pending?actions:(G.phase==='done'?'':actions)}`;
}

    <div class="row"><label for="optSpeech">発声を読み上げる${hasTTS?'':'（このブラウザは非対応）'}</label><input type="checkbox" id="optSpeech"${o.voice?' checked':''}${hasTTS?'':' disabled'}></div>
    <p class="note">ゲームの種類は次のラウンドから反映されます。状況ボードは難易度ADVANCED以降では自動的に消えます（現在：<b>${df.label}</b>）。</p>
    <p class="note">ノーリミット・6人掛け。席番号はディーラーの左隣（画面右端）が1番で、時計回り（画面では右から左）に2〜6番。ボタン・配り・アクションはすべてこの向きです。</p>

    <h4>現在のテーブル</h4>
    <p class="note"><b>${gameName(G.game)}</b>／ブラインド${fmt$(T.sb)}・${fmt$(T.bb)}<br>${esc(rakeRuleText(T))}</p>

    <div class="payout-guide">
      <div class="phase">ハンドの強さ（強い順）</div>
      <ul>
        <li>ストレートフラッシュ（A-K-Q-J-10のスート揃いがロイヤル）</li><li>フォーカード</li><li>フルハウス</li><li>フラッシュ</li>
        <li>ストレート（A-2-3-4-5は5ハイの最弱ストレート）</li><li>スリーカード</li><li>ツーペア</li><li>ワンペア</li><li>ハイカード</li>
      </ul>
      <p class="note">同じ役ならペアの数字→残りの札（キッカー）の順で比べます。5枚がまったく同じなら引き分けで、ポットを均等に分けます。オマハは「ホールから必ず2枚＋ボードから必ず3枚」。</p>
    </div>
    <div class="payout-guide">
      <div class="phase">金額計算のコツ</div>
      <ul>
        <li><b>コール額</b>：最高額−その席がすでに出した額（ブラインドも出した額に含む）。</li>
        <li><b>最小レイズ先</b>：現在の最高額＋直前の増分。増分が大きければフルレイズで全員に行動権が戻る。フルレイズ未満のオールインは戻さない。</li>
        <li><b>コールされなかった分</b>：最高額−次点の額を、集める前に本人へ返す。</li>
        <li><b>サイドポット</b>：一番少ないオールイン額までを全員から切り取ってメイン。残りをその上の層としてサイドへ。フォールドした分も層の中に含む。</li>
        <li><b>レーキ</b>：5%は10%の半分、10%は桁をひとつ下げる。$1未満は切り捨て、上限を超えたら上限。フロップ前に終わったゲームは取らない。</li>
        <li><b>チョップ</b>：ポット÷人数。余りの$1はボタンの左から時計回りで先の勝者へ1枚ずつ。</li>
      </ul>
    </div>
    <button class="danger" data-act="resetStats">通算成績をリセット</button>`;
}

function render(){
  EXNOW=G.pending?null:expected(G);
  renderMeta();renderTable();renderCaption();renderConsole();renderLog();
}

/* ---- 質問チャット ---- */
const CHAT=[];
function chatPush(who,text,hint){CHAT.push({who,text,hint:!!hint});if(CHAT.length>80)CHAT.shift();}
function renderChat(){
  const box=$('chatBody');if(!box)return;
  box.innerHTML=CHAT.map(m=>`<div class="cm ${m.who}${m.hint?' hint':''}">${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('');
  box.scrollTop=box.scrollHeight;
  $('chatSug').innerHTML=CHAT_SUGGEST.map(s=>`<button type="button" data-act="chatAsk" data-arg="${esc(s)}">${esc(s)}</button>`).join('');
}
function chatSend(text){
  text=String(text||'').trim();if(!text)return;
  chatPush('me',text);
  const r=chatAnswer(G,text);
  chatPush('bot',r.text,r.hint);
  if(r.hint&&G.round&&G.phase!=='done'){G.round.hints=(G.round.hints||0)+1;}
  renderChat();
}
function toggleChat(open){
  const p=$('chat'),show=open===undefined?p.hidden:open;
  p.hidden=!show;$('btnChat').setAttribute('aria-expanded',String(show));
  if(show){
    if(!CHAT.length)chatPush('bot',CHAT_INTRO);
    renderChat();
    if(window.matchMedia('(min-width:601px)').matches)$('chatInput').focus();
  }
}

let signTimer=0;
function scheduleSignClose(){
  clearTimeout(signTimer);
  if(!G.signOpen)return;
  signTimer=setTimeout(()=>{if(G.signOpen){G.signOpen=false;render();}},5200);
}

function doAct(key,arg){
  const prevPending=!!G.pending,prevPhase=G.phase;
  const exNow=G.pending?G.pending.ex:EXNOW;
  const pre={
    exKey:exNow?exNow.key:null,
    seat:exNow&&(exNow.seat||exNow.correct)?(exNow.seat||exNow.correct):null,
    puck:ptOf('#puck'),
    bets:G.players.filter(p=>p.bet>0).map(p=>({seat:p.seat,pt:ptOf(`[data-bet="${p.seat}"]`)})),
    boardLen:G.board.length,
    cur:G.bet&&G.bet.cur?G.bet.cur.seat:null
  };
  if(G.signOpen&&key!=='start'){G.signOpen=false;clearTimeout(signTimer);}
  const dealtBefore=G.flags.dealt,boardBefore=G.board.length,openedBefore=G.opened;
  const r=act(G,key,arg);
  if(r&&r.ok){
    if(key==='dealHole')G.anim={hole:+arg};
    else if(G.board.length>boardBefore)G.anim={boardFrom:boardBefore};
    else if(G.opened&&!openedBefore)G.anim={open:true};
  }
  if(r){STATS.cats[r.cat][r.ok?'ok':'ng']++;}
  if(G.phase==='done'&&!G._counted){STATS.rounds++;G._counted=true;}
  if(G.phase!=='done')G._counted=false;
  save(STORE_STATS,STATS);render();
  if(prevPhase==='done'||prevPhase==='idle')scheduleSignClose();
  if(r&&r.ok&&G.opts.showDealer!==false){
    const mk=key==='chipPay'?'chipPay':key;
    const frames=buildMotion(mk,arg,pre);
    if(frames)Dealer.play(frames,MOTION_LABEL[key==='chipPay'?(pre.exKey||key):key]||'');
  }
  if((G.phase==='done'&&prevPhase!=='done')||(G.pending&&!prevPending)){
    const el=G.pending?document.querySelector('.tray'):$('console');
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='toggleSettings'){const p=$('settings');p.hidden=!p.hidden;$('btnSettings').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)renderSettings();return;}
  if(a==='toggleVoice'){
    G.opts.voice=!G.opts.voice;save(STORE_OPTS,G.opts);
    if('speechSynthesis' in window){if(G.opts.voice)speak([G.caption].filter(c=>c.en));else speechSynthesis.cancel();}
    renderCaption();return;
  }
  if(a==='toggleChat'){toggleChat();return;}
  if(a==='chatAsk'){chatSend(el.dataset.arg);return;}
  if(a==='closeSign'){G.signOpen=false;clearTimeout(signTimer);render();return;}
  if(a==='replay'){Dealer.replay();return;}
  if(a==='resetStats'){STATS=emptyStats();save(STORE_STATS,STATS);render();return;}
  doAct(a,el.dataset.arg);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='optGame')G.opts.game=e.target.value;
  else if(id==='optAdaptive')G.opts.adaptiveDifficulty=e.target.checked;
  else if(id==='optChop')G.opts.chopFocus=e.target.checked;
  else if(id==='optHints')G.opts.showHints=e.target.checked;
  else if(id==='optDealer'){G.opts.showDealer=e.target.checked;Dealer.stop();}
  else if(id==='optSpeed')G.opts.dealerSpeed=+e.target.value;
  else if(id==='optSpeech'){G.opts.voice=e.target.checked;if(!G.opts.voice&&'speechSynthesis' in window)speechSynthesis.cancel();}
  else return;
  save(STORE_OPTS,G.opts);render();
});
$('chatForm').addEventListener('submit',e=>{
  e.preventDefault();
  const i=$('chatInput');chatSend(i.value);i.value='';
  if(window.matchMedia('(min-width:601px)').matches)i.focus();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('chat').hidden)toggleChat(false);
});
render();

</script>
</body>
</html>
